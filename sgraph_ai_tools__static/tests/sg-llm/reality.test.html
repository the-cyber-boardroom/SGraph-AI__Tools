<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sg-llm-reality — Tests</title>
<style>
    body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 24px; margin: 0; }
    h1 { color: #7c9ef8; margin: 0 0 8px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 24px; }
    .test-summary { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 10px 16px; border-radius: 6px; }
    .test-summary.pass { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .test-summary.fail { background: #2a0d0d; color: #f87171; border: 1px solid #991b1b; }
    .suite { margin-bottom: 20px; }
    .suite-title { color: #a0aec0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .test { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 4px 0; }
    .test .icon { flex-shrink: 0; }
    .pass .icon { color: #4ade80; }
    .fail .icon { color: #f87171; }
    .fail .msg { color: #f87171; }
    .detail { color: #64748b; font-size: 12px; margin-top: 2px; }
    h2 { color: #a0aec0; font-size: 14px; margin: 32px 0 8px; border-top: 1px solid #1e2a45; padding-top: 16px; }
    .demo-reality { width: 420px; height: 500px; border: 1px solid #222d4d; border-radius: 8px; overflow: hidden; margin-top: 12px; }
</style>
</head>
<body>
<h1>sg-llm-reality</h1>
<p class="subtitle">Reality constructor orchestrator — block management, events, send modes, attachment & bundle awareness</p>
<div class="test-summary" id="summary">Running…</div>
<div id="results"></div>

<h2>Interactive demo</h2>
<p style="color:#64748b;font-size:12px;">Live &lt;sg-llm-reality&gt;. Add blocks, edit them, watch REALITY_CHANGED events in the console.</p>
<div id="demo-container" style="display:flex;gap:16px;flex-wrap:wrap;">
    <div class="demo-reality" id="reality-demo"></div>
    <div id="event-log" style="font-size:11px;color:#64748b;max-width:340px;max-height:500px;overflow-y:auto;"></div>
</div>

<script type="module">
import { SgLlmReality } from '/components/llm/sg-llm-reality/v0/v0.1/v0.1.0/sg-llm-reality.js';
import { SGL_LLM }      from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import { createBlock }  from '/components/llm/sg-llm-reality/v0/v0.1/v0.1.0/sg-llm-reality-core.js';

// ── Test harness ─────────────────────────────────────────────────────────────

let passed = 0;
let failed = 0;
const suites = [];
let currentSuite = null;

function suite(name) {
    currentSuite = { name, tests: [] };
    suites.push(currentSuite);
}

function test(name, fn) {
    try {
        fn();
        currentSuite.tests.push({ name, ok: true });
        passed++;
    } catch (err) {
        currentSuite.tests.push({ name, ok: false, msg: err.message });
        failed++;
    }
}

function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) {
    const as = JSON.stringify(a), bs = JSON.stringify(b);
    if (as !== bs) throw new Error(msg || `Expected ${bs}, got ${as}`);
}

// Helper: create a mounted reality with a shared bus div
function makeReality() {
    const bus = document.createElement('div');
    const reality = document.createElement('sg-llm-reality');
    bus.appendChild(reality);
    document.body.appendChild(bus);
    return { bus, reality, cleanup: () => bus.remove() };
}

// Helper: dispatch a SGL_LLM event on the bus
function dispatch(bus, eventName, detail = {}) {
    bus.dispatchEvent(new CustomEvent(eventName, { detail, bubbles: true, composed: true }));
}

// Helper: collect the next event from the bus
function nextEvent(bus, eventName) {
    return new Promise(resolve => {
        bus.addEventListener(eventName, (e) => resolve(e.detail), { once: true });
    });
}

// ── Tests ────────────────────────────────────────────────────────────────────

suite('Custom element');

test('sg-llm-reality is registered', () => {
    assert(customElements.get('sg-llm-reality') !== undefined, 'not registered');
});

test('element can be created', () => {
    const el = document.createElement('sg-llm-reality');
    assert(el instanceof SgLlmReality);
});

// ── Block management ──────────────────────────────────────────────────────────

suite('Block management');

test('add system block — REALITY_CHANGED fires', async () => {
    const { bus, reality, cleanup } = makeReality();
    const p = nextEvent(bus, SGL_LLM.REALITY_CHANGED);
    reality.shadowRoot.querySelector('[data-type="system"]').click();
    const detail = await p;
    assert(Array.isArray(detail.messages), 'messages should be array');
    assert(typeof detail.tokenCount === 'number', 'tokenCount should be number');
    cleanup();
});

test('add question block — BLOCK_ADDED fires', async () => {
    const { bus, reality, cleanup } = makeReality();
    const p = nextEvent(bus, SGL_LLM.BLOCK_ADDED);
    reality.shadowRoot.querySelector('[data-type="question"]').click();
    const detail = await p;
    assert(detail.block?.type === 'question', 'block type should be question');
    cleanup();
});

test('added block appears in REALITY_CHANGED messages', async () => {
    const { bus, reality, cleanup } = makeReality();
    // Add system block
    let lastDetail = null;
    bus.addEventListener(SGL_LLM.REALITY_CHANGED, (e) => { lastDetail = e.detail; });
    reality.shadowRoot.querySelector('[data-type="system"]').click();
    await Promise.resolve(); // flush
    assert(lastDetail !== null, 'REALITY_CHANGED should have fired');
    cleanup();
});

test('BLOCK_REMOVED fires after block remove', async () => {
    const { bus, reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="system"]').click();
    await Promise.resolve();
    // Click ✕ on the block
    const p = nextEvent(bus, SGL_LLM.BLOCK_REMOVED);
    reality.shadowRoot.querySelector('sg-llm-block')
        ?.shadowRoot.getElementById('remove-btn').click();
    const detail = await p;
    assert(typeof detail.blockId === 'string', 'blockId should be string');
    cleanup();
});

test('removing block shrinks messages array', async () => {
    const { bus, reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="system"]').click();
    reality.shadowRoot.querySelector('[data-type="question"]').click();
    await Promise.resolve();

    let lastDetail = null;
    bus.addEventListener(SGL_LLM.REALITY_CHANGED, (e) => { lastDetail = e.detail; });

    // Remove one block
    reality.shadowRoot.querySelector('sg-llm-block')
        ?.shadowRoot.getElementById('remove-btn').click();
    await Promise.resolve();

    // Should now have 1 block (question only)
    assert(lastDetail !== null);
    cleanup();
});

// ── REALITY_CHANGED detail ────────────────────────────────────────────────────

suite('REALITY_CHANGED detail');

test('detail has messages, tokenCount, estimatedCost, imageCount', async () => {
    const { bus, reality, cleanup } = makeReality();
    const p = nextEvent(bus, SGL_LLM.REALITY_CHANGED);
    reality.shadowRoot.querySelector('[data-type="question"]').click();
    const detail = await p;
    assert('messages'      in detail, 'missing messages');
    assert('tokenCount'    in detail, 'missing tokenCount');
    assert('estimatedCost' in detail, 'missing estimatedCost');
    assert('imageCount'    in detail, 'missing imageCount');
    cleanup();
});

test('disabled block excluded from messages', async () => {
    const { bus, reality, cleanup } = makeReality();
    // Add a system block
    reality.shadowRoot.querySelector('[data-type="system"]').click();
    await Promise.resolve();

    let lastDetail = null;
    bus.addEventListener(SGL_LLM.REALITY_CHANGED, (e) => { lastDetail = e.detail; });

    // Disable the block via toggle
    reality.shadowRoot.querySelector('sg-llm-block')
        ?.shadowRoot.getElementById('toggle-btn').click();
    await Promise.resolve();

    // Messages should have no system role
    if (lastDetail) {
        assert(!lastDetail.messages.some(m => m.role === 'system'), 'disabled system should be excluded');
    }
    cleanup();
});

// ── Send ──────────────────────────────────────────────────────────────────────

suite('Send');

test('send-btn click fires SGL_LLM.SEND with mode:build', async () => {
    const { bus, reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="question"]').click();
    await Promise.resolve();

    const p = nextEvent(bus, SGL_LLM.SEND);
    reality.shadowRoot.getElementById('send-btn').click();
    const detail = await p;
    assertEqual(detail.mode, 'build');
    assert(Array.isArray(detail.messages), 'messages should be array');
    cleanup();
});

test('send disabled while busy (REQUEST_START)', async () => {
    const { bus, reality, cleanup } = makeReality();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    const btn = reality.shadowRoot.getElementById('send-btn');
    assert(btn.disabled, 'send-btn should be disabled while busy');
    cleanup();
});

test('send re-enabled after REQUEST_COMPLETE', async () => {
    const { bus, reality, cleanup } = makeReality();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: 'response text' });
    await Promise.resolve();
    const btn = reality.shadowRoot.getElementById('send-btn');
    assert(!btn.disabled, 'send-btn should be re-enabled after REQUEST_COMPLETE');
    cleanup();
});

test('send re-enabled after REQUEST_ERROR', async () => {
    const { bus, reality, cleanup } = makeReality();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_ERROR, { error: 'fail' });
    await Promise.resolve();
    assert(!reality.shadowRoot.getElementById('send-btn').disabled, 'should re-enable on error');
    cleanup();
});

// ── Memory update mode ────────────────────────────────────────────────────────

suite('Memory update mode');

test('memory-btn hidden when no memory block', () => {
    const { reality, cleanup } = makeReality();
    const btn = reality.shadowRoot.getElementById('memory-btn');
    assert(btn.classList.contains('hidden'), 'memory-btn should be hidden without memory block');
    cleanup();
});

test('memory-btn visible after adding memory block', async () => {
    const { bus, reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="memory"]').click();
    await Promise.resolve();
    const btn = reality.shadowRoot.getElementById('memory-btn');
    assert(!btn.classList.contains('hidden'), 'memory-btn should be visible with memory block');
    cleanup();
});

test('memory-btn click fires SEND with mode:memory-update', async () => {
    const { bus, reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="memory"]').click();
    await Promise.resolve();

    const p = nextEvent(bus, SGL_LLM.SEND);
    reality.shadowRoot.getElementById('memory-btn').click();
    const detail = await p;
    assertEqual(detail.mode, 'memory-update');
    // Memory update messages: [system, user]
    assertEqual(detail.messages.length, 2);
    assertEqual(detail.messages[0].role, 'system');
    cleanup();
});

test('REQUEST_COMPLETE with pending memory-update applies content to memory block', async () => {
    const { bus, reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="memory"]').click();
    await Promise.resolve();

    // Trigger memory update send
    reality.shadowRoot.getElementById('memory-btn').click();
    await Promise.resolve();

    // Simulate response
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: '- new memory content' });
    await Promise.resolve();

    const state = reality.getState();
    const mem = state.blocks.find(b => b.type === 'memory');
    assertEqual(mem?.content, '- new memory content');
    cleanup();
});

// ── Attachment handling ───────────────────────────────────────────────────────

suite('Attachment handling');

test('ATTACHMENT_ADDED (text) creates a context block', async () => {
    const { bus, reality, cleanup } = makeReality();

    const p = nextEvent(bus, SGL_LLM.BLOCK_ADDED);
    dispatch(bus, SGL_LLM.ATTACHMENT_ADDED, {
        attachment: { id: 'att-1', type: 'text', name: 'readme.md', size: 100, textContent: 'Hello world' }
    });
    const detail = await p;
    assertEqual(detail.block.type, 'context');
    assertEqual(detail.block.label, 'readme.md');
    cleanup();
});

test('ATTACHMENT_ADDED (image) increases imageCount in REALITY_CHANGED', async () => {
    const { bus, reality, cleanup } = makeReality();

    const p = nextEvent(bus, SGL_LLM.REALITY_CHANGED);
    dispatch(bus, SGL_LLM.ATTACHMENT_ADDED, {
        attachment: { id: 'img-1', type: 'image', name: 'photo.png', size: 50000, dataUrl: 'data:image/png;base64,abc' }
    });
    const detail = await p;
    assertEqual(detail.imageCount, 1);
    cleanup();
});

test('ATTACHMENT_REMOVED (image) decreases imageCount', async () => {
    const { bus, reality, cleanup } = makeReality();

    dispatch(bus, SGL_LLM.ATTACHMENT_ADDED, {
        attachment: { id: 'img-1', type: 'image', name: 'x.png', size: 100, dataUrl: 'data:image/png;base64,x' }
    });
    await Promise.resolve();

    const p = nextEvent(bus, SGL_LLM.REALITY_CHANGED);
    dispatch(bus, SGL_LLM.ATTACHMENT_REMOVED, { id: 'img-1' });
    const detail = await p;
    assertEqual(detail.imageCount, 0);
    cleanup();
});

test('ATTACHMENTS_CLEARED removes attachment context blocks', async () => {
    const { bus, reality, cleanup } = makeReality();

    dispatch(bus, SGL_LLM.ATTACHMENT_ADDED, {
        attachment: { id: 'att-1', type: 'text', name: 'doc.md', size: 10, textContent: 'x' }
    });
    await Promise.resolve();

    const p = nextEvent(bus, SGL_LLM.BLOCK_REMOVED);
    dispatch(bus, SGL_LLM.ATTACHMENTS_CLEARED, {});
    await p;

    const state = reality.getState();
    assert(!state.blocks.some(b => b.type === 'context'), 'context block should be removed');
    cleanup();
});

// ── Bundle restore ────────────────────────────────────────────────────────────

suite('Bundle restore');

test('BUNDLE_LOADED restores blocks from bundle.reality.blocks', async () => {
    const { bus, reality, cleanup } = makeReality();

    const blocks = [
        createBlock('system',   { content: 'You are X.' }),
        createBlock('question', { content: 'Do Y.' }),
    ];

    const p = nextEvent(bus, SGL_LLM.REALITY_CHANGED);
    dispatch(bus, SGL_LLM.BUNDLE_LOADED, {
        bundle: { reality: { blocks } }
    });
    await p;

    const state = reality.getState();
    assertEqual(state.blocks.length, 2);
    assertEqual(state.blocks[0].type, 'system');
    assertEqual(state.blocks[1].type, 'question');
    cleanup();
});

test('getState / setState round-trip', () => {
    const { reality, cleanup } = makeReality();
    reality.shadowRoot.querySelector('[data-type="system"]').click();
    reality.shadowRoot.querySelector('[data-type="question"]').click();
    const before = reality.getState();
    reality.setState(before);
    const after = reality.getState();
    assertEqual(before.blocks.length, after.blocks.length);
    cleanup();
});

// ── Render ────────────────────────────────────────────────────────────────────

const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');

for (const s of suites) {
    const suiteDiv = document.createElement('div');
    suiteDiv.className = 'suite';
    suiteDiv.innerHTML = `<div class="suite-title">${s.name}</div>`;
    for (const t of s.tests) {
        const div = document.createElement('div');
        div.className = `test ${t.ok ? 'pass' : 'fail'}`;
        div.innerHTML = `
            <span class="icon">${t.ok ? '✓' : '✗'}</span>
            <div>
                <div>${t.name}</div>
                ${t.ok ? '' : `<div class="detail msg">${t.msg}</div>`}
            </div>`;
        suiteDiv.appendChild(div);
    }
    resultsEl.appendChild(suiteDiv);
}

const total = passed + failed;
summaryEl.textContent = failed === 0
    ? `✓ All ${total} tests passed`
    : `✗ ${failed} of ${total} tests failed`;
summaryEl.className = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;

// ── Interactive demo ──────────────────────────────────────────────────────────

const demoContainer = document.getElementById('reality-demo');
const eventLog = document.getElementById('event-log');

const reality = document.createElement('sg-llm-reality');
reality.style.cssText = 'display:flex;flex-direction:column;height:100%;';
demoContainer.appendChild(reality);

// Pre-add a system + question block
reality.shadowRoot.querySelector('[data-type="system"]').click();
reality.shadowRoot.querySelector('[data-type="question"]').click();

// Log events
demoContainer.addEventListener(SGL_LLM.REALITY_CHANGED, (e) => {
    const line = document.createElement('div');
    line.style.cssText = 'border-bottom:1px solid #1e2a45;padding:4px 0;';
    line.textContent = `REALITY_CHANGED: ${e.detail.messages.length} msgs, ${e.detail.tokenCount} tok, ${e.detail.imageCount} img`;
    eventLog.prepend(line);
});
demoContainer.addEventListener(SGL_LLM.SEND, (e) => {
    const line = document.createElement('div');
    line.style.cssText = 'border-bottom:1px solid #1e2a45;padding:4px 0;color:#4ade80;';
    line.textContent = `SEND: mode=${e.detail.mode}, ${e.detail.messages.length} msgs`;
    eventLog.prepend(line);
    // Simulate a response after 1s
    setTimeout(() => {
        demoContainer.dispatchEvent(new CustomEvent(SGL_LLM.REQUEST_START, { detail: {} }));
        setTimeout(() => {
            demoContainer.dispatchEvent(new CustomEvent(SGL_LLM.REQUEST_COMPLETE, {
                detail: { content: 'Simulated LLM response for demo purposes.' }
            }));
        }, 800);
    }, 100);
});
</script>
</body>
</html>
