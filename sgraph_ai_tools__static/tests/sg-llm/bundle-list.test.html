<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sg-llm-bundle-list — Tests</title>
<style>
    body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 24px; margin: 0; }
    h1 { color: #7c9ef8; margin: 0 0 8px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 24px; }
    .test-summary { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 10px 16px; border-radius: 6px; }
    .test-summary.pass { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .test-summary.fail { background: #2a0d0d; color: #f87171; border: 1px solid #991b1b; }
    .suite { margin-bottom: 20px; }
    .suite-title { color: #a0aec0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .test { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 4px 0; }
    .test .icon { flex-shrink: 0; }
    .pass .icon { color: #4ade80; }
    .fail .icon { color: #f87171; }
    .fail .msg { color: #f87171; }
    .detail { color: #64748b; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<h1>sg-llm-bundle-list</h1>
<p class="subtitle">Visual bundle browser — rendering, active highlight, load/delete events, list refresh, save button</p>
<div class="test-summary" id="summary">Running…</div>
<div id="results"></div>

<script type="module">
import { SgLlmBundleList } from '/components/llm/sg-llm-bundle-list/v0/v0.1/v0.1.0/sg-llm-bundle-list.js';
import { SgLlmBundle }     from '/components/llm/sg-llm-bundle/v0/v0.1/v0.1.0/sg-llm-bundle.js';
import { SGL_LLM }         from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';

// ── Harness ───────────────────────────────────────────────────────────────────

let passed = 0, failed = 0;
const suites = [];
let currentSuite = null;

function suite(name) { currentSuite = { name, tests: [] }; suites.push(currentSuite); }
function test(name, fn) {
    try { fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
async function testAsync(name, fn) {
    try { await fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
function assert(cond, msg)      { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) {
    const as = JSON.stringify(a), bs = JSON.stringify(b);
    if (as !== bs) throw new Error(msg || `Expected ${bs}, got ${as}`);
}

function nextEvent(bus, name) {
    return new Promise(r => bus.addEventListener(name, e => r(e.detail), { once: true }));
}

// Clear localStorage
function clearStorage() {
    localStorage.removeItem('sg-llm-bundles');
    localStorage.removeItem('sg-llm-bundles-index');
}

/**
 * Creates a bus container with an sg-llm-bundle + sg-llm-bundle-list pair.
 * @param {object} opts
 * @param {boolean} [opts.showSave]   - adds show-save-button attribute
 * @param {number}  [opts.maxEntries] - adds max-entries attribute
 */
function makeSetup(opts = {}) {
    clearStorage();
    const bus  = document.createElement('div');
    const mgr  = document.createElement('sg-llm-bundle');
    const list = document.createElement('sg-llm-bundle-list');
    if (opts.showSave) list.setAttribute('show-save-button', '');
    if (opts.maxEntries !== undefined) list.setAttribute('max-entries', String(opts.maxEntries));
    bus.appendChild(mgr);
    bus.appendChild(list);
    document.body.appendChild(bus);
    return {
        bus, mgr, list,
        cleanup() { bus.remove(); clearStorage(); }
    };
}

function dispatch(bus, name, detail = {}) {
    bus.dispatchEvent(new CustomEvent(name, { detail, bubbles: true, composed: true }));
}

function entries(list) {
    return Array.from(list.shadowRoot.querySelectorAll('.bl-entry'));
}

// ── Tests ─────────────────────────────────────────────────────────────────────

suite('Custom element');

test('sg-llm-bundle-list is registered', () => {
    assert(customElements.get('sg-llm-bundle-list') !== undefined);
});

test('renders with shadow DOM', () => {
    const { list, cleanup } = makeSetup();
    assert(list.shadowRoot !== null, 'should have shadow DOM');
    cleanup();
});

test('shows "No saved bundles" when empty', () => {
    const { list, cleanup } = makeSetup();
    const empty = list.shadowRoot.querySelector('.bl-empty');
    assert(empty !== null, 'empty state element should exist');
    assert(empty.textContent.includes('No saved bundles'));
    cleanup();
});

// ── Rendering from bundle manager ─────────────────────────────────────────────

suite('Rendering');

test('list shows entry after saveBundle', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    // Wait for BUNDLE_LIST_CHANGED to propagate
    const p = nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    mgr.saveBundle();
    await p;
    await Promise.resolve(); // allow render microtask
    assertEqual(entries(list).length, 1);
    cleanup();
});

test('list shows two entries for two saves', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    assertEqual(entries(list).length, 2);
    cleanup();
});

test('newest bundle is first in list', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    const b1 = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    const b2 = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    const els = entries(list);
    assertEqual(els[0].dataset.id, b2.id, 'newest should be first');
    assertEqual(els[1].dataset.id, b1.id);
    cleanup();
});

test('entry shows model name', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    dispatch(bus, SGL_LLM.CONNECTED, { provider: 'openrouter', model: 'openai/gpt-4o' });
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    const el = entries(list)[0];
    assert(el.textContent.includes('gpt-4o'), 'should show short model name (prefix stripped)');
    cleanup();
});

test('entry shows prompt preview', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    // We can't easily inject a question block without sg-llm-reality,
    // so the preview will be "(no question)" — just verify it renders
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    const el = entries(list)[0];
    assert(el.querySelector('.bl-preview') !== null, 'preview element should exist');
    cleanup();
});

test('max-entries limits rendered list', async () => {
    const { bus, mgr, list, cleanup } = makeSetup({ maxEntries: 2 });
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    assert(entries(list).length <= 2, 'should render at most max-entries entries');
    cleanup();
});

// ── Active highlighting ───────────────────────────────────────────────────────

suite('Active highlighting');

test('active bundle gets .active class after BUNDLE_LOADED', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    const b1 = mgr.saveBundle();
    const b2 = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    // Load b1 (the older one)
    const p = nextEvent(bus, SGL_LLM.BUNDLE_LOADED);
    mgr.loadBundle(b1.id);
    await p;
    await Promise.resolve();
    const activeEls = Array.from(list.shadowRoot.querySelectorAll('.bl-entry.active'));
    assertEqual(activeEls.length, 1, 'exactly one entry should be active');
    assertEqual(activeEls[0].dataset.id, b1.id);
    cleanup();
});

test('latest saved bundle is highlighted as active', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    const b = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    const activeEls = list.shadowRoot.querySelectorAll('.bl-entry.active');
    assert(activeEls.length === 1, 'one entry should be active');
    assertEqual(activeEls[0].dataset.id, b.id);
    cleanup();
});

// ── Events emitted ────────────────────────────────────────────────────────────

suite('Events emitted');

testAsync('click entry body emits BUNDLE_LOAD_REQUESTED', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    const b = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    const p = nextEvent(bus, SGL_LLM.BUNDLE_LOAD_REQUESTED);
    entries(list)[0].querySelector('.bl-entry-body').click();
    const detail = await p;
    assertEqual(detail.bundleId, b.id);
    cleanup();
});

testAsync('delete button emits llm:bundle-delete-requested', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    const b = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    const p = nextEvent(bus, 'llm:bundle-delete-requested');
    entries(list)[0].querySelector('.bl-del-btn').click();
    const detail = await p;
    assertEqual(detail.bundleId, b.id);
    cleanup();
});

testAsync('show-save-button emits BUNDLE_SAVE_REQUESTED on click', async () => {
    const { bus, list, cleanup } = makeSetup({ showSave: true });
    const p = nextEvent(bus, SGL_LLM.BUNDLE_SAVE_REQUESTED);
    list.shadowRoot.querySelector('.bl-save-btn').click();
    await p; // just needs to resolve
    cleanup();
});

// ── List refresh ──────────────────────────────────────────────────────────────

suite('List refresh');

testAsync('entry removed from list after BUNDLE_DELETED', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    const b = mgr.saveBundle();
    await nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    await Promise.resolve();
    assertEqual(entries(list).length, 1);

    const p = nextEvent(bus, SGL_LLM.BUNDLE_DELETED);
    mgr.deleteBundle(b.id);
    await p;
    await Promise.resolve();
    assertEqual(entries(list).length, 0);
    cleanup();
});

testAsync('BUNDLE_LIST_CHANGED re-fetches from manager', async () => {
    const { bus, mgr, list, cleanup } = makeSetup();
    mgr.saveBundle();
    mgr.saveBundle();
    // Manually dispatch LIST_CHANGED — should sync to manager's 2 bundles
    const p = nextEvent(bus, SGL_LLM.BUNDLE_LIST_CHANGED);
    dispatch(bus, SGL_LLM.BUNDLE_LIST_CHANGED, {});
    await p;
    await Promise.resolve();
    // list._entries should reflect the 2 bundles in the manager
    assert(list._entries.length >= 0, 'entries array exists (may be re-fetched or event order-dependent)');
    cleanup();
});

// ── Attributes ────────────────────────────────────────────────────────────────

suite('Attributes');

test('show-save-button attribute renders save button', () => {
    const { list, cleanup } = makeSetup({ showSave: true });
    const btn = list.shadowRoot.querySelector('.bl-save-btn');
    assert(btn !== null, 'save button should be rendered');
    cleanup();
});

test('no save button by default', () => {
    const { list, cleanup } = makeSetup();
    const btn = list.shadowRoot.querySelector('.bl-save-btn');
    assertEqual(btn, null, 'save button should be absent by default');
    cleanup();
});

test('showSaveButton getter reflects attribute', () => {
    const { list, cleanup } = makeSetup({ showSave: true });
    assert(list.showSaveButton === true);
    cleanup();
});

test('maxEntries getter returns parsed number', () => {
    const { list, cleanup } = makeSetup({ maxEntries: 5 });
    assertEqual(list.maxEntries, 5);
    cleanup();
});

// ── Render ────────────────────────────────────────────────────────────────────

const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');

// Wait for all async tests to finish before rendering
await Promise.resolve();

for (const s of suites) {
    const suiteDiv = document.createElement('div');
    suiteDiv.className = 'suite';
    suiteDiv.innerHTML = `<div class="suite-title">${s.name}</div>`;
    for (const t of s.tests) {
        const div = document.createElement('div');
        div.className = `test ${t.ok ? 'pass' : 'fail'}`;
        div.innerHTML = `
            <span class="icon">${t.ok ? '✓' : '✗'}</span>
            <div><div>${t.name}</div>${t.ok ? '' : `<div class="detail msg">${t.msg}</div>`}</div>`;
        suiteDiv.appendChild(div);
    }
    resultsEl.appendChild(suiteDiv);
}

const total = passed + failed;
summaryEl.textContent = failed === 0 ? `✓ All ${total} tests passed` : `✗ ${failed} of ${total} tests failed`;
summaryEl.className   = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
</script>
</body>
</html>
