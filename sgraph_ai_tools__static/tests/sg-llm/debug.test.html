<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sg-llm-debug — Tests</title>
<style>
    body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 24px; margin: 0; }
    h1 { color: #7c9ef8; margin: 0 0 8px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 24px; }
    .test-summary { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 10px 16px; border-radius: 6px; }
    .test-summary.pass { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .test-summary.fail { background: #2a0d0d; color: #f87171; border: 1px solid #991b1b; }
    .suite { margin-bottom: 20px; }
    .suite-title { color: #a0aec0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .test { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 4px 0; }
    .test .icon { flex-shrink: 0; }
    .pass .icon { color: #4ade80; }
    .fail .icon { color: #f87171; }
    .fail .msg { color: #f87171; }
    .detail { color: #64748b; font-size: 12px; margin-top: 2px; }
    h2 { color: #a0aec0; font-size: 14px; margin: 32px 0 8px; border-top: 1px solid #1e2a45; padding-top: 16px; }
    .demo { width: 480px; height: 500px; border: 1px solid #222d4d; border-radius: 8px; overflow: hidden; margin-top: 12px; }
</style>
</head>
<body>
<h1>sg-llm-debug</h1>
<p class="subtitle">Request inspector — captures SEND events, colour-coded by block type, expandable entries</p>
<div class="test-summary" id="summary">Running…</div>
<div id="results"></div>

<h2>Interactive demo</h2>
<p style="color:#64748b;font-size:12px;">Two simulated requests are fired automatically. Click entries to expand. Click the header again to collapse.</p>
<div id="demo-bus">
    <div class="demo" id="demo-container"></div>
</div>

<script type="module">
import { SgLlmDebug } from '/components/llm/sg-llm-debug/v0/v0.1/v0.1.0/sg-llm-debug.js';
import { SGL_LLM }    from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';

// ── Harness ───────────────────────────────────────────────────────────────────

let passed = 0, failed = 0;
const suites = [];
let currentSuite = null;

function suite(name) { currentSuite = { name, tests: [] }; suites.push(currentSuite); }
function test(name, fn) {
    try { fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
function assert(cond, msg)       { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg)  {
    const as = JSON.stringify(a), bs = JSON.stringify(b);
    if (as !== bs) throw new Error(msg || `Expected ${bs}, got ${as}`);
}
function assertIncludes(a, b, msg) {
    if (!String(a).includes(b)) throw new Error(msg || `Expected "${a}" to include "${b}"`);
}

function makeComp() {
    const bus  = document.createElement('div');
    const comp = document.createElement('sg-llm-debug');
    bus.appendChild(comp);
    document.body.appendChild(bus);
    return { bus, comp, cleanup: () => bus.remove() };
}

function dispatch(bus, name, detail = {}) {
    bus.dispatchEvent(new CustomEvent(name, { detail, bubbles: true, composed: true }));
}

const FULL_REALITY = [
    { role: 'system',    content: 'You are a helpful assistant.' },
    { role: 'user',      content: '--- CONTEXT: docs ---\nSome documentation.' },
    { role: 'user',      content: '--- SESSION MEMORY ---\n- Learnt X' },
    { role: 'user',      content: 'Hello!' },
    { role: 'assistant', content: 'Hi there!' },
    { role: 'user',      content: 'What is the answer?' },
];

// ── Tests ─────────────────────────────────────────────────────────────────────

suite('Custom element');

test('sg-llm-debug is registered', () => {
    assert(customElements.get('sg-llm-debug') !== undefined);
});

test('renders toolbar and empty list', () => {
    const { comp, cleanup } = makeComp();
    assert(comp.shadowRoot.getElementById('list')    !== null, 'no list');
    assert(comp.shadowRoot.getElementById('clear-btn') !== null, 'no clear-btn');
    assert(comp.shadowRoot.getElementById('empty-msg') !== null, 'no empty-msg');
    cleanup();
});

// ── SEND captures ─────────────────────────────────────────────────────────────

suite('SEND event capture');

test('SEND creates an entry', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: FULL_REALITY, mode: 'build' });
    await Promise.resolve();
    assertEqual(comp.getEntries().length, 1);
    cleanup();
});

test('entry has correct mode', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'memory-update' });
    await Promise.resolve();
    assertEqual(comp.getEntries()[0].mode, 'memory-update');
    cleanup();
});

test('entry starts as pending', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    assertEqual(comp.getEntries()[0].status, 'pending');
    cleanup();
});

test('entry captures full messages array', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: FULL_REALITY, mode: 'build' });
    await Promise.resolve();
    assertEqual(comp.getEntries()[0].messages.length, FULL_REALITY.length);
    cleanup();
});

test('multiple SENDs create multiple entries (newest first)', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [{ role: 'user', content: 'first' }], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.SEND, { messages: [{ role: 'user', content: 'second' }], mode: 'build' });
    await Promise.resolve();
    const entries = comp.getEntries();
    assertEqual(entries.length, 2);
    // Newest first
    assertEqual(entries[0].messages[0].content, 'second');
    cleanup();
});

// ── Status updates ─────────────────────────────────────────────────────────────

suite('Status updates');

test('REQUEST_COMPLETE sets status to complete', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, {
        content: 'Hello!', promptTokens: 10, completionTokens: 5, cost: 0.001, latencyMs: 300,
    });
    await Promise.resolve();
    assertEqual(comp.getEntries()[0].status, 'complete');
    cleanup();
});

test('REQUEST_COMPLETE attaches response data', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: 'Answer.', promptTokens: 20, completionTokens: 8, cost: 0.0005, latencyMs: 400 });
    await Promise.resolve();
    const r = comp.getEntries()[0].response;
    assertEqual(r.content, 'Answer.');
    assertEqual(r.promptTokens, 20);
    cleanup();
});

test('REQUEST_ERROR sets status to error', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_ERROR, { error: '401 Unauthorized', status: 401 });
    await Promise.resolve();
    assertEqual(comp.getEntries()[0].status, 'error');
    cleanup();
});

test('REQUEST_CANCEL sets status to cancel', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_CANCEL, {});
    await Promise.resolve();
    assertEqual(comp.getEntries()[0].status, 'cancel');
    cleanup();
});

test('second SEND does not overwrite first entry response', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [{ role: 'user', content: 'q1' }], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: 'r1', promptTokens: 5, completionTokens: 3, cost: 0, latencyMs: 100 });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.SEND, { messages: [{ role: 'user', content: 'q2' }], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: 'r2', promptTokens: 6, completionTokens: 4, cost: 0, latencyMs: 200 });
    await Promise.resolve();
    // entries[0] = newest (q2), entries[1] = oldest (q1)
    assertEqual(comp.getEntries()[0].response.content, 'r2');
    assertEqual(comp.getEntries()[1].response.content, 'r1');
    cleanup();
});

// ── DOM rendering ─────────────────────────────────────────────────────────────

suite('DOM rendering');

test('entry appears in list after SEND', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [{ role: 'user', content: 'test' }], mode: 'build' });
    await Promise.resolve();
    const entries = comp.shadowRoot.querySelectorAll('.entry');
    assertEqual(entries.length, 1);
    cleanup();
});

test('count badge updates', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    assertIncludes(comp.shadowRoot.getElementById('count').textContent, '2');
    cleanup();
});

test('clicking entry header toggles detail open', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: FULL_REALITY, mode: 'build' });
    await Promise.resolve();
    const header = comp.shadowRoot.querySelector('.entry-header');
    header.click();
    const detail = comp.shadowRoot.querySelector('.entry-detail');
    assert(detail.classList.contains('open'), 'detail should open on click');
    cleanup();
});

test('clicking header again collapses detail', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: FULL_REALITY, mode: 'build' });
    await Promise.resolve();
    const header = comp.shadowRoot.querySelector('.entry-header');
    header.click(); // open
    header.click(); // close
    const detail = comp.shadowRoot.querySelector('.entry-detail');
    assert(!detail.classList.contains('open'), 'detail should close on second click');
    cleanup();
});

test('expanded detail contains message blocks', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: FULL_REALITY, mode: 'build' });
    await Promise.resolve();
    comp.shadowRoot.querySelector('.entry-header').click();
    const blocks = comp.shadowRoot.querySelectorAll('.msg-block');
    assertEqual(blocks.length, FULL_REALITY.length);
    cleanup();
});

test('system message block has blue badge', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [{ role: 'system', content: 'sys' }], mode: 'build' });
    await Promise.resolve();
    comp.shadowRoot.querySelector('.entry-header').click();
    const badge = comp.shadowRoot.querySelector('.msg-badge');
    assertEqual(badge.textContent, 'System');
    assertIncludes(badge.style.background, '#3b82f6');
    cleanup();
});

test('context message block has green badge', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, {
        messages: [{ role: 'user', content: '--- CONTEXT: doc ---\nBody' }],
        mode: 'build',
    });
    await Promise.resolve();
    comp.shadowRoot.querySelector('.entry-header').click();
    const badge = comp.shadowRoot.querySelector('.msg-badge');
    assertEqual(badge.textContent, 'Context');
    cleanup();
});

test('memory message block has cyan badge', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, {
        messages: [{ role: 'user', content: '--- SESSION MEMORY ---\n- item' }],
        mode: 'build',
    });
    await Promise.resolve();
    comp.shadowRoot.querySelector('.entry-header').click();
    const badge = comp.shadowRoot.querySelector('.msg-badge');
    assertEqual(badge.textContent, 'Memory');
    cleanup();
});

test('response block appears after REQUEST_COMPLETE', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: 'Done.', promptTokens: 5, completionTokens: 3, cost: 0, latencyMs: 100 });
    await Promise.resolve();
    comp.shadowRoot.querySelector('.entry-header').click();
    const respBlock = comp.shadowRoot.querySelector('.response-block');
    assert(respBlock !== null, 'response block should appear');
    assertIncludes(respBlock.querySelector('.response-body').textContent, 'Done.');
    cleanup();
});

// ── Clear ─────────────────────────────────────────────────────────────────────

suite('Clear');

test('clear button removes all entries', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    dispatch(bus, SGL_LLM.SEND, { messages: [], mode: 'build' });
    await Promise.resolve();
    comp.shadowRoot.getElementById('clear-btn').click();
    await Promise.resolve();
    assertEqual(comp.getEntries().length, 0);
    assertEqual(comp.shadowRoot.querySelectorAll('.entry').length, 0);
    cleanup();
});

// ── Render results ────────────────────────────────────────────────────────────

const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');

for (const s of suites) {
    const suiteDiv = document.createElement('div');
    suiteDiv.className = 'suite';
    suiteDiv.innerHTML = `<div class="suite-title">${s.name}</div>`;
    for (const t of s.tests) {
        const div = document.createElement('div');
        div.className = `test ${t.ok ? 'pass' : 'fail'}`;
        div.innerHTML = `
            <span class="icon">${t.ok ? '✓' : '✗'}</span>
            <div><div>${t.name}</div>${t.ok ? '' : `<div class="detail msg">${t.msg}</div>`}</div>`;
        suiteDiv.appendChild(div);
    }
    resultsEl.appendChild(suiteDiv);
}

const total = passed + failed;
summaryEl.textContent = failed === 0 ? `✓ All ${total} tests passed` : `✗ ${failed} of ${total} tests failed`;
summaryEl.className   = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;

// ── Demo — fire two simulated requests ───────────────────────────────────────

const demoBus  = document.getElementById('demo-bus');
const demoComp = document.createElement('sg-llm-debug');
demoComp.style.cssText = 'display:flex;flex-direction:column;height:100%;';
document.getElementById('demo-container').appendChild(demoComp);

const DEMO_MSGS = [
    { role: 'system',    content: 'You are an expert web component developer.' },
    { role: 'user',      content: '--- CONTEXT: sg-layout.js ---\nclass SgLayout extends HTMLElement { ... }' },
    { role: 'user',      content: '--- SESSION MEMORY ---\n- Building sg-tree component\n- Decided on flat row rendering' },
    { role: 'user',      content: 'Hi! How are you?'     },
    { role: 'assistant', content: 'Great, thanks!'       },
    { role: 'user',      content: 'Add keyboard navigation to the tree component.' },
];

setTimeout(() => {
    dispatch(demoBus, SGL_LLM.SEND, { messages: DEMO_MSGS, mode: 'build' });
}, 300);
setTimeout(() => {
    dispatch(demoBus, SGL_LLM.REQUEST_COMPLETE, {
        content: 'Here is the keyboard navigation implementation:\n\n```js\nconnectedCallback() {\n  this.addEventListener("keydown", this._onKeydown);\n}\n```\n\nUse arrow keys to navigate nodes.',
        promptTokens: 320, completionTokens: 87, cost: 0.0008, latencyMs: 920,
    });
}, 1500);
setTimeout(() => {
    const memUpdate = [
        { role: 'system', content: 'You are a memory manager...' },
        { role: 'user',   content: 'CURRENT MEMORY:\n- Building sg-tree\nLATEST QUESTION:\nAdd keyboard nav\nLATEST RESPONSE:\n...' },
    ];
    dispatch(demoBus, SGL_LLM.SEND, { messages: memUpdate, mode: 'memory-update' });
}, 2200);
setTimeout(() => {
    dispatch(demoBus, SGL_LLM.REQUEST_COMPLETE, {
        content: '- Building sg-tree component\n- Decided on flat row rendering for scroll perf\n- Keyboard nav added (arrows + j/k)',
        promptTokens: 180, completionTokens: 42, cost: 0.0003, latencyMs: 540,
    });
}, 3200);
</script>
</body>
</html>
