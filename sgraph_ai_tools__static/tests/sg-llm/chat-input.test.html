<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sg-llm-chat-input — Tests</title>
<style>
    body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 24px; margin: 0; }
    h1 { color: #7c9ef8; margin: 0 0 8px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 24px; }
    .test-summary { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 10px 16px; border-radius: 6px; }
    .test-summary.pass { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .test-summary.fail { background: #2a0d0d; color: #f87171; border: 1px solid #991b1b; }
    .suite { margin-bottom: 20px; }
    .suite-title { color: #a0aec0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .test { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 4px 0; }
    .pass .icon { color: #4ade80; }
    .fail .icon { color: #f87171; }
    .detail { color: #64748b; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<h1>sg-llm-chat-input</h1>
<p class="subtitle">Message input bar — send, cancel, attachments, disable, clear</p>
<div class="test-summary" id="summary">Running…</div>
<div id="results"></div>

<script type="module">
import { SgLlmChatInput } from '/components/llm/sg-llm-chat-input/v0/v0.1/v0.1.0/sg-llm-chat-input.js';
import { SGL_LLM }        from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';

const CHAT_MESSAGE = 'llm:chat-message';

let passed = 0, failed = 0;
const suites = [];
let currentSuite = null;

function suite(name) { currentSuite = { name, tests: [] }; suites.push(currentSuite); }
function test(name, fn) {
    try { fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
async function testAsync(name, fn) {
    try { await fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) {
    const as = JSON.stringify(a), bs = JSON.stringify(b);
    if (as !== bs) throw new Error(msg || `Expected ${bs}, got ${as}`);
}

function nextEvent(bus, name) {
    return new Promise(r => bus.addEventListener(name, e => r(e.detail), { once: true }));
}

function makeComp() {
    const bus  = document.createElement('div');
    const comp = document.createElement('sg-llm-chat-input');
    bus.appendChild(comp);
    document.body.appendChild(bus);
    return { bus, comp, cleanup() { bus.remove(); } };
}

function dispatch(bus, name, detail = {}) {
    bus.dispatchEvent(new CustomEvent(name, { detail, bubbles: true, composed: true }));
}

function setTaValue(comp, text) {
    const ta = comp.shadowRoot.querySelector('textarea');
    ta.value = text;
}

// ── Tests ─────────────────────────────────────────────────────────────────────

suite('Custom element');

test('sg-llm-chat-input is registered', () => {
    assert(customElements.get('sg-llm-chat-input') !== undefined);
});
test('has shadow DOM', () => {
    const { comp, cleanup } = makeComp();
    assert(comp.shadowRoot !== null);
    cleanup();
});
test('renders textarea, send button, cancel button', () => {
    const { comp, cleanup } = makeComp();
    assert(comp.shadowRoot.querySelector('textarea') !== null, 'textarea missing');
    assert(comp.shadowRoot.querySelector('.ci-send-btn') !== null, 'send btn missing');
    assert(comp.shadowRoot.querySelector('.ci-cancel-btn') !== null, 'cancel btn missing');
    cleanup();
});
test('cancel button hidden initially', () => {
    const { comp, cleanup } = makeComp();
    const cancel = comp.shadowRoot.querySelector('.ci-cancel-btn');
    assert(!cancel.classList.contains('visible'), 'cancel should be hidden initially');
    cleanup();
});

suite('Send');

testAsync('send button emits llm:chat-message', async () => {
    const { bus, comp, cleanup } = makeComp();
    setTaValue(comp, 'Hello world');
    const p = nextEvent(bus, CHAT_MESSAGE);
    comp.shadowRoot.querySelector('.ci-send-btn').click();
    const detail = await p;
    assertEqual(detail.text, 'Hello world');
    assert(Array.isArray(detail.attachments), 'attachments should be array');
    cleanup();
});
testAsync('Enter key emits llm:chat-message', async () => {
    const { bus, comp, cleanup } = makeComp();
    setTaValue(comp, 'Test enter');
    const p = nextEvent(bus, CHAT_MESSAGE);
    comp.shadowRoot.querySelector('textarea').dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })
    );
    const detail = await p;
    assertEqual(detail.text, 'Test enter');
    cleanup();
});
testAsync('Shift+Enter does NOT send', async () => {
    const { bus, comp, cleanup } = makeComp();
    setTaValue(comp, 'no send');
    let sent = false;
    bus.addEventListener(CHAT_MESSAGE, () => { sent = true; }, { once: true });
    comp.shadowRoot.querySelector('textarea').dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true })
    );
    await Promise.resolve();
    assert(!sent, 'Shift+Enter should not send');
    cleanup();
});
testAsync('send clears textarea', async () => {
    const { bus, comp, cleanup } = makeComp();
    setTaValue(comp, 'Some text');
    comp.shadowRoot.querySelector('.ci-send-btn').click();
    await nextEvent(bus, CHAT_MESSAGE);
    assertEqual(comp.shadowRoot.querySelector('textarea').value, '');
    cleanup();
});
testAsync('empty text does not emit chat-message', async () => {
    const { bus, comp, cleanup } = makeComp();
    setTaValue(comp, '   ');
    let sent = false;
    bus.addEventListener(CHAT_MESSAGE, () => { sent = true; }, { once: true });
    comp.shadowRoot.querySelector('.ci-send-btn').click();
    await Promise.resolve();
    assert(!sent, 'empty message should not be sent');
    cleanup();
});

suite('Disable / enable');

test('setDisabled(true) disables textarea and send button', () => {
    const { comp, cleanup } = makeComp();
    comp._requesting = true;
    comp.setDisabled(true);
    assert(comp.shadowRoot.querySelector('textarea').disabled, 'textarea should be disabled');
    assert(comp.shadowRoot.querySelector('.ci-send-btn').disabled, 'send btn should be disabled');
    cleanup();
});
test('setDisabled(false) re-enables', () => {
    const { comp, cleanup } = makeComp();
    comp._requesting = true;
    comp.setDisabled(true);
    comp._requesting = false;
    comp.setDisabled(false);
    assert(!comp.shadowRoot.querySelector('textarea').disabled, 'textarea should be enabled');
    cleanup();
});
testAsync('REQUEST_START disables input', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    assert(comp._disabled === true, 'should be disabled');
    cleanup();
});
testAsync('REQUEST_COMPLETE re-enables input', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_COMPLETE, { content: 'done' });
    await Promise.resolve();
    assert(comp._disabled === false, 'should be re-enabled');
    cleanup();
});
testAsync('REQUEST_ERROR re-enables input', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    dispatch(bus, SGL_LLM.REQUEST_ERROR, { error: 'fail' });
    await Promise.resolve();
    assert(comp._disabled === false, 'should be re-enabled after error');
    cleanup();
});

suite('Cancel');

testAsync('cancel button emits llm:cancel', async () => {
    const { bus, comp, cleanup } = makeComp();
    dispatch(bus, SGL_LLM.REQUEST_START, {});
    await Promise.resolve();
    const p = nextEvent(bus, SGL_LLM.CANCEL);
    comp.shadowRoot.querySelector('.ci-cancel-btn').click();
    await p;
    cleanup();
});

suite('Attachments');

test('_addAttachment stores attachment', () => {
    const { comp, cleanup } = makeComp();
    comp._addAttachment({ id: 'x', name: 'img.png', type: 'image/png', dataUrl: 'data:...' });
    assert(comp._attachments.length === 1);
    cleanup();
});
test('_removeAttachment removes by id', () => {
    const { comp, cleanup } = makeComp();
    comp._addAttachment({ id: 'a', name: 'a.png', type: 'image/png', dataUrl: 'data:...' });
    comp._addAttachment({ id: 'b', name: 'b.txt', type: 'text/plain', textContent: 'hello' });
    comp._removeAttachment('a');
    assertEqual(comp._attachments.length, 1);
    assertEqual(comp._attachments[0].id, 'b');
    cleanup();
});
testAsync('attachments included in chat-message detail', async () => {
    const { bus, comp, cleanup } = makeComp();
    comp._addAttachment({ id: 'att1', name: 'photo.png', type: 'image/png', dataUrl: 'data:img' });
    setTaValue(comp, 'Look');
    const p = nextEvent(bus, CHAT_MESSAGE);
    comp.shadowRoot.querySelector('.ci-send-btn').click();
    const detail = await p;
    assert(detail.attachments.length === 1, 'attachment should be included');
    assertEqual(detail.attachments[0].id, 'att1');
    cleanup();
});
testAsync('clear() removes attachments', async () => {
    const { bus, comp, cleanup } = makeComp();
    comp._addAttachment({ id: 'x', name: 'x.png', type: 'image/png', dataUrl: 'data:...' });
    comp.clear();
    assertEqual(comp._attachments, []);
    cleanup();
});

suite('Public API');

test('focus() focuses textarea', () => {
    const { comp, cleanup } = makeComp();
    comp.focus();
    // Can't assert document.activeElement reliably in shadow DOM, just check no error
    assert(true);
    cleanup();
});

// ── Render ────────────────────────────────────────────────────────────────────

const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');
await Promise.resolve();

for (const s of suites) {
    const suiteDiv = document.createElement('div');
    suiteDiv.className = 'suite';
    suiteDiv.innerHTML = `<div class="suite-title">${s.name}</div>`;
    for (const t of s.tests) {
        const div = document.createElement('div');
        div.className = `test ${t.ok ? 'pass' : 'fail'}`;
        div.innerHTML = `<span class="icon">${t.ok ? '✓' : '✗'}</span>
            <div><div>${t.name}</div>${t.ok ? '' : `<div class="detail">${t.msg}</div>`}</div>`;
        suiteDiv.appendChild(div);
    }
    resultsEl.appendChild(suiteDiv);
}
const total = passed + failed;
summaryEl.textContent = failed === 0 ? `✓ All ${total} tests passed` : `✗ ${failed} of ${total} tests failed`;
summaryEl.className   = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
</script>
</body>
</html>
