<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One-Shot Chat Tool — Smoke Test</title>
<style>
    body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 24px; margin: 0; }
    h1 { color: #7c9ef8; margin: 0 0 4px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 24px; }
    .test-summary { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 10px 16px; border-radius: 6px; }
    .test-summary.pass { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .test-summary.fail { background: #2a0d0d; color: #f87171; border: 1px solid #991b1b; }
    .suite { margin-bottom: 20px; }
    .suite-title { color: #a0aec0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .test { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; }
    .pass .icon { color: #4ade80; }
    .fail .icon { color: #f87171; }
    .detail { color: #f87171; font-size: 12px; }
    .open-link { margin-bottom: 16px; font-size: 12px; }
    .open-link a { color: #7c9ef8; }
</style>
</head>
<body>
<h1>One-Shot Chat — Smoke Test</h1>
<p class="subtitle">Integration test: all components mount, event bus wired, DOM structure correct</p>
<p class="open-link"><a href="../../../tools/v0/v0.1/v0.1.6/en-gb/one-shot-chat/" target="_blank">Open live tool ↗</a></p>
<div class="test-summary" id="summary">Running…</div>
<div id="results"></div>

<script type="module">
import '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import '/components/llm/sg-llm-request/v0/v0.1/v0.1.0/sg-llm-request.js';
import '/components/llm/sg-llm-bundle/v0/v0.1/v0.1.0/sg-llm-bundle.js';
import '/components/llm/sg-llm-connection/v0/v0.1/v0.1.0/sg-llm-connection.js';
import '/components/llm/sg-llm-reality/v0/v0.1/v0.1.0/sg-llm-reality.js';
import '/components/llm/sg-llm-attachments/v0/v0.1/v0.1.0/sg-llm-attachments.js';
import '/components/llm/sg-llm-output/v0/v0.1/v0.1.0/sg-llm-output.js';
import '/components/llm/sg-llm-stats/v0/v0.1/v0.1.0/sg-llm-stats.js';
import '/components/llm/sg-llm-debug/v0/v0.1/v0.1.0/sg-llm-debug.js';
import '/components/llm/sg-llm-bundle-list/v0/v0.1/v0.1.0/sg-llm-bundle-list.js';

let passed = 0, failed = 0;
const suites = [];
let currentSuite = null;
function suite(name) { currentSuite = { name, tests: [] }; suites.push(currentSuite); }
function test(name, fn) {
    try { fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }

const bus = document.createElement('div');
bus.style.cssText = 'display:none';
bus.innerHTML = `
    <sg-llm-request></sg-llm-request>
    <sg-llm-bundle auto-save></sg-llm-bundle>
    <sg-llm-connection></sg-llm-connection>
    <sg-llm-reality></sg-llm-reality>
    <sg-llm-attachments></sg-llm-attachments>
    <sg-llm-output></sg-llm-output>
    <sg-llm-stats></sg-llm-stats>
    <sg-llm-debug></sg-llm-debug>
    <sg-llm-bundle-list show-save-button></sg-llm-bundle-list>`;
document.body.appendChild(bus);
await Promise.resolve();

suite('Custom element registration');
const TAGS = ['sg-llm-request','sg-llm-bundle','sg-llm-connection','sg-llm-reality',
    'sg-llm-attachments','sg-llm-output','sg-llm-stats','sg-llm-debug','sg-llm-bundle-list'];
for (const tag of TAGS) {
    test(`${tag} defined`, () => assert(customElements.get(tag) !== undefined));
}

suite('Bus DOM');
test('all 9 components present in bus', () => {
    for (const tag of TAGS) assert(bus.querySelector(tag) !== null, `${tag} missing`);
});

suite('Shadow roots');
for (const tag of ['sg-llm-connection','sg-llm-reality','sg-llm-output','sg-llm-stats','sg-llm-debug','sg-llm-bundle-list']) {
    test(`${tag} has shadow DOM`, () => {
        assert(bus.querySelector(tag)?.shadowRoot !== null, `${tag} missing shadow root`);
    });
}

suite('sg-llm-reality');
test('getState() returns {blocks:[]}', () => {
    const r = bus.querySelector('sg-llm-reality');
    const s = r.getState?.();
    assert(s && Array.isArray(s.blocks), 'getState should return {blocks:[]}');
});

suite('sg-llm-stats');
test('getStats() returns object', () => {
    const s = bus.querySelector('sg-llm-stats').getStats?.();
    assert(s && typeof s === 'object', 'getStats should return object');
});

suite('sg-llm-debug');
test('getEntries() returns array', () => {
    assert(Array.isArray(bus.querySelector('sg-llm-debug').getEntries?.()));
});

bus.remove();
const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');
for (const s of suites) {
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `<div class="suite-title">${s.name}</div>`;
    for (const t of s.tests) {
        const row = document.createElement('div');
        row.className = `test ${t.ok ? 'pass' : 'fail'}`;
        row.innerHTML = `<span class="icon">${t.ok ? '✓' : '✗'}</span>
            <div>${t.name}${t.ok ? '' : `<div class="detail">${t.msg}</div>`}</div>`;
        div.appendChild(row);
    }
    resultsEl.appendChild(div);
}
const total = passed + failed;
summaryEl.textContent = failed === 0 ? `✓ All ${total} tests passed` : `✗ ${failed} of ${total} tests failed`;
summaryEl.className   = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
</script>
</body>
</html>
