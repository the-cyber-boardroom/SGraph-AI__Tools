<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Tool — Smoke Test</title>
<style>
    body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 24px; margin: 0; }
    h1 { color: #7c9ef8; margin: 0 0 4px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 24px; }
    .test-summary { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 10px 16px; border-radius: 6px; }
    .test-summary.pass { background: #0d2a1a; color: #4ade80; border: 1px solid #166534; }
    .test-summary.fail { background: #2a0d0d; color: #f87171; border: 1px solid #991b1b; }
    .suite { margin-bottom: 20px; }
    .suite-title { color: #a0aec0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .test { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; }
    .pass .icon { color: #4ade80; }
    .fail .icon { color: #f87171; }
    .detail { color: #f87171; font-size: 12px; }
    .open-link { margin-bottom: 16px; font-size: 12px; }
    .open-link a { color: #7c9ef8; }
</style>
</head>
<body>
<h1>Chat — Smoke Test</h1>
<p class="subtitle">Integration test: all components mount, event bus wired, DOM structure correct</p>
<p class="open-link"><a href="../../../tools/v0/v0.1/v0.1.7/en-gb/chat/" target="_blank">Open live tool ↗</a></p>
<div class="test-summary" id="summary">Running…</div>
<div id="results"></div>

<script type="module">
// ── Imports ───────────────────────────────────────────────────────────────────
import '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import '/components/llm/sg-llm-request/v0/v0.1/v0.1.0/sg-llm-request.js';
import '/components/llm/sg-llm-bundle/v0/v0.1/v0.1.0/sg-llm-bundle.js';
import '/components/llm/sg-llm-connection/v0/v0.1/v0.1.0/sg-llm-connection.js';
import '/components/llm/sg-llm-chat-history/v0/v0.1/v0.1.0/sg-llm-chat-history.js';
import '/components/llm/sg-llm-chat-input/v0/v0.1/v0.1.0/sg-llm-chat-input.js';
import '/components/llm/sg-llm-stats/v0/v0.1/v0.1.0/sg-llm-stats.js';
import '/components/llm/sg-llm-bundle-list/v0/v0.1/v0.1.0/sg-llm-bundle-list.js';

// ── Harness ───────────────────────────────────────────────────────────────────
let passed = 0, failed = 0;
const suites = [];
let currentSuite = null;
function suite(name) { currentSuite = { name, tests: [] }; suites.push(currentSuite); }
function test(name, fn) {
    try { fn(); currentSuite.tests.push({ name, ok: true }); passed++; }
    catch (err) { currentSuite.tests.push({ name, ok: false, msg: err.message }); failed++; }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }

// ── Mount bus ─────────────────────────────────────────────────────────────────
const bus = document.createElement('div');
bus.style.cssText = 'display:none';
bus.innerHTML = `
    <sg-llm-request></sg-llm-request>
    <sg-llm-bundle></sg-llm-bundle>
    <sg-llm-connection></sg-llm-connection>
    <sg-llm-chat-history></sg-llm-chat-history>
    <sg-llm-chat-input></sg-llm-chat-input>
    <sg-llm-stats></sg-llm-stats>
    <sg-llm-bundle-list show-save-button></sg-llm-bundle-list>`;
document.body.appendChild(bus);

await Promise.resolve(); // allow connectedCallbacks

// ── Tests ─────────────────────────────────────────────────────────────────────

suite('Custom element registration');
const TAGS = ['sg-llm-request','sg-llm-bundle','sg-llm-connection',
    'sg-llm-chat-history','sg-llm-chat-input','sg-llm-stats','sg-llm-bundle-list'];
for (const tag of TAGS) {
    test(`${tag} is defined`, () => assert(customElements.get(tag) !== undefined));
}

suite('Bus DOM structure');
test('all components in bus', () => {
    for (const tag of TAGS) {
        assert(bus.querySelector(tag) !== null, `${tag} not found in bus`);
    }
});

suite('Component shadow roots');
for (const tag of ['sg-llm-connection','sg-llm-chat-history','sg-llm-chat-input','sg-llm-stats','sg-llm-bundle-list']) {
    test(`${tag} has shadow DOM`, () => {
        const el = bus.querySelector(tag);
        assert(el?.shadowRoot !== null, `${tag} missing shadow root`);
    });
}

suite('sg-llm-chat-history structure');
test('has .ch-messages element', () => {
    const el = bus.querySelector('sg-llm-chat-history');
    assert(el.shadowRoot.querySelector('.ch-messages') !== null);
});
test('has system prompt bar', () => {
    const el = bus.querySelector('sg-llm-chat-history');
    assert(el.shadowRoot.querySelector('.ch-system-bar') !== null);
});
test('shows empty state initially', () => {
    const el = bus.querySelector('sg-llm-chat-history');
    assert(el.shadowRoot.querySelector('.ch-empty') !== null);
});

suite('sg-llm-chat-input structure');
test('has textarea', () => {
    const el = bus.querySelector('sg-llm-chat-input');
    assert(el.shadowRoot.querySelector('textarea') !== null);
});
test('has send button', () => {
    const el = bus.querySelector('sg-llm-chat-input');
    assert(el.shadowRoot.querySelector('.ci-send-btn') !== null);
});

suite('Public API');
test('chat-history.getMessages() returns array', () => {
    assert(Array.isArray(bus.querySelector('sg-llm-chat-history').getMessages()));
});
test('chat-history.setSystemPrompt() works', () => {
    const h = bus.querySelector('sg-llm-chat-history');
    h.setSystemPrompt('test');
    assert(h._systemPrompt === 'test');
});
test('chat-input.clear() works without error', () => {
    bus.querySelector('sg-llm-chat-input').clear();
    assert(true);
});
test('bundle-list.showSaveButton reflects attribute', () => {
    assert(bus.querySelector('sg-llm-bundle-list').showSaveButton === true);
});

// ── Render ────────────────────────────────────────────────────────────────────
bus.remove();
const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');
for (const s of suites) {
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `<div class="suite-title">${s.name}</div>`;
    for (const t of s.tests) {
        const row = document.createElement('div');
        row.className = `test ${t.ok ? 'pass' : 'fail'}`;
        row.innerHTML = `<span class="icon">${t.ok ? '✓' : '✗'}</span>
            <div>${t.name}${t.ok ? '' : `<div class="detail">${t.msg}</div>`}</div>`;
        div.appendChild(row);
    }
    resultsEl.appendChild(div);
}
const total = passed + failed;
summaryEl.textContent = failed === 0 ? `✓ All ${total} tests passed` : `✗ ${failed} of ${total} tests failed`;
summaryEl.className   = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
</script>
</body>
</html>
