<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sg-llm-connection — Tests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0d0d1a; color: #e2e8f0; padding: 20px; }
        h1  { font-size: 18px; margin-bottom: 16px; color: #4ECDC4; }
        h2  { font-size: 14px; margin: 20px 0 8px; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.05em; }
        #test-results { background: #111122; border: 1px solid #222d4d; border-radius: 8px;
                        padding: 16px; margin-bottom: 24px; font-size: 13px; }
        .test-pass    { color: #4ECDC4; margin: 2px 0; }
        .test-fail    { color: #ff6b6b; font-weight: 600; margin: 2px 0; }
        .test-summary { margin-top: 12px; font-weight: 600; font-size: 14px; padding-top: 10px;
                        border-top: 1px solid #222d4d; }
        .test-summary.all-pass { color: #4ECDC4; }
        .test-summary.has-fail { color: #ff6b6b; }
        #demo { max-width: 400px; }
        #events { background: #111122; border: 1px solid #222d4d; border-radius: 8px;
                  padding: 12px; margin-top: 16px; font-size: 12px; min-height: 60px; }
        #events h3 { font-size: 12px; color: #a0aec0; margin-bottom: 8px; }
        .event-line { color: #4ECDC4; margin: 2px 0; font-family: monospace; }
    </style>
</head>
<body>

<h1>sg-llm-connection v0.1.0 — Tests</h1>

<div id="test-results">
    <div id="results"></div>
    <div class="test-summary" id="summary"></div>
</div>

<h2>Interactive Demo</h2>
<div id="demo">
    <sg-llm-connection id="conn"></sg-llm-connection>
    <div id="events">
        <h3>Emitted events</h3>
        <div id="event-log"></div>
    </div>
</div>

<script type="module">
import { SGL_LLM } from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import '/components/llm/sg-llm-connection/v0/v0.1/v0.1.0/sg-llm-connection.js';

// ============================================================
// TESTS
// ============================================================

const results = document.getElementById('results');
const summary = document.getElementById('summary');
let passed = 0, failed = 0;

function assert(label, condition, detail = '') {
    const div = document.createElement('div');
    if (condition) {
        div.className = 'test-pass';
        div.textContent = `✓ ${label}`;
        passed++;
    } else {
        div.className = 'test-fail';
        div.textContent = `✗ ${label}${detail ? ': ' + detail : ''}`;
        failed++;
    }
    results.appendChild(div);
}

function showSummary() {
    summary.textContent = `${passed + failed} tests — ${passed} passed, ${failed} failed`;
    summary.className = `test-summary ${failed === 0 ? 'all-pass' : 'has-fail'}`;
}

// Wait for component to be ready
await new Promise(r => setTimeout(r, 50));

const conn = document.getElementById('conn');

// Test 1: Custom element registered
assert('customElements.get("sg-llm-connection") defined', !!customElements.get('sg-llm-connection'));

// Test 2: Element renders (shadow root has content)
assert('Shadow root has content', conn.shadowRoot.innerHTML.length > 0);

// Test 3: Provider tabs rendered
const tabs = conn.shadowRoot.querySelectorAll('.conn-tab');
assert('4 provider tabs rendered', tabs.length === 4);
assert('First tab is OpenRouter', tabs[0]?.dataset.provider === 'openrouter');

// Test 4: Default provider is openrouter
assert('Default provider is openrouter', conn.provider === 'openrouter');

// Test 5: connected starts false
assert('connected starts false', conn.connected === false);

// Test 6: window.SgLlmConnection exposed
assert('window.SgLlmConnection exposed', !!window.SgLlmConnection);

// Test 7: Emits llm:connected on successful connect (mock fetch)
await (async () => {
    const connEvents = [];
    conn.addEventListener(SGL_LLM.CONNECTED, e => connEvents.push(e.detail));

    const origFetch = window.fetch;
    window.fetch = async () => ({
        ok: true,
        json: async () => ({ data: [{ id: 'model-a' }, { id: 'model-b' }] })
    });

    // Fill in key and click connect
    const keyInput = conn.shadowRoot.getElementById('api-key');
    keyInput.value = 'sk-test-key';
    conn.shadowRoot.getElementById('connect-btn').click();

    await new Promise(r => setTimeout(r, 100));

    assert('llm:connected fired after connect', connEvents.length > 0);
    assert('llm:connected has provider', !!connEvents[0]?.provider);
    assert('llm:connected has model',    !!connEvents[0]?.model);
    assert('connected is true',          conn.connected === true);

    window.fetch = origFetch;
})();

// Test 8: llm:models-loaded fires
await (async () => {
    const modelEvents = [];
    conn.addEventListener(SGL_LLM.MODELS_LOADED, e => modelEvents.push(e.detail));

    const origFetch = window.fetch;
    window.fetch = async () => ({
        ok: true,
        json: async () => ({ data: [{ id: 'gpt-4o' }, { id: 'gpt-4o-mini' }] })
    });

    conn.shadowRoot.getElementById('refresh-models').click();
    await new Promise(r => setTimeout(r, 100));

    assert('llm:models-loaded fired',        modelEvents.length > 0);
    assert('llm:models-loaded has models[]', Array.isArray(modelEvents[0]?.models));

    window.fetch = origFetch;
})();

showSummary();

// ============================================================
// DEMO event log
// ============================================================

const eventLog = document.getElementById('event-log');
function logEvent(name, detail) {
    const div = document.createElement('div');
    div.className = 'event-line';
    div.textContent = `${name}: ${JSON.stringify(detail).slice(0, 120)}`;
    eventLog.prepend(div);
}

[SGL_LLM.CONNECTED, SGL_LLM.DISCONNECTED, SGL_LLM.MODEL_CHANGED, SGL_LLM.MODELS_LOADED].forEach(evt => {
    conn.addEventListener(evt, e => logEvent(evt, e.detail));
});
</script>
</body>
</html>
