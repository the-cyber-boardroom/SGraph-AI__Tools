<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sg-llm-request — Tests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0d0d1a; color: #e2e8f0; padding: 20px; }
        h1 { font-size: 18px; margin-bottom: 16px; color: #4ECDC4; }
        h2 { font-size: 14px; margin: 20px 0 8px; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.05em; }
        #test-results { background: #111122; border: 1px solid #222d4d; border-radius: 8px;
                        padding: 16px; margin-bottom: 24px; font-size: 13px; }
        .test-pass  { color: #4ECDC4; margin: 2px 0; }
        .test-fail  { color: #ff6b6b; font-weight: 600; margin: 2px 0; }
        .test-summary { margin-top: 12px; font-weight: 600; font-size: 14px; padding-top: 10px;
                         border-top: 1px solid #222d4d; }
        .test-summary.all-pass { color: #4ECDC4; }
        .test-summary.has-fail { color: #ff6b6b; }

        /* Demo area */
        #demo { background: #111122; border: 1px solid #222d4d; border-radius: 8px; padding: 16px; }
        label  { display: block; font-size: 12px; color: #a0aec0; margin-bottom: 4px; }
        select, input, textarea {
            width: 100%; background: #0d0d1a; border: 1px solid #333d5a; border-radius: 4px;
            color: #e2e8f0; padding: 6px 8px; font-size: 13px; margin-bottom: 12px;
            font-family: inherit;
        }
        textarea { height: 80px; resize: vertical; }
        button { background: #4ECDC4; color: #0d0d1a; border: none; border-radius: 4px;
                 padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 8px; }
        button.cancel { background: #ff6b6b; }
        #output { background: #0d0d1a; border: 1px solid #333d5a; border-radius: 4px;
                  padding: 12px; font-size: 13px; min-height: 80px; white-space: pre-wrap;
                  word-break: break-word; margin-top: 12px; }
        #status { font-size: 12px; color: #a0aec0; margin-top: 8px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>

<h1>sg-llm-request v0.1.0 — Tests</h1>

<div id="test-results">
    <div id="results"></div>
    <div class="test-summary" id="summary"></div>
</div>

<h2>Interactive Demo</h2>
<div id="demo">
    <div class="row">
        <div>
            <label>Provider</label>
            <select id="provider">
                <option value="openrouter">OpenRouter</option>
                <option value="ollama">Ollama (local)</option>
                <option value="anthropic">Anthropic Direct</option>
                <option value="openai">OpenAI Direct</option>
            </select>
        </div>
        <div>
            <label>Model</label>
            <div style="display:flex;gap:6px">
                <input id="model" type="text" value="anthropic/claude-haiku-4-5" placeholder="model name" style="flex:1">
                <select id="model-select" style="flex:1;display:none"></select>
                <button id="load-models-btn" style="display:none;background:#1a1a3a;color:#a0aec0;border:1px solid #333d5a;border-radius:4px;padding:6px 10px;font-size:12px;cursor:pointer" title="Load models from Ollama">↻ Load</button>
            </div>
        </div>
    </div>
    <label>Base URL (leave blank for default)</label>
    <input id="baseUrl" type="text" placeholder="e.g. http://localhost:11434 for Ollama">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-or-... / sk-... / your key">
    <label>Message</label>
    <textarea id="message">Say hello in one sentence.</textarea>
    <label><input type="checkbox" id="streaming" checked> Streaming</label>
    <br><br>
    <button id="sendBtn">Send Request</button>
    <button class="cancel" id="cancelBtn">Cancel</button>
    <div id="output">Response will appear here...</div>
    <div id="status"></div>
</div>

<!-- The headless component -->
<div id="llm-container">
    <sg-llm-request id="llm-req"></sg-llm-request>
</div>

<script type="module">
import { SGL_LLM } from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import '/components/llm/sg-llm-request/v0/v0.1/v0.1.0/sg-llm-request.js';

// ============================================================
// TESTS
// ============================================================

const results = document.getElementById('results');
const summary = document.getElementById('summary');
let passed = 0, failed = 0;

function assert(label, condition, detail = '') {
    const div = document.createElement('div');
    if (condition) {
        div.className = 'test-pass';
        div.textContent = `✓ ${label}`;
        passed++;
    } else {
        div.className = 'test-fail';
        div.textContent = `✗ ${label}${detail ? ': ' + detail : ''}`;
        failed++;
    }
    results.appendChild(div);
}

function showSummary() {
    summary.textContent = `${passed + failed} tests — ${passed} passed, ${failed} failed`;
    summary.className = `test-summary ${failed === 0 ? 'all-pass' : 'has-fail'}`;
}

// Test 1: Custom element registered
assert('customElements.get("sg-llm-request") is defined',
    !!customElements.get('sg-llm-request'));

// Test 2: Element creates without error
let el;
try {
    el = document.createElement('sg-llm-request');
    assert('Element created without error', true);
} catch(e) {
    assert('Element created without error', false, e.message);
}

// Test 3: .busy starts false
assert('busy starts false', el.busy === false);

// Test 4: SGL_LLM constants present
assert('SGL_LLM.SEND defined',             !!SGL_LLM.SEND);
assert('SGL_LLM.REQUEST_START defined',    !!SGL_LLM.REQUEST_START);
assert('SGL_LLM.REQUEST_CHUNK defined',    !!SGL_LLM.REQUEST_CHUNK);
assert('SGL_LLM.REQUEST_COMPLETE defined', !!SGL_LLM.REQUEST_COMPLETE);
assert('SGL_LLM.REQUEST_ERROR defined',    !!SGL_LLM.REQUEST_ERROR);
assert('SGL_LLM.REQUEST_CANCEL defined',   !!SGL_LLM.REQUEST_CANCEL);
assert('SGL_LLM.CANCEL defined',           !!SGL_LLM.CANCEL);
assert('SGL_LLM.CONNECTED defined',        !!SGL_LLM.CONNECTED);

// Test 5: window.SgLlmRequest exposed
assert('window.SgLlmRequest exposed', !!window.SgLlmRequest);

// Test 6: Mock fetch — OpenAI format, no streaming
const container = document.getElementById('llm-container');

await (async () => {
    const mockReq = document.createElement('sg-llm-request');
    container.appendChild(mockReq);

    // Patch fetch for this test
    const origFetch = window.fetch;
    const events = [];

    mockReq.addEventListener(SGL_LLM.REQUEST_START, e => events.push({ type: 'start', ...e.detail }));
    mockReq.addEventListener(SGL_LLM.REQUEST_COMPLETE, e => events.push({ type: 'complete', ...e.detail }));
    mockReq.addEventListener(SGL_LLM.REQUEST_ERROR, e => events.push({ type: 'error', ...e.detail }));

    window.fetch = async (url, opts) => {
        // Verify no sgraph.ai calls with API key
        if (url.includes('sgraph.ai')) {
            throw new Error('SECURITY: fetch to sgraph.ai domain');
        }
        const body = JSON.parse(opts.body);
        // Return mock OpenAI non-streaming response
        return {
            ok: true,
            json: async () => ({
                choices: [{ message: { content: 'Hello from mock!' }, finish_reason: 'stop' }],
                usage: { prompt_tokens: 10, completion_tokens: 5, total_tokens: 15 }
            })
        };
    };

    // Simulate CONNECTED
    container.dispatchEvent(new CustomEvent(SGL_LLM.CONNECTED, {
        detail: { provider: 'openai', model: 'gpt-4o-mini', baseUrl: '', apiKey: 'sk-test' },
        bubbles: true
    }));

    // Simulate STREAMING_CHANGED (disable streaming for this test)
    container.dispatchEvent(new CustomEvent(SGL_LLM.STREAMING_CHANGED, {
        detail: { streaming: false }, bubbles: true
    }));

    // Send a request
    container.dispatchEvent(new CustomEvent(SGL_LLM.SEND, {
        detail: { messages: [{ role: 'user', content: 'hello' }], mode: 'build' },
        bubbles: true
    }));

    // Wait for async resolution
    await new Promise(r => setTimeout(r, 50));

    assert('Mock request: REQUEST_START fired',    events.some(e => e.type === 'start'));
    assert('Mock request: REQUEST_COMPLETE fired', events.some(e => e.type === 'complete'));
    assert('Mock request: content correct',        events.find(e => e.type === 'complete')?.content === 'Hello from mock!');
    assert('No REQUEST_ERROR fired',               !events.some(e => e.type === 'error'));

    window.fetch = origFetch;
    container.removeChild(mockReq);
})();

// Test 7: Mock fetch — 401 error emits REQUEST_ERROR
await (async () => {
    const mockReq = document.createElement('sg-llm-request');
    container.appendChild(mockReq);

    const events = [];
    mockReq.addEventListener(SGL_LLM.REQUEST_ERROR, e => events.push(e.detail));

    const origFetch = window.fetch;
    window.fetch = async () => ({ ok: false, status: 401, statusText: 'Unauthorized', text: async () => '' });

    container.dispatchEvent(new CustomEvent(SGL_LLM.CONNECTED, {
        detail: { provider: 'openai', model: 'gpt-4o-mini', baseUrl: '', apiKey: 'bad-key' },
        bubbles: true
    }));
    container.dispatchEvent(new CustomEvent(SGL_LLM.STREAMING_CHANGED, {
        detail: { streaming: false }, bubbles: true
    }));
    container.dispatchEvent(new CustomEvent(SGL_LLM.SEND, {
        detail: { messages: [{ role: 'user', content: 'test' }], mode: 'build' },
        bubbles: true
    }));

    await new Promise(r => setTimeout(r, 50));
    assert('401 response: REQUEST_ERROR fired',   events.length > 0);
    assert('401 response: status in error detail', events[0]?.status === 401);

    window.fetch = origFetch;
    container.removeChild(mockReq);
})();

// Test 8: Cancel fires REQUEST_CANCEL
await (async () => {
    const mockReq = document.createElement('sg-llm-request');
    container.appendChild(mockReq);

    const events = [];
    mockReq.addEventListener(SGL_LLM.REQUEST_CANCEL, e => events.push(e.detail));

    const origFetch = window.fetch;
    window.fetch = async (url, opts) => {
        // Block until aborted
        await new Promise((_, rej) => opts.signal.addEventListener('abort', () => rej(new DOMException('', 'AbortError'))));
    };

    container.dispatchEvent(new CustomEvent(SGL_LLM.CONNECTED, {
        detail: { provider: 'openai', model: 'gpt-4o-mini', baseUrl: '', apiKey: 'sk-test' },
        bubbles: true
    }));
    container.dispatchEvent(new CustomEvent(SGL_LLM.STREAMING_CHANGED, {
        detail: { streaming: false }, bubbles: true
    }));
    container.dispatchEvent(new CustomEvent(SGL_LLM.SEND, {
        detail: { messages: [{ role: 'user', content: 'test' }], mode: 'build' },
        bubbles: true
    }));

    await new Promise(r => setTimeout(r, 20));
    container.dispatchEvent(new CustomEvent(SGL_LLM.CANCEL, { bubbles: true }));
    await new Promise(r => setTimeout(r, 50));

    assert('Cancel: REQUEST_CANCEL fired', events.length > 0);

    window.fetch = origFetch;
    container.removeChild(mockReq);
})();

showSummary();

// ============================================================
// DEMO wiring
// ============================================================

const reqEl   = document.getElementById('llm-req');
const output  = document.getElementById('output');
const status  = document.getElementById('status');
const demoContainer = document.getElementById('llm-container');

reqEl.addEventListener(SGL_LLM.REQUEST_START, e => {
    output.textContent = '';
    status.textContent = `Sending to ${e.detail.provider} / ${e.detail.model} (~${e.detail.tokenEstimate} tokens)…`;
});
reqEl.addEventListener(SGL_LLM.REQUEST_CHUNK, e => {
    output.textContent = e.detail.accumulated;
});
reqEl.addEventListener(SGL_LLM.REQUEST_COMPLETE, e => {
    output.textContent = e.detail.content;
    status.textContent = `Done — ${e.detail.promptTokens} prompt + ${e.detail.completionTokens} completion tokens, ${e.detail.latencyMs}ms`;
});
reqEl.addEventListener(SGL_LLM.REQUEST_ERROR, e => {
    output.textContent = `Error: ${e.detail.error}`;
    status.textContent = `HTTP ${e.detail.status} from ${e.detail.provider}`;
});
reqEl.addEventListener(SGL_LLM.REQUEST_CANCEL, () => {
    status.textContent = 'Cancelled.';
});

// ── Model switcher: text input vs select depending on provider ──────────────

const providerSel  = document.getElementById('provider');
const modelInput   = document.getElementById('model');
const modelSelect  = document.getElementById('model-select');
const loadModelsBtn= document.getElementById('load-models-btn');

const PROVIDER_DEFAULTS = {
    openrouter: 'anthropic/claude-haiku-4-5',
    anthropic:  'claude-haiku-4-5-20251001',
    openai:     'gpt-4o-mini',
    ollama:     '',
};

function getModel() {
    return providerSel.value === 'ollama'
        ? modelSelect.value || modelInput.value
        : modelInput.value;
}

function onProviderChange() {
    const isOllama = providerSel.value === 'ollama';
    modelInput.style.display    = isOllama ? 'none' : '';
    modelSelect.style.display   = isOllama && modelSelect.options.length > 0 ? '' : 'none';
    loadModelsBtn.style.display = isOllama ? '' : 'none';
    if (!isOllama) {
        modelInput.value = PROVIDER_DEFAULTS[providerSel.value] || '';
    }
}

providerSel.addEventListener('change', onProviderChange);

async function loadOllamaModels() {
    const baseUrl = (document.getElementById('baseUrl').value.trim() || 'http://localhost:11434').replace(/\/$/, '');
    loadModelsBtn.textContent = '…';
    loadModelsBtn.disabled = true;
    try {
        const res = await fetch(`${baseUrl}/api/tags`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const models = (json.models || []).map(m => m.name).sort();
        modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
        modelSelect.style.display = '';
        modelInput.style.display = 'none';
        status.textContent = `Loaded ${models.length} model${models.length !== 1 ? 's' : ''} from Ollama`;
    } catch (err) {
        status.textContent = `Failed to load models: ${err.message}`;
        // Fall back to text input
        modelInput.style.display = '';
        modelInput.placeholder = 'e.g. gemma3:4b, llama3.2';
    } finally {
        loadModelsBtn.textContent = '↻ Load';
        loadModelsBtn.disabled = false;
    }
}

loadModelsBtn.addEventListener('click', loadOllamaModels);

document.getElementById('sendBtn').onclick = () => {
    const provider  = providerSel.value;
    const model     = getModel();
    const baseUrl   = document.getElementById('baseUrl').value;
    const apiKey    = document.getElementById('apiKey').value;
    const streaming = document.getElementById('streaming').checked;

    demoContainer.dispatchEvent(new CustomEvent(SGL_LLM.CONNECTED, {
        detail: { provider, model, baseUrl, apiKey }, bubbles: true
    }));
    demoContainer.dispatchEvent(new CustomEvent(SGL_LLM.STREAMING_CHANGED, {
        detail: { streaming }, bubbles: true
    }));
    demoContainer.dispatchEvent(new CustomEvent(SGL_LLM.SEND, {
        detail: {
            messages: [{ role: 'user', content: document.getElementById('message').value }],
            mode: 'build'
        },
        bubbles: true
    }));
};

document.getElementById('cancelBtn').onclick = () => {
    demoContainer.dispatchEvent(new CustomEvent(SGL_LLM.CANCEL, { bubbles: true }));
};
</script>
</body>
</html>
