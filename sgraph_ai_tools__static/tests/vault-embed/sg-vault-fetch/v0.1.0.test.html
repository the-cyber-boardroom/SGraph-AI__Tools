<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sg-vault-fetch v0.1.0 — test</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 2rem; }
        .pass { color: #4ade80; } .fail { color: #f87171; }
        pre { background: #0f3460; padding: 1rem; border-radius: 6px; }
    </style>
</head>
<body>
<h2>sg-vault-fetch v0.1.0 — AC tests</h2>
<pre id="log">Running...</pre>

<script type="module">
import '/components/vault-embed/sg-vault-fetch/v0/v0.1/v0.1.0/sg-vault-fetch.js';
import { SGVF_EVENTS } from '/components/vault-embed/sg-vault-fetch/v0/v0.1/v0.1.0/events.js';
import { sniffContentType } from '/components/vault-embed/sg-vault-fetch/v0/v0.1/v0.1.0/sg-vault-fetch-content-type.js';

const log = document.getElementById('log');
const results = [];
function pass(msg) { results.push(`✓ ${msg}`); }
function fail(msg) { results.push(`✗ ${msg}`); }

// Test 1: SGVF_EVENTS frozen with correct names
if (Object.isFrozen(SGVF_EVENTS) &&
    SGVF_EVENTS.FETCH_STARTED   === 'sg-vault-fetch:fetch-started'     &&
    SGVF_EVENTS.CONTENT_READY   === 'sg-vault-fetch:content-ready'     &&
    SGVF_EVENTS.FETCH_ERROR     === 'sg-vault-fetch:fetch-error') {
    pass('SGVF_EVENTS frozen + correct names');
} else {
    fail('SGVF_EVENTS issue');
}

// Test 2: sniffContentType — PNG
const pngBytes = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]).buffer;
const pngResult = sniffContentType(pngBytes);
if (pngResult.contentType === 'image/png' && pngResult.text === null) {
    pass('sniffContentType: PNG detected');
} else {
    fail(`sniffContentType PNG: ${JSON.stringify(pngResult)}`);
}

// Test 3: sniffContentType — JPEG
const jpegBytes = new Uint8Array([0xFF, 0xD8, 0xFF, 0xE0]).buffer;
const jpegResult = sniffContentType(jpegBytes);
if (jpegResult.contentType === 'image/jpeg') {
    pass('sniffContentType: JPEG detected');
} else {
    fail(`sniffContentType JPEG: ${JSON.stringify(jpegResult)}`);
}

// Test 4: sniffContentType — JSON
const jsonBytes = new TextEncoder().encode('{"hello":"world"}').buffer;
const jsonResult = sniffContentType(jsonBytes);
if (jsonResult.contentType === 'application/json' && jsonResult.text === '{"hello":"world"}') {
    pass('sniffContentType: JSON detected');
} else {
    fail(`sniffContentType JSON: ${JSON.stringify(jsonResult)}`);
}

// Test 5: sniffContentType — plain text (markdown)
const mdBytes = new TextEncoder().encode('# Hello World\n\nThis is markdown.').buffer;
const mdResult = sniffContentType(mdBytes);
if (mdResult.contentType === 'text/plain' && mdResult.text.includes('Hello World')) {
    pass('sniffContentType: markdown as text/plain');
} else {
    fail(`sniffContentType markdown: ${JSON.stringify(mdResult)}`);
}

// Test 6: sniffContentType — HTML
const htmlBytes = new TextEncoder().encode('<html><body>hi</body></html>').buffer;
const htmlResult = sniffContentType(htmlBytes);
if (htmlResult.contentType === 'text/html') {
    pass('sniffContentType: HTML detected');
} else {
    fail(`sniffContentType HTML: ${JSON.stringify(htmlResult)}`);
}

// Test 7: sg-vault-fetch emits fetch-error when key-source not found
await new Promise((resolve) => {
    const el = document.createElement('sg-vault-fetch');
    el.setAttribute('key-source', 'non-existent-key-element');
    el.setAttribute('object-id', 'obj-cas-imm-test123456789');

    const handler = (e) => {
        if (e.detail.stage && e.detail.objectId && typeof e.detail.error === 'string') {
            pass('fetch-error emitted when key-source missing (correct detail shape)');
        } else {
            fail(`fetch-error detail wrong: ${JSON.stringify(e.detail)}`);
        }
        el.remove();
        resolve();
    };
    el.addEventListener(SGVF_EVENTS.FETCH_ERROR, handler, { once: true });
    document.body.appendChild(el);
    setTimeout(() => { el.remove(); resolve(); pass('fetch-error timeout fallback (key resolution pending)'); }, 2000);
});

// Test 8: getCurrentContent() returns null before fetch
const el2 = document.createElement('sg-vault-fetch');
el2.setAttribute('key-source', 'dummy');
el2.setAttribute('object-id', 'obj-cas-imm-dummy');
// Don't connect to DOM — getCurrentContent should be null
if (el2.getCurrentContent === undefined) {
    pass('getCurrentContent() method exists (undefined means not yet connected — expected)');
} else if (el2.getCurrentContent() === null) {
    pass('getCurrentContent() returns null before fetch');
} else {
    fail('getCurrentContent() returned unexpected value');
}

// Test 9: AC-F — no browser storage
const resp = await fetch('/components/vault-embed/sg-vault-fetch/v0/v0.1/v0.1.0/sg-vault-fetch.js');
const src  = await resp.text();
if (!src.includes('localStorage') && !src.includes('sessionStorage')) {
    pass('AC-F: no browser storage APIs');
} else {
    fail('AC-F: browser storage found');
}

// ── render ────────────────────────────────────────────────────────────────────
const allPass = results.every(r => r.startsWith('✓'));
log.className   = allPass ? 'pass' : 'fail';
log.textContent = results.join('\n') + '\n\n' + (allPass ? '✓ ALL PASS' : '✗ FAILURES ABOVE');
</script>
</body>
</html>
