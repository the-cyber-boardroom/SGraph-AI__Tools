<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sg-tree v0.1.4 — Drag-and-Drop Tests</title>
<style>
  body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 20px; margin: 0; }
  h1   { color: #4ECDC4; font-size: 16px; margin-bottom: 16px; }
  #results { list-style: none; padding: 0; margin: 0 0 20px; }
  #results li { padding: 4px 8px; margin: 2px 0; border-radius: 3px; font-size: 13px; }
  .pass { background: rgba(78,205,196,0.1); color: #4ECDC4; }
  .fail { background: rgba(255,100,100,0.1); color: #ff6b6b; }
  #summary { font-size: 13px; color: #a0aec0; margin-bottom: 24px; }
  #tree-container { width: 320px; height: 400px; border: 1px solid #2a2a4a; display: inline-block; vertical-align: top; }
  .controls { display: inline-block; vertical-align: top; padding-left: 20px; }
  .controls p { font-size: 12px; color: #5a6478; max-width: 240px; line-height: 1.5; }
  button { background: #1a1a3a; border: 1px solid #2a2a4a; color: #e2e8f0; padding: 6px 14px;
    border-radius: 4px; cursor: pointer; font-size: 12px; margin: 3px 0; display: block; }
  button:hover { border-color: #4ECDC4; }
  #dnd-log { font-size: 11px; color: #a0aec0; margin-top: 10px; max-height: 150px;
    overflow-y: auto; border: 1px solid #1a1a3a; padding: 6px; border-radius: 4px; width: 240px; }
</style>
</head>
<body>
<h1>sg-tree v0.1.4 — Drag-and-Drop Tests</h1>
<ul id="results"></ul>
<div id="summary"></div>

<div id="tree-container"><sg-tree id="t" show-root="false"></sg-tree></div>
<div class="controls">
  <p>Drag nodes to reorder or reparent. Drop indicator shows insertion point.</p>
  <button onclick="resetTree()">Reset tree</button>
  <button onclick="testMoveBefore()">Test: move 'Gamma' before 'Alpha'</button>
  <button onclick="testMoveInto()">Test: move 'Gamma' into 'core'</button>
  <button onclick="testMoveAfter()">Test: move 'Alpha' after 'Gamma'</button>
  <div id="dnd-log"><em>DATA_CHANGED:</em></div>
</div>

<script type="module">
import '../../core/sg-tree/v0/v0.1/v0.1.4/sg-tree--v0.1.4.js';

const results = [];
let pass = 0, fail = 0;

function assert(label, cond, detail = '') {
    const ok = Boolean(cond);
    results.push({ label, ok, detail });
    if (ok) pass++; else fail++;
}

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

const tree = document.getElementById('t');
window._tree = tree;

const DATA = {
    id: 'root', label: 'Root', type: 'folder', children: [
        { id: 'core', label: 'core', type: 'folder', children: [
            { id: 'crypto', label: 'sg-crypto.js', type: 'file' },
            { id: 'tree',   label: 'sg-tree.js',   type: 'file' },
        ]},
        { id: 'comp', label: 'components', type: 'folder', children: [
            { id: 'header', label: 'sg-header.js', type: 'file' },
        ]},
        { id: 'alpha', label: 'Alpha',   type: 'file' },
        { id: 'beta',  label: 'Beta',    type: 'file' },
        { id: 'gamma', label: 'Gamma',   type: 'file' },
    ]
};

window.resetTree = () => {
    tree.setData(JSON.parse(JSON.stringify(DATA)));
    tree.expand('core');
    tree.expand('comp');
};

resetTree();
await sleep(50);

// --- Method and property checks ---
assert('_onDragStart method exists', typeof tree._onDragStart === 'function');
assert('_onDragOver method exists',  typeof tree._onDragOver  === 'function');
assert('_onDrop method exists',      typeof tree._onDrop      === 'function');
assert('_onDragEnd method exists',   typeof tree._onDragEnd   === 'function');
assert('_moveNode method exists',    typeof tree._moveNode    === 'function');
assert('_dropIndicator element created', tree._dndIndicator instanceof HTMLElement);

// --- Root is not draggable ---
// (root is hidden via show-root=false, but test with programmatic check)
// With show-root=false, root itself isn't rendered; the constraint applies internally.
assert('_dndIndicator is hidden initially', tree._dndIndicator.style.display !== 'block');

// --- _moveNode: move before ---
resetTree();
await sleep(30);
tree._moveNode('gamma', 'alpha', 'before');
const afterBefore = tree.getData();
const rootChildren = afterBefore.children;
const gammaIdx = rootChildren.findIndex(n => n.id === 'gamma');
const alphaIdx = rootChildren.findIndex(n => n.id === 'alpha');
assert('_moveNode before: gamma comes before alpha', gammaIdx < alphaIdx, `gamma=${gammaIdx}, alpha=${alphaIdx}`);
assert('_moveNode before: no nodes lost', rootChildren.length === 5, `got ${rootChildren.length}`);

// --- _moveNode: move after ---
resetTree();
await sleep(30);
tree._moveNode('alpha', 'gamma', 'after');
const afterAfter = tree.getData();
const rc2 = afterAfter.children;
const aIdx2 = rc2.findIndex(n => n.id === 'alpha');
const gIdx2 = rc2.findIndex(n => n.id === 'gamma');
assert('_moveNode after: alpha comes after gamma', aIdx2 > gIdx2, `alpha=${aIdx2}, gamma=${gIdx2}`);
assert('_moveNode after: no nodes lost', rc2.length === 5);

// --- _moveNode: reparent into folder ---
resetTree();
await sleep(30);
tree._moveNode('gamma', 'core', 'into');
const afterInto = tree.getData();
const coreNode = afterInto.children.find(n => n.id === 'core');
const coreChildren = coreNode ? coreNode.children : [];
const gammaInCore = coreChildren.find(n => n.id === 'gamma');
const rootAfterInto = afterInto.children;
assert('_moveNode into: gamma moved to core children', gammaInCore !== undefined);
assert('_moveNode into: gamma removed from root children', !rootAfterInto.find(n => n.id === 'gamma'));
assert('_moveNode into: core has 3 children', coreChildren.length === 3);

// --- Cannot drop into own descendant ---
resetTree();
await sleep(30);
// Try to move 'core' into 'crypto' (crypto is a child of core)
const dataBefore = JSON.stringify(tree.getData());
tree._moveNode('core', 'crypto', 'into');
const dataAfter = JSON.stringify(tree.getData());
assert('Cannot drop into own descendant (tree unchanged)', dataBefore === dataAfter);

// --- Cannot drag root ---
resetTree();
await sleep(30);
const beforeRoot = JSON.stringify(tree.getData());
tree._moveNode('root', 'alpha', 'before');
const afterRoot = JSON.stringify(tree.getData());
assert('Cannot drag root node', beforeRoot === afterRoot);

// --- DATA_CHANGED dispatched after _moveNode ---
resetTree();
await sleep(30);
let dataChangedFired = false;
tree.addEventListener('sg-tree:data-changed', () => { dataChangedFired = true; }, { once: true });
tree._moveNode('alpha', 'beta', 'after');
assert('DATA_CHANGED dispatched after _moveNode', dataChangedFired);

// --- _moveNode preserves all nodes ---
resetTree();
await sleep(30);
function countNodes(node) {
    return 1 + (node.children || []).reduce((s, c) => s + countNodes(c), 0);
}
const beforeCount = countNodes(tree.getData());
tree._moveNode('beta', 'core', 'into');
const afterCount = countNodes(tree.getData());
assert('_moveNode preserves total node count', beforeCount === afterCount, `before=${beforeCount}, after=${afterCount}`);

// --- Multiple moves ---
resetTree();
await sleep(30);
tree._moveNode('alpha', 'gamma', 'after');
tree._moveNode('beta', 'comp', 'into');
tree._moveNode('crypto', 'comp', 'before');
const afterMulti = tree.getData();
const compComp = afterMulti.children.find(n => n.id === 'comp');
assert('Multiple moves: beta is in comp', compComp.children.some(n => n.id === 'beta'));
const cryptoIdx = afterMulti.children.findIndex(n => n.id === 'crypto');
const compIdx   = afterMulti.children.findIndex(n => n.id === 'comp');
assert('Multiple moves: crypto before comp', cryptoIdx < compIdx);

// --- Render results ---
const ul  = document.getElementById('results');
const sum = document.getElementById('summary');
for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = `${r.ok ? '✓' : '✗'}  ${r.label}${r.detail ? ' — ' + r.detail : ''}`;
    ul.appendChild(li);
}
sum.textContent = `${pass} passed, ${fail} failed out of ${pass + fail} assertions`;

// --- Event log & interactive helpers ---
tree.addEventListener('sg-tree:data-changed', e => {
    const log = document.getElementById('dnd-log');
    const d = document.createElement('div');
    const kids = e.detail.root.children.map(n => n.label).join(', ');
    d.textContent = `root children: [${kids}]`;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
});

window.testMoveBefore = () => {
    resetTree(); setTimeout(() => tree._moveNode('gamma', 'alpha', 'before'), 30);
};
window.testMoveInto = () => {
    resetTree(); setTimeout(() => { tree._moveNode('gamma', 'core', 'into'); tree.expand('core'); }, 30);
};
window.testMoveAfter = () => {
    resetTree(); setTimeout(() => tree._moveNode('alpha', 'gamma', 'after'), 30);
};
</script>
</body>
</html>
