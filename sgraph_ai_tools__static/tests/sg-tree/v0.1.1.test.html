<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sg-tree v0.1.1 — Editor Mode Tests</title>
<style>
  body { font-family: monospace; background: #0d0d1a; color: #e2e8f0; padding: 20px; margin: 0; }
  h1   { color: #4ECDC4; font-size: 16px; margin-bottom: 16px; }
  #results { list-style: none; padding: 0; margin: 0 0 20px; }
  #results li { padding: 4px 8px; margin: 2px 0; border-radius: 3px; font-size: 13px; }
  .pass { background: rgba(78,205,196,0.1); color: #4ECDC4; }
  .fail { background: rgba(255,100,100,0.1); color: #ff6b6b; }
  #summary { font-size: 13px; color: #a0aec0; margin-bottom: 24px; }
  #tree-container { width: 300px; height: 400px; border: 1px solid #2a2a4a; display: inline-block; vertical-align: top; }
  .controls { display: inline-block; vertical-align: top; padding-left: 20px; }
  button { background: #1a1a3a; border: 1px solid #2a2a4a; color: #e2e8f0; padding: 6px 14px;
           border-radius: 4px; cursor: pointer; font-size: 12px; margin: 4px 0; display: block; }
  button:hover { border-color: #4ECDC4; }
  #event-log { margin-top: 12px; font-size: 11px; color: #5a6478; max-height: 150px;
               overflow-y: auto; border: 1px solid #1a1a3a; padding: 6px; border-radius: 4px; width: 260px; }
</style>
</head>
<body>
<h1>sg-tree v0.1.1 — Editor Mode Tests</h1>
<ul id="results"></ul>
<div id="summary"></div>

<div id="tree-container"><sg-tree id="t" editable="true"></sg-tree></div>
<div class="controls">
  <button onclick="window._tree._createFolder(null, 'New Folder')">_createFolder(root)</button>
  <button onclick="window._tree._createFolder('f1', 'Sub Folder')">_createFolder(f1)</button>
  <button onclick="window._tree._addFiles('f1', [{label:'photo.jpg'},{label:'doc.pdf'}])">_addFiles(f1)</button>
  <button onclick="window._tree._deleteNode(window._tree.getSelectedId())">_deleteNode(selected)</button>
  <button onclick="window._tree._startRename(window._tree.getSelectedId())">_startRename(selected)</button>
  <div id="event-log"><em>DATA_CHANGED events:</em></div>
</div>

<script type="module">
import '../../core/sg-tree/v0/v0.1/v0.1.1/sg-tree--v0.1.1.js';

const results = [];
let pass = 0, fail = 0;

function assert(label, cond, detail = '') {
    const ok = Boolean(cond);
    results.push({ label, ok, detail });
    if (ok) pass++; else fail++;
}

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

const tree = document.getElementById('t');
window._tree = tree;

const DATA = {
    id: 'root', label: 'SGraph Tools', type: 'folder', children: [
        { id: 'f1', label: 'core', type: 'folder', children: [
            { id: 'c1', label: 'sg-crypto.js', type: 'file' },
            { id: 'c2', label: 'sg-tree.js',   type: 'file' },
        ]},
        { id: 'f2', label: 'components', type: 'folder', children: [] },
        { id: 'fi1', label: 'README.md', type: 'file' },
    ]
};

tree.setData(structuredClone(DATA));
await sleep(50);

// --- Basic checks ---
assert('SgTree has _startRename method', typeof tree._startRename === 'function');
assert('SgTree has _commitRename method', typeof tree._commitRename === 'function');
assert('SgTree has _deleteNode method', typeof tree._deleteNode === 'function');
assert('SgTree has _createFolder method', typeof tree._createFolder === 'function');
assert('SgTree has _addFiles method', typeof tree._addFiles === 'function');

// --- Attribute ---
assert('editable="true" attribute set', tree.getAttribute('editable') === 'true');

// --- _commitRename ---
tree.setData(structuredClone(DATA));
await sleep(30);
tree._commitRename('c1', 'sg-crypto-v2.js');
const renamed = tree.getData();
const c1node = renamed.children[0].children[0];
assert('_commitRename updates node label', c1node.label === 'sg-crypto-v2.js');

// --- DATA_CHANGED on rename ---
let dataChangedFired = false;
tree.addEventListener('sg-tree:data-changed', () => { dataChangedFired = true; }, { once: true });
tree.setData(structuredClone(DATA));
await sleep(30);
tree._commitRename('c2', 'sg-tree-v2.js');
assert('_commitRename dispatches DATA_CHANGED', dataChangedFired);

// --- _deleteNode ---
tree.setData(structuredClone(DATA));
await sleep(30);
tree._deleteNode('c1');
const afterDelete = tree.getData();
const coreChildren = afterDelete.children[0].children;
assert('_deleteNode removes node', coreChildren.length === 1);
assert('_deleteNode removes correct node', coreChildren[0].id === 'c2');

// --- _deleteNode: cannot delete root ---
tree.setData(structuredClone(DATA));
await sleep(30);
tree._deleteNode('root');
const afterRootDel = tree.getData();
assert('_deleteNode: root cannot be deleted', afterRootDel.id === 'root');

// --- _deleteNode: clears selection ---
tree.setData(structuredClone(DATA));
await sleep(30);
tree.select('c1');
tree._deleteNode('c1');
assert('_deleteNode clears selection if deleted node was selected', tree.getSelectedId() === null);

// --- _createFolder ---
tree.setData(structuredClone(DATA));
await sleep(30);
const newId = tree._createFolder('f1', 'assets');
await sleep(30);
const afterCreate = tree.getData();
const coreAfter = afterCreate.children[0].children;
const newFolder = coreAfter.find(n => n.id === newId);
assert('_createFolder returns new id', typeof newId === 'string' && newId.length > 0);
assert('_createFolder inserts folder node', newFolder !== undefined);
assert('_createFolder node has type=folder', newFolder && newFolder.type === 'folder');
assert('_createFolder node has correct label', newFolder && newFolder.label === 'assets');

// --- _createFolder auto-label ---
tree.setData(structuredClone(DATA));
await sleep(30);
const autoId = tree._createFolder('f1');
await sleep(30);
const autoNode = tree.getData().children[0].children.find(n => n.id === autoId);
assert('_createFolder default label is "New Folder"', autoNode && autoNode.label === 'New Folder');

// --- _addFiles ---
tree.setData(structuredClone(DATA));
await sleep(30);
tree._addFiles('f2', [{ label: 'photo.jpg' }, { label: 'video.mp4' }]);
const afterAdd = tree.getData();
const compChildren = afterAdd.children[1].children;
assert('_addFiles adds correct count', compChildren.length === 2);
assert('_addFiles first file label correct', compChildren[0].label === 'photo.jpg');
assert('_addFiles second file label correct', compChildren[1].label === 'video.mp4');
assert('_addFiles nodes have type=file', compChildren.every(n => n.type === 'file'));

// --- _addFiles with File objects ---
const fakeFile = new File(['content'], 'hello.txt', { type: 'text/plain' });
tree.setData(structuredClone(DATA));
await sleep(30);
tree._addFiles('f2', [fakeFile]);
const afterFile = tree.getData();
const fileNode = afterFile.children[1].children[0];
assert('_addFiles: File.name used as label', fileNode && fileNode.label === 'hello.txt');
assert('_addFiles: File meta includes size', fileNode && typeof fileNode.meta.size === 'number');

// --- DATA_CHANGED on _deleteNode ---
let deleteFired = false;
tree.addEventListener('sg-tree:data-changed', () => { deleteFired = true; }, { once: true });
tree.setData(structuredClone(DATA));
await sleep(30);
tree._deleteNode('fi1');
assert('_deleteNode dispatches DATA_CHANGED', deleteFired);

// --- Render results ---
const ul  = document.getElementById('results');
const sum = document.getElementById('summary');
for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = `${r.ok ? '✓' : '✗'}  ${r.label}${r.detail ? ' — ' + r.detail : ''}`;
    ul.appendChild(li);
}
sum.textContent = `${pass} passed, ${fail} failed out of ${pass + fail} assertions`;

// --- Event log ---
const log = document.getElementById('event-log');
tree.addEventListener('sg-tree:data-changed', e => {
    const line = document.createElement('div');
    line.textContent = `DATA_CHANGED: ${Object.keys(e.detail.root || {}).join(', ')} (${Date.now()})`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
});
</script>
</body>
</html>
