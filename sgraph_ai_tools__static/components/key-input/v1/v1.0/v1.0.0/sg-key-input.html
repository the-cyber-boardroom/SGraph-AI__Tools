<div class="keyinput">
    <label class="keyinput__label" for="key-input">Enter your key to open the file</label>

    <div class="keyinput__input-wrap">
        <input type="text"
               id="key-input"
               class="keyinput__input"
               placeholder="apple-mango-56"
               inputmode="text"
               autocapitalize="none"
               autocorrect="off"
               spellcheck="false"
               autocomplete="off">
    </div>

    <div id="suggestions" class="keyinput__suggestions"></div>

    <div id="feedback" class="keyinput__feedback"></div>

    <button type="button" id="submit-btn" class="keyinput__submit">Open File</button>
</div>
