<div class="ytv">

    <header class="ytv__header">
        <span class="ytv__title">My YouTube Uploads</span>
        <span id="count" class="ytv__count"></span>
        <button type="button" id="refresh-btn" class="ytv__btn ytv__btn--ghost">Refresh</button>
    </header>

    <div class="ytv__toolbar">
        <input type="search" id="filter-input" class="ytv__filter"
               placeholder="Filter loaded videos by title…" autocomplete="off">
        <select id="sort-select" class="ytv__sort" aria-label="Sort">
            <option value="newest" selected>Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="most-viewed">Most viewed</option>
            <option value="longest">Longest</option>
            <option value="shortest">Shortest</option>
            <option value="title-az">Title A → Z</option>
        </select>
    </div>

    <div id="status" class="ytv__status">Sign in to load your uploads.</div>

    <div id="grid" class="ytv__grid" role="list"></div>

    <footer class="ytv__footer">
        <button type="button" id="more-btn" class="ytv__btn ytv__btn--ghost" hidden>Load more</button>
    </footer>

</div>
