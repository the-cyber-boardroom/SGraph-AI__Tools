<div class="ytv">

    <header class="ytv__header">
        <span class="ytv__title">My YouTube Uploads</span>
        <span id="count" class="ytv__count"></span>
        <button type="button" id="refresh-btn" class="ytv__btn ytv__btn--ghost">Refresh</button>
    </header>

    <div id="status" class="ytv__status">Sign in to load your uploads.</div>

    <div id="grid" class="ytv__grid" role="list"></div>

    <footer class="ytv__footer">
        <button type="button" id="more-btn" class="ytv__btn ytv__btn--ghost" hidden>Load more</button>
    </footer>

</div>
