<div class="sgcc">
    <div class="sgcc-reason" hidden></div>
    <select class="sgcc-template" hidden aria-label="Template"></select>
    <div class="sgcc-row">
        <button type="button" class="sgcc-attach" title="Attach a file">📎</button>
        <textarea class="sgcc-text" rows="2" placeholder="Type a message…" aria-label="Message"></textarea>
        <button type="button" class="sgcc-send">Send</button>
    </div>
</div>
