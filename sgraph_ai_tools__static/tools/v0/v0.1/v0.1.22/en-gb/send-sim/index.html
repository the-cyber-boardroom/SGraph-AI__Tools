// ── Wordlist for passphrase generation ────────────────────────────────────────
const WORDS = ['amber','coast','forge','lemon','prism','swift','ember','delta','grove',

function rndWord() { return WORDS[Math.floor(Math.random()*WORDS.length)]; }

// ── VFS bus helpers ───────────────────────────────────────────────────────────
function waitForResponse(requestId, responseEvent, timeout = 8000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Timeout')), timeout);
        const ok  = (e) => { if (e.detail?.requestId !== requestId) return; done(); resolve(e.detail); };
        const err = (e) => { if (e.detail?.requestId !== requestId) return; done(); reject(new Error(e.detail?.error || 'VFS error')); };
        function done() { clearTimeout(timer); appRoot.removeEventListener(responseEvent, ok); appRoot.removeEventListener(SGL_VFS.ERROR, err); }
        appRoot.addEventListener(responseEvent, ok);
        appRoot.addEventListener(SGL_VFS.ERROR, err);
    });
}
async function vfsOp(req, resp, detail) {
    const requestId = newRequestId();
    appRoot.dispatchEvent(new CustomEvent(req, { detail: { ...detail, requestId }, bubbles: true }));
    return waitForResponse(requestId, resp);
}

// ─────────────────────────────────────────────────────────────────────────────
// Tree refresh
// ─────────────────────────────────────────────────────────────────────────────

async function walkFolder(path) {
    const res = await vfsOp(SGL_VFS.LIST_REQUEST, SGL_VFS.LIST_RESPONSE, { path });
    const entries = res.result || [];
    const children = [];
    for (const entry of entries) {
        if (entry.type === 'folder') {
            children.push({ id: entry.path, label: entry.name, type: 'folder', children: await walkFolder(entry.path) });
        } else {
            _itemCount++;
            const objId = entry.name;
            children.push({ id: entry.path, label: objId, type: 'file', badge: objId.slice(-6), meta: entry.path });
        }
    }
    return children;
}

async function refreshTree() {
    if (!tree) return;
    _itemCount = 0;
    try {
        const children = await walkFolder('/');
        const countEl = document.getElementById('obj-count');
        const emptyEl = document.getElementById('tree-empty');
        if (countEl) countEl.textContent = `${_itemCount} objects`;
        if (children.length === 0) {
            tree.style.display = 'none';
            if (emptyEl) emptyEl.style.display = '';
            return;
        }
        const root = { id: '/', label: '/', type: 'folder', children };
        const prev = tree.getLayoutState?.();
        tree.setData(root);
        if (prev) tree.setLayoutState?.(prev);
        tree.style.display = 'block';
        if (emptyEl) emptyEl.style.display = 'none';
    } catch { /* not ready */ }
}

[SGL_VFS.WRITE_RESPONSE, SGL_VFS.CREATE_FOLDER_RESPONSE,
 SGL_VFS.DELETE_RESPONSE, SGL_VFS.PROVIDER_READY]
    .forEach(evt => appRoot.addEventListener(evt, () => refreshTree()));

    if (!pathEl || !bodyEl) return;

    pathEl.textContent = vfsPath;
    typeEl.style.display = 'inline';
    decBtn.style.display = 'inline';

    // Determine type from path
    const objId = vfsPath.split('/').pop();
    if (vfsPath.includes('/bare/refs/'))    { typeEl.textContent = 'REF';    typeEl.className = 'pill pill-amber'; }
    else if (vfsPath.includes('/bare/keys/')) { typeEl.textContent = 'KEY';  typeEl.className = 'pill pill-purple'; }
    else                                    { typeEl.textContent = 'OBJ';    typeEl.className = 'pill pill-blue'; }

    try {
        const hexContent = await vfs.readFile(vfsPath);
        const hexStr = typeof hexContent === 'string' ? hexContent : '';
        bodyEl.innerHTML = `
<div class="insp-field-label">Ciphertext preview (first 32 bytes)</div>
<div class="insp-hex">${esc(hexStr.slice(0, 64))}${hexStr.length > 64 ? '…' : ''}</div>
<div class="insp-field-label">IV (bytes 0–11)</div>
<div class="insp-hex">${esc(hexStr.slice(0, 24))}</div>
<div id="insp-json-section" style="display:none">
  <div class="insp-field-label">Decrypted JSON</div>
  <div class="insp-json" id="insp-json"></div>
</div>
<div class="insp-error" id="insp-err" style="display:none"></div>`;
    } catch (err) {
        bodyEl.innerHTML = `<div class="insp-error">Read error: ${esc(err.message)}</div>`;
    }

    // Wire decrypt button
    decBtn.onclick = async () => {
        if (!simVault) return;
        const jsonSection = document.getElementById('insp-json-section');
        const jsonEl      = document.getElementById('insp-json');
        const errEl       = document.getElementById('insp-err');
        try {
            const obj = await readSimFileAsJson(simVault, vfsPath);
            // Update type badge from schema
            const schema = obj.schema || '';
            if (schema.startsWith('commit')) { typeEl.textContent = 'COMMIT'; typeEl.className = 'pill pill-purple'; }
            else if (schema.startsWith('tree')) { typeEl.textContent = 'TREE';   typeEl.className = 'pill pill-green'; }
            else if (schema.startsWith('ref'))  { typeEl.textContent = 'REF';    typeEl.className = 'pill pill-amber'; }
            else { typeEl.textContent = 'BLOB'; typeEl.className = 'pill pill-blue'; }
            jsonEl.textContent = JSON.stringify(obj, null, 2);
            jsonSection.style.display = 'block';
            if (errEl) errEl.style.display = 'none';
        } catch (err) {
            if (errEl) { errEl.textContent = `Could not decrypt: ${err.message}`; errEl.style.display = 'block'; }
            if (jsonSection) jsonSection.style.display = 'none';
        }
    };
}

// ─────────────────────────────────────────────────────────────────────────────
// Vault panel bindings
// ─────────────────────────────────────────────────────────────────────────────

function bindVaultPanel() {
    document.getElementById('btn-gen-pass').addEventListener('click', () => {
        document.getElementById('inp-passphrase').value = rndPassphrase();
    });
    document.getElementById('btn-gen-id').addEventListener('click', () => {
        document.getElementById('inp-vault-id').value = generateVaultId();
    });

    document.getElementById('btn-create-vault').addEventListener('click', async () => {
        if (!vfs) { showResult('vault-setup-result', 'VFS not ready', true); return; }
        const passphrase = document.getElementById('inp-passphrase').value.trim();
        const vaultId    = document.getElementById('inp-vault-id').value.trim();
        const btn = document.getElementById('btn-create-vault');
        btn.disabled = true; btn.textContent = 'Deriving keys…';
        try {
            simVault = await createSimVault(vfs, passphrase, vaultId);
            const ms = simVault.keys.derivationTimeMs.toFixed(0);
            showResult('vault-setup-result', `Keys derived in ${ms}ms. Vault ${vaultId} ready.`, false, true);
            document.getElementById('vault-status').style.display = 'flex';
            document.getElementById('vault-id-display').textContent = vaultId;
            document.getElementById('kdf-time').textContent = `${ms}ms KDF`;
            setVaultReady(true);
            await refreshVaultState();
            await refreshTree();
        } catch (err) {
            showResult('vault-setup-result', err.message, true);
            simVault = null; setVaultReady(false);
        }
        btn.disabled = false; btn.textContent = 'Derive Keys & Open Vault';
    });

    document.getElementById('btn-write-file').addEventListener('click', async () => {
        if (!simVault) return;
        const path    = document.getElementById('inp-file-path').value.trim();
        const content = document.getElementById('inp-file-content').value;
        const message = document.getElementById('inp-commit-msg').value.trim() || undefined;
        const btn = document.getElementById('btn-write-file');
        btn.disabled = true; btn.textContent = 'Writing…';
        try {
            const r = await writeSimFile(simVault, path, content, { message });
            showResult('write-result',
                `blob:   ${r.blobId.slice(-12)}\ntree:   ${r.treeId.slice(-12)}\ncommit: ${r.commitId.slice(-12)}`,
                false, true);
            await refreshVaultState();
        } catch (err) { showResult('write-result', err.message, true); }
        btn.disabled = false; btn.textContent = 'Commit';
    });

    document.getElementById('btn-refresh-state').addEventListener('click', refreshVaultState);

    const BLOG = [
        ['posts/hello-world.md', '# Hello World\n\nFirst encrypted blog post.', 'Add: Hello World post'],
        ['posts/sgraph-intro.md', '# SGraph Introduction\n\nZero-knowledge encrypted storage.', 'Add: SGraph intro'],
        ['posts/vault-deep-dive.md', '# Vault Deep Dive\n\nblob → tree → commit → ref.', 'Add: Vault deep dive'],
    ];
    const CFG = [
        ['config/app.json', '{"name":"my-app","version":"1.0.0","debug":false}', 'Add: app config'],
        ['config/db.json', '{"host":"localhost","port":5432,"poolSize":10}', 'Add: db config'],
        ['config/flags.json', '{"darkMode":true,"beta":false}', 'Add: feature flags'],
    ];

    async function runPreset(files) {
        showResult('preset-result', 'Writing…', false, true);
        try {
            for (const [p, c, m] of files) await writeSimFile(simVault, p, c, { message: m });
            showResult('preset-result', `✓ Wrote ${files.length} files`, false, true);
            await refreshVaultState();
        } catch (err) { showResult('preset-result', err.message, true); }
    }

    document.getElementById('btn-preset-blog').addEventListener('click', () => runPreset(BLOG));
    document.getElementById('btn-preset-config').addEventListener('click', () => runPreset(CFG));
    document.getElementById('btn-preset-history').addEventListener('click', async () => {
        showResult('preset-result', 'Building 5-commit history…', false, true);
        try {
            const msgs = ['init: empty README','fix: add description','feat: document API','feat: examples','docs: final polish'];
            let content = '';
            for (const msg of msgs) {
                content += (content ? '\n\n' : '') + `## ${msg}`;
                await writeSimFile(simVault, 'README.md', content, { message: msg });
            }
            showResult('preset-result', '✓ 5 commits on README.md', false, true);
            await refreshVaultState();
        } catch (err) { showResult('preset-result', err.message, true); }
    });

    // Provider switching
    document.querySelectorAll('.prov-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const prov = btn.dataset.prov;
            document.querySelectorAll('.prov-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const old = document.querySelector('sg-vfs-bus');
            const neu = document.createElement('sg-vfs-bus');
            neu.id = 'vfs-bus-el';
            neu.setAttribute('provider', prov);
            appRoot.insertBefore(neu, old);
            old.remove();
            simVault = null; vfs = null;
            setVaultReady(false);
            document.getElementById('vault-status').style.display = 'none';
            document.getElementById('state-empty').style.display = '';
            document.getElementById('state-content').style.display = 'none';
        });
    });
}

// ─────────────────────────────────────────────────────────────────────────────
// Vault state refresh
// ─────────────────────────────────────────────────────────────────────────────

async function refreshVaultState() {
    if (!simVault) return;
    try {
        const state = await getSimVaultState(simVault);
        const badge = document.getElementById('vault-state-badge');
        if (state.isEmpty) {
            badge.textContent = 'EMPTY'; badge.className = 'pill pill-accent';
            document.getElementById('state-empty').style.display = '';
            document.getElementById('state-content').style.display = 'none';
        } else {
            badge.textContent = `${state.fileCount} file${state.fileCount === 1 ? '' : 's'}`;
            badge.className = 'pill pill-green';
            document.getElementById('state-empty').style.display = 'none';
            document.getElementById('state-content').style.display = 'block';
            document.getElementById('state-head').textContent = (state.headCommitId || '—').slice(-12);
            document.getElementById('state-branch').textContent = state.branchId;
            document.getElementById('state-file-count').textContent = `${state.fileCount} file${state.fileCount===1?'':'s'}`;
            const listEl = document.getElementById('state-file-list');
            listEl.innerHTML = '';
            for (const f of state.files) {
                const row = document.createElement('div');
                row.className = 'file-item';
                row.innerHTML = `<span class="file-name">${esc(f.name)}</span><span class="file-size">${f.size>=1024?(f.size/1024).toFixed(1)+'KB':f.size+'B'}</span>`;
                listEl.appendChild(row);
            }
        }
    } catch { /* ignore */ }
}

// ─────────────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────────────

function setVaultReady(ready) {
    ['btn-write-file','btn-refresh-state','btn-preset-blog','btn-preset-config','btn-preset-history']
        .forEach(id => { const el = document.getElementById(id); if (el) el.disabled = !ready; });
}
function showResult(id, msg, isError=false, isOk=false) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = `result-msg ${isError ? 'error' : isOk ? 'ok' : 'info'}`;
    el.style.display = 'block';
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
