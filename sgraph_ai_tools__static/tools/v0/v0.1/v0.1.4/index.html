<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tools.sgraph.ai — Redirecting...</title>
    <script>
        // Locale redirect: detect browser language and redirect to appropriate locale folder.
        // Supports all 17 SGraph locales. Falls back to en-gb if no match.
        (function() {
            var supported = [
                'en-gb','en-us','de-de','de-ch',
                'es-es','es-ar','es-mx',
                'fr-fr','fr-ca',
                'hr-hr','it-it','nl-nl','pl-pl',
                'pt-br','pt-pt','ro-ro','tlh'
            ];
            // Check sessionStorage for a previously chosen locale
            try {
                var stored = sessionStorage.getItem('sg-locale');
                if (stored && supported.indexOf(stored) !== -1) {
                    window.location.replace(stored + '/');
                    return;
                }
            } catch(e) {}
            var langs = navigator.languages || [navigator.language || 'en-GB'];
            var matched = 'en-gb';

            for (var i = 0; i < langs.length; i++) {
                var lang = langs[i].toLowerCase().replace('_', '-');
                // Try exact match first (e.g., en-gb)
                if (supported.indexOf(lang) !== -1) {
                    matched = lang;
                    break;
                }
                // Try language-only match (e.g., fr -> fr-fr, de -> de-de)
                var langOnly = lang.split('-')[0];
                for (var j = 0; j < supported.length; j++) {
                    if (supported[j].split('-')[0] === langOnly) {
                        matched = supported[j];
                        break;
                    }
                }
                if (matched !== 'en-gb' || langOnly === 'en') break;
            }

            window.location.replace(matched + '/');
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=en-gb/">
    </noscript>
</head>
<body>
    <p>Redirecting to <a href="en-gb/">English (UK)</a>...</p>
</body>
</html>
