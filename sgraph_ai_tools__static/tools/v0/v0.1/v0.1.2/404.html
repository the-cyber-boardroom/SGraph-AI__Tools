<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found — tools.sgraph.ai</title>
    <link rel="stylesheet" href="_common/css/tools.css">
    <style>
        .error-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-page__code {
            font-size: 4rem;
            font-weight: 700;
            color: var(--sg-accent);
            margin-bottom: 0.5rem;
        }
        .error-page__message {
            font-size: 1.25rem;
            color: var(--sg-text-muted);
            margin-bottom: 2rem;
        }
        .error-page a {
            color: var(--sg-accent);
            text-decoration: none;
        }
        .error-page a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-page__code">404</div>
        <p class="error-page__message">Page not found</p>
        <a href="/en-gb/">Back to tools.sgraph.ai</a>
    </div>
</body>
</html>
