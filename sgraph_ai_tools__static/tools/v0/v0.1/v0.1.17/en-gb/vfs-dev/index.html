<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFS Dev — tools.sgraph.ai</title>
    <meta name="description" content="Phase 2 VFS developer tool: memory / IndexedDB / layered providers, real-time event viewer with 4 tabs.">
    <link rel="icon" type="image/svg+xml" href="../../../_common/favicon.svg">
    <link rel="stylesheet" href="../../../_common/css/tools.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        sg-site-header { flex-shrink: 0; }

        #vfs-bus {
            flex: 1;
            display: flex;
            flex-direction: row;
            min-height: 0;
            overflow: hidden;
        }

        /* ── Two-column split ─────────────────────────────────────────────── */
        .col-ops {
            width: 38%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--sg-border, #2a3a5c);
            overflow: hidden;
        }
        .col-timeline {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        /* ── Panel chrome ─────────────────────────────────────────────────── */
        .panel-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.7rem;
            border-bottom: 1px solid var(--sg-border, #2a3a5c);
            background: var(--sg-bg-secondary, #16213e);
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--sg-text-muted, #8892b0);
            flex: 1;
        }
        .provider-badge {
            font-size: 0.62rem;
            font-weight: 700;
            background: rgba(78,205,196,0.12);
            color: var(--sg-accent, #4ecdc4);
            border: 1px solid rgba(78,205,196,0.3);
            border-radius: 9999px;
            padding: 0.1rem 0.45rem;
        }

        /* ── Operations panel ─────────────────────────────────────────────── */
        .ops-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        .op-section {
            border: 1px solid var(--sg-border, #2a3a5c);
            border-radius: 6px;
            padding: 0.5rem 0.6rem;
        }
        .op-section-title {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--sg-text-muted, #8892b0);
            margin-bottom: 0.4rem;
        }
        .op-row {
            display: flex;
            gap: 0.4rem;
            align-items: flex-start;
            margin-bottom: 0.3rem;
            flex-wrap: wrap;
        }
        .op-input {
            flex: 1;
            min-width: 6rem;
            background: var(--sg-bg-primary, #0d1b2a);
            border: 1px solid var(--sg-border, #2a3a5c);
            border-radius: 4px;
            color: var(--sg-text, #ccd6f6);
            font-size: 0.73rem;
            padding: 0.28rem 0.45rem;
            font-family: 'Fira Mono', monospace;
        }
        .op-input:focus { outline: none; border-color: var(--sg-accent, #4ecdc4); }
        textarea.op-input { resize: vertical; }
        .op-btn {
            padding: 0.28rem 0.65rem;
            border-radius: 4px;
            border: 1px solid var(--sg-accent, #4ecdc4);
            background: rgba(78,205,196,0.08);
            color: var(--sg-accent, #4ecdc4);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            line-height: 1.4;
        }
        .op-btn:hover { background: rgba(78,205,196,0.18); }
        .op-btn.danger {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233,69,96,0.07);
        }
        .op-btn.danger:hover { background: rgba(233,69,96,0.15); }
        .op-result {
            display: none;
            font-size: 0.68rem;
            font-family: 'Fira Mono', monospace;
            color: var(--sg-text-muted, #8892b0);
            background: rgba(13,27,42,0.7);
            border: 1px solid var(--sg-border, #2a3a5c);
            border-radius: 4px;
            padding: 0.3rem 0.45rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 6rem;
            overflow-y: auto;
            margin-top: 0.2rem;
        }
        .op-result.ok    { color: #6ee7b7; border-color: rgba(110,231,183,0.3); }
        .op-result.error { color: #e94560; border-color: rgba(233,69,96,0.3); }

        /* ── Batch ────────────────────────────────────────────────────────── */
        .preset-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .preset-btn {
            padding: 0.25rem 0.55rem;
            border-radius: 4px;
            border: 1px solid rgba(167,139,250,0.35);
            background: rgba(167,139,250,0.07);
            color: #a78bfa;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .preset-btn:hover { background: rgba(167,139,250,0.18); }
        .progress-bar {
            height: 3px;
            border-radius: 2px;
            background: var(--sg-border, #2a3a5c);
            margin-top: 0.35rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #a78bfa;
            width: 0;
            transition: width 0.1s;
        }

        /* ── Provider selector ────────────────────────────────────────────── */
        .provider-selector {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .prov-opt {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--sg-border, #2a3a5c);
            background: transparent;
            color: var(--sg-text-muted, #8892b0);
            font-size: 0.7rem; font-weight: 600;
            cursor: pointer;
        }
        .prov-opt:hover { border-color: var(--sg-accent, #4ecdc4); color: var(--sg-accent, #4ecdc4); }
        .prov-opt.active {
            border-color: var(--sg-accent, #4ecdc4);
            background: rgba(78,205,196,0.12);
            color: var(--sg-accent, #4ecdc4);
        }
        .prov-opt[data-prov="layered"].active { border-color: #a78bfa; background: rgba(167,139,250,0.12); color: #a78bfa; }
        .prov-opt[data-prov="indexeddb"].active { border-color: #6ee7b7; background: rgba(110,231,183,0.1); color: #6ee7b7; }
        .prov-note {
            font-size: 0.62rem;
            color: var(--sg-text-muted, #8892b0);
            margin-top: 0.3rem;
            line-height: 1.5;
        }
        .prov-note strong { color: var(--sg-text, #ccd6f6); }
    </style>
</head>
<body>

<script type="module" src="/components/site-header/v1/v1.0/v1.0.3/sg-site-header.js"></script>
<sg-site-header site="Tools" home-url="../../../"></sg-site-header>

<!--

    sg-vfs-bus (headless) owns the VirtualFileSystem instance.

    <!-- Headless: no visible output, wires up VFS event routing -->
    <sg-vfs-bus id="vfs-bus-el" provider="memory"></sg-vfs-bus>

    <!-- Left: Operations panel -->

        <div class="panel-header">
            <span class="panel-title">VFS Operations</span>
            <span class="provider-badge" id="provider-badge">memory</span>
        </div>
        <div class="ops-scroll">

            <!-- Provider selector -->
            <div class="op-section">
                <div class="op-section-title">Storage Provider</div>
                <div class="provider-selector">
                    <button class="prov-opt active" data-prov="memory">memory</button>
                    <button class="prov-opt" data-prov="indexeddb">indexeddb</button>
                    <button class="prov-opt" data-prov="layered">layered (M+IDB)</button>
                </div>
                <div class="prov-note" id="prov-note">
                    <strong>Memory</strong> — in-process only, lost on reload.

                </div>

                    <textarea class="op-input" id="write-content" rows="3" placeholder="File content…">Hello, VFS world!</textarea>
                </div>
                <div class="op-row"><button class="op-btn" id="btn-write">Write</button></div>

                    <input class="op-input" id="list-path" value="/" placeholder="/folder">
                    <button class="op-btn" id="btn-list">List</button>
                </div>
                <div class="op-result" id="list-result"></div>
            </div>

            <div class="op-section">
                <div class="op-section-title">Stat</div>
                <div class="op-row">
                    <input class="op-input" id="stat-path" value="/demo/hello.txt" placeholder="/path">
                    <button class="op-btn" id="btn-stat">Stat</button>
                </div>
                <div class="op-result" id="stat-result"></div>
            </div>

            <div class="op-section">
                <div class="op-section-title">Create Folder</div>
                <div class="op-row">
                    <input class="op-input" id="mkdir-path" value="/demo/subdir" placeholder="/folder/path">
                    <button class="op-btn" id="btn-mkdir">Create</button>
                </div>
                <div class="op-result" id="mkdir-result"></div>
            </div>

            <div class="op-section">
                <div class="op-section-title">Copy File</div>
                <div class="op-row">
                    <input class="op-input" id="copy-src" value="/demo/hello.txt" placeholder="source">
                    <input class="op-input" id="copy-dst" value="/demo/hello-copy.txt" placeholder="destination">
                </div>
                <div class="op-row"><button class="op-btn" id="btn-copy">Copy</button></div>
                <div class="op-result" id="copy-result"></div>

            <div class="op-section">

                    <input class="op-input" id="delete-path" value="/demo/hello.txt" placeholder="/path">
                    <button class="op-btn danger" id="btn-delete">Delete</button>

            <div class="op-section">

                <div class="op-row">
                    <input class="op-input" id="exists-path" value="/demo/hello.txt" placeholder="/path">

            <div class="op-section">
                <div class="op-section-title">Batch Generator</div>
                <div class="preset-row">
                    <button class="preset-btn" data-preset="10-files">10 files</button>
                    <button class="preset-btn" data-preset="50-files">50 files</button>
                    <button class="preset-btn" data-preset="nested">Nested tree</button>
                    <button class="preset-btn" data-preset="read-all">Read all</button>
                    <button class="preset-btn" data-preset="delete-all">Delete all</button>

        </div>
    </div>

    <!-- Right: Event timeline -->
    <div class="col-timeline">
        <sg-vfs-event-viewer></sg-vfs-event-viewer>
    </div>
</div>

<script type="module">
import '/components/vfs/sg-vfs-bus/v0/v0.1/v0.1.0/sg-vfs-bus.js';
import '/components/vfs/sg-vfs-event-viewer/v0/v0.1/v0.1.0/sg-vfs-event-viewer.js';
import { SGL_VFS }         from '/core/sg-vfs/v0/v0.1/v0.1.0/sg-vfs-events.js';
import { newRequestId }    from '/core/sg-vfs/v0/v0.1/v0.1.0/sg-vfs-request-id.js';
import { IndexedDbProvider } from '/core/sg-vfs/v0/v0.1/v0.1.0/sg-vfs-provider-indexeddb.js';

const bus     = document.getElementById('vfs-bus');
const busEl   = document.getElementById('vfs-bus-el');
const badge   = document.getElementById('provider-badge');
const provNote = document.getElementById('prov-note');

// ── Provider switching ────────────────────────────────────────────────────────

const PROV_NOTES = {
    memory:   '<strong>Memory</strong> — in-process only, lost on reload.',
    indexeddb:'<strong>IndexedDB</strong> — persists across reloads. Use "Clear IDB" to reset.',
    layered:  '<strong>Layered</strong> — Memory (priority 0) + IndexedDB (priority 1). Reads waterfall; writes go to both. Check Providers tab for hit/miss stats.',
};

document.querySelectorAll('.prov-opt').forEach(btn => {
    btn.addEventListener('click', () => {
        const prov = btn.dataset.prov;
        document.querySelectorAll('.prov-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        badge.textContent = prov;
        provNote.innerHTML = PROV_NOTES[prov] || '';
        document.getElementById('btn-clear-idb').style.display =
            (prov === 'indexeddb' || prov === 'layered') ? '' : 'none';

        // Swap the provider by replacing sg-vfs-bus
        const parent = busEl.parentElement;
        const newBus = document.createElement('sg-vfs-bus');
        newBus.id = 'vfs-bus-el';
        newBus.setAttribute('provider', prov);
        parent.replaceChild(newBus, busEl);
        // Update reference
        window.__vfsBusEl = newBus;
    });
});

// Clear IndexedDB
document.getElementById('btn-clear-idb').addEventListener('click', async () => {
    const p = new IndexedDbProvider();
    await p.init();
    await p.clear();
    showResult('clear-idb-result', 'IndexedDB cleared.');
});

// ── Helpers ───────────────────────────────────────────────────────────────────

function showResult(id, text, isError = false) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'op-result ' + (isError ? 'error' : 'ok');
    el.style.display = 'block';
}

function waitForResponse(requestId, responseEvent, timeout = 5000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
            bus.removeEventListener(responseEvent, handler);
            bus.removeEventListener(SGL_VFS.ERROR, errHandler);
            reject(new Error('Timeout'));
        }, timeout);
        function handler(e) {
            if (e.detail?.requestId !== requestId) return;
            clearTimeout(timer);
            bus.removeEventListener(responseEvent, handler);
            bus.removeEventListener(SGL_VFS.ERROR, errHandler);
            resolve(e.detail);
        }
        function errHandler(e) {
            if (e.detail?.requestId !== requestId) return;
            clearTimeout(timer);
            bus.removeEventListener(responseEvent, handler);
            bus.removeEventListener(SGL_VFS.ERROR, errHandler);
            reject(new Error(e.detail?.error || 'VFS error'));
        }
        bus.addEventListener(responseEvent, handler);
        bus.addEventListener(SGL_VFS.ERROR, errHandler);
    });
}

async function vfsOp(requestEvent, responseEvent, detail, resultId) {
    const requestId = newRequestId();
    try {
        bus.dispatchEvent(new CustomEvent(requestEvent, {
            detail: { ...detail, requestId },
            bubbles: true,
            composed: true,
        }));
        return await waitForResponse(requestId, responseEvent);
    } catch (err) {
        if (resultId) showResult(resultId, err.message, true);
        throw err;
    }
}

// ── Wire buttons ──────────────────────────────────────────────────────────────

document.getElementById('btn-write').addEventListener('click', async () => {
    const path    = document.getElementById('write-path').value.trim();
    const content = document.getElementById('write-content').value;
    try {
        await vfsOp(SGL_VFS.WRITE_REQUEST, SGL_VFS.WRITE_RESPONSE, { path, content }, 'write-result');
        showResult('write-result', `Written: ${path} (${content.length} chars)`);
    } catch { /* shown */ }
});

document.getElementById('btn-read').addEventListener('click', async () => {
    const path = document.getElementById('read-path').value.trim();
    try {
        const r = await vfsOp(SGL_VFS.READ_REQUEST, SGL_VFS.READ_RESPONSE, { path }, 'read-result');
        showResult('read-result', r.result ?? '(empty)');
    } catch { /* shown */ }
});

document.getElementById('btn-list').addEventListener('click', async () => {
    const path = document.getElementById('list-path').value.trim();
    try {
        const r = await vfsOp(SGL_VFS.LIST_REQUEST, SGL_VFS.LIST_RESPONSE, { path }, 'list-result');
        const entries = r.result || [];
        showResult('list-result', entries.length
            ? entries.map(e => `${e.type === 'folder' ? '[dir]' : '[file]'} ${e.name}  (${e.size}B)`).join('\n')
            : '(empty folder)');
    } catch { /* shown */ }
});

document.getElementById('btn-stat').addEventListener('click', async () => {
    const path = document.getElementById('stat-path').value.trim();
    try {
        const r = await vfsOp(SGL_VFS.STAT_REQUEST, SGL_VFS.STAT_RESPONSE, { path }, 'stat-result');
        showResult('stat-result', JSON.stringify(r.result, null, 2));
    } catch { /* shown */ }
});

document.getElementById('btn-mkdir').addEventListener('click', async () => {
    const path = document.getElementById('mkdir-path').value.trim();
    try {
        await vfsOp(SGL_VFS.CREATE_FOLDER_REQUEST, SGL_VFS.CREATE_FOLDER_RESPONSE, { path }, 'mkdir-result');
        showResult('mkdir-result', `Created: ${path}`);
    } catch { /* shown */ }
});

document.getElementById('btn-copy').addEventListener('click', async () => {
    const src = document.getElementById('copy-src').value.trim();
    const dst = document.getElementById('copy-dst').value.trim();
    try {
        await vfsOp(SGL_VFS.COPY_REQUEST, SGL_VFS.COPY_RESPONSE, { path: src, src, dst }, 'copy-result');
        showResult('copy-result', `Copied: ${src} → ${dst}`);
    } catch { /* shown */ }
});

document.getElementById('btn-delete').addEventListener('click', async () => {
    const path = document.getElementById('delete-path').value.trim();
    try {
        await vfsOp(SGL_VFS.DELETE_REQUEST, SGL_VFS.DELETE_RESPONSE, { path }, 'delete-result');
        showResult('delete-result', `Deleted: ${path}`);
    } catch { /* shown */ }
});

document.getElementById('btn-exists').addEventListener('click', async () => {
    const path = document.getElementById('exists-path').value.trim();
    try {
        const r = await vfsOp(SGL_VFS.EXISTS_REQUEST, SGL_VFS.EXISTS_RESPONSE, { path }, 'exists-result');
        showResult('exists-result', `exists: ${r.result}`);
    } catch { /* shown */ }
});

// ── Batch presets ─────────────────────────────────────────────────────────────

document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => runPreset(btn.dataset.preset));
});

async function runPreset(preset) {
    const progressFill = document.getElementById('batch-progress');
    const batchId = newRequestId();
    let total = 0, done = 0, errors = 0;
    const start = performance.now();

    function setProgress(n, t) {
        progressFill.style.width = t ? `${Math.round((n / t) * 100)}%` : '0%';
    }

    function emitBatch(eventName, extra) {
        bus.dispatchEvent(new CustomEvent(eventName, {
            detail: { batchId, ...extra },
            bubbles: true,
            composed: true,
        }));
    }

    async function writeOne(path, content) {
        try {
            await vfsOp(SGL_VFS.WRITE_REQUEST, SGL_VFS.WRITE_RESPONSE, { path, content });
        } catch { errors++; }
        done++;
        setProgress(done, total);
        emitBatch(SGL_VFS.BATCH_PROGRESS, { done, total, lastOp: path });
    }

    switch (preset) {
        case '10-files': {
            total = 10;
            emitBatch(SGL_VFS.BATCH_STARTED, { total, preset });
            for (let i = 0; i < total; i++) {
                await writeOne(`/batch/file-${String(i + 1).padStart(3, '0')}.txt`, `Content of file ${i + 1}\nLine 2\nLine 3`);
            }
            break;
        }
        case '50-files': {
            total = 50;
            emitBatch(SGL_VFS.BATCH_STARTED, { total, preset });
            for (let i = 0; i < total; i++) {
                await writeOne(`/stress/file-${String(i + 1).padStart(3, '0')}.txt`, `File ${i + 1}: ${'x'.repeat(200)}`);
            }
            break;
        }
        case 'nested': {
            const paths = [
                '/project/src/main.js', '/project/src/utils.js',
                '/project/docs/readme.md', '/project/docs/api.md',
                '/project/tests/unit.test.js', '/project/tests/e2e.test.js',
                '/project/config/dev.json', '/project/config/prod.json',
            ];
            total = paths.length;
            emitBatch(SGL_VFS.BATCH_STARTED, { total, preset });
            for (const p of paths) {
                await writeOne(p, `// ${p}\nconsole.log("hello");`);
            }
            break;
        }
        case 'read-all': {
            try {
                const listRid = newRequestId();
                bus.dispatchEvent(new CustomEvent(SGL_VFS.LIST_REQUEST, {
                    detail: { path: '/', requestId: listRid },
                    bubbles: true, composed: true,
                }));
                const listResult = await waitForResponse(listRid, SGL_VFS.LIST_RESPONSE);
                const files = (listResult.result || []).filter(e => e.type === 'file');
                total = files.length;
                emitBatch(SGL_VFS.BATCH_STARTED, { total, preset });
                for (const f of files) {
                    try {
                        await vfsOp(SGL_VFS.READ_REQUEST, SGL_VFS.READ_RESPONSE, { path: f.path });
                    } catch { errors++; }
                    done++;
                    setProgress(done, total);
                    emitBatch(SGL_VFS.BATCH_PROGRESS, { done, total, lastOp: f.path });
                }
            } catch { errors++; }
            break;
        }
        case 'delete-all': {
            try {
                const listRid = newRequestId();
                bus.dispatchEvent(new CustomEvent(SGL_VFS.LIST_REQUEST, {
                    detail: { path: '/', requestId: listRid },
                    bubbles: true, composed: true,
                }));
                const listResult = await waitForResponse(listRid, SGL_VFS.LIST_RESPONSE);
                const files = (listResult.result || []).filter(e => e.type === 'file');
                total = files.length;
                emitBatch(SGL_VFS.BATCH_STARTED, { total, preset });
                for (const f of files) {
                    try {
                        await vfsOp(SGL_VFS.DELETE_REQUEST, SGL_VFS.DELETE_RESPONSE, { path: f.path });
                    } catch { errors++; }
                    done++;
                    setProgress(done, total);
                    emitBatch(SGL_VFS.BATCH_PROGRESS, { done, total, lastOp: f.path });
                }
            } catch { errors++; }
            break;
        }
    }

    const wallTime = Math.round(performance.now() - start);
    emitBatch(SGL_VFS.BATCH_COMPLETE, { total, errors, wallTime });
    showResult('batch-result',
        `"${preset}": ${total} ops, ${errors} errors, ${wallTime}ms`,
        errors > 0
    );
    setProgress(total, total);
}
</script>
