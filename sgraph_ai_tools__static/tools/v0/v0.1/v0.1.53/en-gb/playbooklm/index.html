<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlaybookLM — tools.sgraph.ai</title>
  <script type="module" src="https://dev.sgraph.ai/_common/js/components/sg-site-header/v1/v1.0/v1.0.6/sg-site-header.js"></script>
  <script type="module">
    import { loadManifest } from '/core/manifest-loader/v0/v0.1/v0.1.0/manifest-loader.js';
    await loadManifest('./manifest.json');
  </script>
  <style>
    /* Minimal pre-load styles — full CSS loaded by manifest-loader */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0a18; color: #e2e8f0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <sg-site-header site="Send">
        <div slot="locale" id="locale-picker"></div>
    </sg-site-header>

  <div id="conn-bar">
    <label for="api-key">OpenRouter Key</label>
    <input type="password" id="api-key" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false">
    <button id="connect-btn">Connect</button>
    <span id="conn-status"></span>
  </div>

  <div id="layout-wrap" style="flex:1;overflow:hidden;display:flex;flex-direction:column;"></div>

  <!-- Dev panel manifest tab reads from here -->
  <sg-tool-manifest src="./manifest.json"></sg-tool-manifest>
</body>
</html>
