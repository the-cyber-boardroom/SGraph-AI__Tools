<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFS Tree Demo — tools.sgraph.ai</title>
    <meta name="description" content="Live demo: sg-tree rendering a virtual file system. Write files, create folders, delete — the tree updates in real time. Full VFS event log on the right.">
    <link rel="icon" type="image/svg+xml" href="../../../_common/favicon.svg">
    <link rel="stylesheet" href="../../../_common/css/tools.css">
    <style>
        html, body {
            height: 100%; margin: 0;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        sg-site-header { flex-shrink: 0; }

        /* ── Root bus + 3-column layout ──────────────────────────────── */
        #vfs-bus {
            flex: 1; display: flex; flex-direction: row;
            min-height: 0; overflow: hidden;
        }

        .col-ops      { width: 28%; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--sg-border, #2a3a5c); overflow: hidden; }
        .col-tree     { flex: 1;   display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--sg-border, #2a3a5c); overflow: hidden; }
        .col-events   { width: 30%; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }

        /* ── Panel chrome ─────────────────────────────────────────────── */
        .panel-header {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.4rem 0.65rem;
            border-bottom: 1px solid var(--sg-border, #2a3a5c);
            background: var(--sg-bg-secondary, #16213e);
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--sg-text-muted, #8892b0); flex: 1;
        }
        .pill {
            font-size: 0.6rem; font-weight: 700; border-radius: 9999px;
            padding: 0.08rem 0.4rem; border: 1px solid;
        }
        .pill-accent { background: rgba(78,205,196,0.1); color: var(--sg-accent,#4ecdc4); border-color: rgba(78,205,196,0.3); }
        .pill-purple { background: rgba(167,139,250,0.1); color: #a78bfa; border-color: rgba(167,139,250,0.3); }

        /* ── Operations panel ─────────────────────────────────────────── */
        .ops-scroll {
            flex: 1; overflow-y: auto; padding: 0.55rem;
            display: flex; flex-direction: column; gap: 0.4rem;
        }
        .op-section {
            border: 1px solid var(--sg-border, #2a3a5c); border-radius: 6px;
            padding: 0.45rem 0.55rem;
        }
        .op-section-title {
            font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--sg-text-muted, #8892b0);
            margin-bottom: 0.35rem;
        }
        .op-row { display: flex; gap: 0.35rem; align-items: flex-start; margin-bottom: 0.28rem; flex-wrap: wrap; }
        .op-input {
            flex: 1; min-width: 5rem;
            background: var(--sg-bg-primary, #0d1b2a);
            border: 1px solid var(--sg-border, #2a3a5c); border-radius: 4px;
            color: var(--sg-text, #ccd6f6); font-size: 0.72rem;
            padding: 0.26rem 0.4rem; font-family: 'Fira Mono', monospace;
        }
        .op-input:focus { outline: none; border-color: var(--sg-accent, #4ecdc4); }
        textarea.op-input { resize: vertical; }
        .op-btn {
            padding: 0.26rem 0.6rem; border-radius: 4px;
            border: 1px solid var(--sg-accent, #4ecdc4);
            background: rgba(78,205,196,0.08);
            color: var(--sg-accent, #4ecdc4);
            font-size: 0.7rem; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .op-btn:hover { background: rgba(78,205,196,0.18); }
        .op-btn.danger { border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.07); }
        .op-btn.danger:hover { background: rgba(233,69,96,0.15); }
        .op-result {
            display: none; font-size: 0.66rem; font-family: monospace;
            color: var(--sg-text-muted, #8892b0);
            background: rgba(13,27,42,0.7); border: 1px solid var(--sg-border, #2a3a5c);
            border-radius: 4px; padding: 0.28rem 0.4rem;
            white-space: pre-wrap; word-break: break-all;
            max-height: 5rem; overflow-y: auto; margin-top: 0.18rem;
        }
        .op-result.ok    { color: #6ee7b7; border-color: rgba(110,231,183,0.3); }
        .op-result.error { color: #e94560; border-color: rgba(233,69,96,0.3); }

        /* Provider selector */
        .prov-row { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .prov-btn {
            padding: 0.22rem 0.5rem; border-radius: 4px;
            border: 1px solid var(--sg-border, #2a3a5c);
            background: transparent; color: var(--sg-text-muted, #8892b0);
            font-size: 0.67rem; font-weight: 600; cursor: pointer;
        }
        .prov-btn:hover, .prov-btn.active { border-color: var(--sg-accent,#4ecdc4); color: var(--sg-accent,#4ecdc4); background: rgba(78,205,196,0.08); }
        .prov-btn[data-prov="layered"].active   { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.08); }
        .prov-btn[data-prov="indexeddb"].active { border-color: #6ee7b7; color: #6ee7b7; background: rgba(110,231,183,0.07); }

        /* Batch presets */
        .preset-row { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .preset-btn {
            padding: 0.22rem 0.5rem; border-radius: 4px;
            border: 1px solid rgba(167,139,250,0.3); background: rgba(167,139,250,0.07);
            color: #a78bfa; font-size: 0.67rem; font-weight: 600; cursor: pointer;
        }
        .preset-btn:hover { background: rgba(167,139,250,0.16); }
        .progress-bar { height: 3px; border-radius: 2px; background: var(--sg-border,#2a3a5c); margin-top: 0.3rem; overflow: hidden; }
        .progress-fill { height: 100%; background: #a78bfa; width: 0; transition: width 0.1s; }

        /* ── Tree column ──────────────────────────────────────────────── */
        .tree-wrap {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
            overflow: hidden;
        }
        sg-tree {
            flex: 1; min-height: 0; display: block;
            --sgt-bg: var(--sg-bg-primary, #0d1b2a);
            --sgt-text: #ccd6f6;
            --sgt-text-muted: #5a6478;
            --sgt-hover-bg: rgba(78,205,196,0.05);
            --sgt-selected-bg: rgba(78,205,196,0.1);
            --sgt-selected-border: #4ecdc4;
            --sgt-badge-bg: rgba(78,205,196,0.12);
            --sgt-badge-text: #4ecdc4;
            --sgt-connector-color: rgba(42,58,92,0.8);
            --sgt-row-height: 26px;
        }

        /* ── File preview panel (bottom of tree column) ───────────────── */
        .preview-panel {
            flex-shrink: 0; max-height: 45%;
            display: flex; flex-direction: column;
            border-top: 1px solid var(--sg-border, #2a3a5c);
            overflow: hidden;
        }
        .preview-panel.hidden { display: none; }
        .preview-header {
            display: flex; align-items: center; gap: 0.4rem;
            padding: 0.35rem 0.65rem;
            border-bottom: 1px solid var(--sg-border, #2a3a5c);
            background: var(--sg-bg-secondary, #16213e);
            flex-shrink: 0;
        }
        .preview-path {
            flex: 1; font-size: 0.68rem; font-family: monospace;
            color: var(--sg-accent, #4ecdc4); word-break: break-all;
        }
        .preview-btn {
            padding: 0.2rem 0.5rem; border-radius: 4px;
            border: 1px solid var(--sg-border, #2a3a5c);
            background: transparent; color: var(--sg-text-muted, #8892b0);
            font-size: 0.62rem; cursor: pointer;
        }
        .preview-btn:hover { border-color: var(--sg-accent,#4ecdc4); color: var(--sg-accent,#4ecdc4); }
        .preview-btn.danger:hover { border-color: #e94560; color: #e94560; }
        .preview-content {
            flex: 1; overflow: auto;
            font-family: 'Fira Mono', monospace; font-size: 0.72rem;
            color: var(--sg-text, #ccd6f6);
            padding: 0.5rem 0.65rem; white-space: pre-wrap; word-break: break-all;
            background: var(--sg-bg-primary, #0d1b2a);
        }
        .preview-edit {
            flex: 1; display: none; flex-direction: column;
        }
        .preview-edit textarea {
            flex: 1; resize: none; width: 100%; box-sizing: border-box;
            background: var(--sg-bg-primary, #0d1b2a);
            border: none; border-top: 1px solid var(--sg-border, #2a3a5c);
            color: var(--sg-text, #ccd6f6);
            font-family: 'Fira Mono', monospace; font-size: 0.72rem;
            padding: 0.5rem 0.65rem;
        }
        .preview-edit textarea:focus { outline: none; }

        /* ── Empty tree state ─────────────────────────────────────────── */
        .tree-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 0.5rem;
            color: var(--sg-text-muted, #8892b0); font-size: 0.75rem;
        }
        .tree-empty-icon { font-size: 2rem; opacity: 0.3; }
        .tree-empty-hint { font-size: 0.68rem; }
    </style>
</head>
<body>

<script type="module" src="/components/site-header/v1/v1.0/v1.0.5/sg-site-header.js"></script>
<sg-site-header site="Tools" home-url="../../../" active-nav="Tools"></sg-site-header>

<div id="vfs-bus" data-vfs-bus>
    <sg-vfs-bus id="vfs-bus-el" provider="memory"></sg-vfs-bus>

    <!-- ── Left: Operations ─────────────────────────────────────── -->
    <div class="col-ops">
        <div class="panel-header">
            <span class="panel-title">Operations</span>
            <span class="pill pill-accent" id="prov-badge">memory</span>
        </div>
        <div class="ops-scroll">

            <!-- Provider -->
            <div class="op-section">
                <div class="op-section-title">Provider</div>
                <div class="prov-row">
                    <button class="prov-btn active" data-prov="memory">memory</button>
                    <button class="prov-btn" data-prov="indexeddb">indexeddb</button>

            <div class="op-section">
                <div class="op-section-title">Delete File</div>
                <div class="op-row">
                    <input class="op-input" id="delete-path" value="/notes/hello.txt" placeholder="/path">
                    <button class="op-btn danger" id="btn-delete">Delete</button>
                </div>
                <div class="op-result" id="delete-result"></div>
            </div>

            <!-- Rename -->
            <div class="op-section">
                <div class="op-section-title">Rename / Move</div>
                <div class="op-row">
                    <input class="op-input" id="rename-src" value="/notes/hello.txt" placeholder="from">
                    <input class="op-input" id="rename-dst" value="/notes/hello-2.txt" placeholder="to">

                    <button class="preset-btn danger" data-preset="clear" style="border-color:rgba(233,69,96,0.3);color:#e94560;background:rgba(233,69,96,0.05)">Clear all</button>
                </div>

                <div class="op-result" id="batch-result"></div>

            <!-- Tree controls -->
            <div class="op-section">
                <div class="op-section-title">Tree Controls</div>

        </div>
    </div>

    <!-- ── Centre: Tree + File preview ──────────────────────────── -->
    <div class="col-tree">
        <div class="panel-header">
            <span class="panel-title">File System</span>
            <span class="pill pill-purple" id="tree-count">0 items</span>
            <button class="op-btn" id="btn-refresh" style="padding:0.15rem 0.45rem;font-size:0.62rem">↺ Refresh</button>
        </div>

        <div class="tree-wrap" id="tree-wrap">
            <!-- Empty state shown until first write -->
            <div class="tree-empty" id="tree-empty">
                <div class="tree-empty-icon">🌲</div>
                <div>Virtual file system is empty</div>
                <div class="tree-empty-hint">Write a file or run a batch preset to get started</div>
            </div>
            <sg-tree id="vfs-tree" show-root="false" style="display:none"></sg-tree>
        </div>

        <!-- File content preview (shown when a file is selected) -->
        <div class="preview-panel hidden" id="preview-panel">
            <div class="preview-header">
                <span class="preview-path" id="preview-path">—</span>
                <span class="pill" id="preview-size" style="color:var(--sg-text-muted,#8892b0);border-color:var(--sg-border,#2a3a5c)"></span>
                <button class="preview-btn" id="btn-edit-toggle">Edit</button>
                <button class="preview-btn danger" id="btn-preview-delete">Delete</button>
                <button class="preview-btn" id="btn-preview-close">✕</button>
            </div>
            <div class="preview-content" id="preview-content"></div>
            <div class="preview-edit" id="preview-edit">
                <textarea id="edit-textarea" spellcheck="false"></textarea>
                <div style="display:flex;gap:0.4rem;padding:0.35rem 0.55rem;border-top:1px solid var(--sg-border,#2a3a5c);background:var(--sg-bg-secondary,#16213e);flex-shrink:0">
                    <button class="op-btn" id="btn-save">Save</button>
                    <button class="op-btn" id="btn-cancel-edit" style="border-color:var(--sg-border,#2a3a5c);color:var(--sg-text-muted,#8892b0)">Cancel</button>

            </div>
        </div>

    <!-- ── Right: Event viewer ───────────────────────────────────── -->
    <div class="col-events">
        <sg-vfs-event-viewer></sg-vfs-event-viewer>
    </div>

<script type="module">
import '/components/vfs/sg-vfs-bus/v0/v0.1/v0.1.0/sg-vfs-bus.js';
import '/components/vfs/sg-vfs-event-viewer/v0/v0.1/v0.1.0/sg-vfs-event-viewer.js';
import '/core/sg-tree/v0/v0.1/v0.1.0/sg-tree.js';
import { SGT_EVENTS }  from '/core/sg-tree/v0/v0.1/v0.1.0/sg-tree-events.js';
import { SGL_VFS }     from '/core/sg-vfs/v0/v0.1/v0.1.0/sg-vfs-events.js';
import { newRequestId } from '/core/sg-vfs/v0/v0.1/v0.1.0/sg-vfs-request-id.js';
import { IndexedDbProvider } from '/core/sg-vfs/v0/v0.1/v0.1.0/sg-vfs-provider-indexeddb.js';

// ── Refs ──────────────────────────────────────────────────────────────────────
const bus        = document.getElementById('vfs-bus');
const tree       = document.getElementById('vfs-tree');
const treeEmpty  = document.getElementById('tree-empty');
const treeCount  = document.getElementById('tree-count');
const previewPanel = document.getElementById('preview-panel');

let currentPreviewPath = null;
let editMode = false;

// ── VFS event helpers ─────────────────────────────────────────────────────────

function waitForResponse(requestId, responseEvent, timeout = 5000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Timeout')), timeout);
        const handler = (e) => {
            if (e.detail?.requestId !== requestId) return;
            clearTimeout(timer);
            bus.removeEventListener(responseEvent, handler);
            bus.removeEventListener(SGL_VFS.ERROR, errHandler);
            resolve(e.detail);
        };
        const errHandler = (e) => {
            if (e.detail?.requestId !== requestId) return;
            clearTimeout(timer);
            bus.removeEventListener(responseEvent, handler);
            bus.removeEventListener(SGL_VFS.ERROR, errHandler);
            reject(new Error(e.detail?.error || 'VFS error'));
        };
        bus.addEventListener(responseEvent, handler);
        bus.addEventListener(SGL_VFS.ERROR, errHandler);
    });
}

async function vfsOp(requestEvent, responseEvent, detail) {
    const requestId = newRequestId();
    bus.dispatchEvent(new CustomEvent(requestEvent, {
        detail: { ...detail, requestId },
        bubbles: true, composed: true,
    }));
    return waitForResponse(requestId, responseEvent);
}

function showResult(id, text, isError = false) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.className = 'op-result ' + (isError ? 'error' : 'ok');
    el.style.display = 'block';
}

// ── Build tree data from VFS (recursive walk) ─────────────────────────────────

let _itemCount = 0;

async function walkFolder(path) {
    const res = await vfsOp(SGL_VFS.LIST_REQUEST, SGL_VFS.LIST_RESPONSE, { path });
    const entries = res.result || [];
    const children = [];
    for (const entry of entries) {
        _itemCount++;
        if (entry.type === 'folder') {
            const subChildren = await walkFolder(entry.path);
            children.push({
                id:       entry.path,
                label:    entry.name,
                type:     'folder',
                children: subChildren,
            });
        } else {
            const sizeLabel = entry.size >= 1024
                ? `${(entry.size / 1024).toFixed(1)}KB`
                : `${entry.size}B`;
            children.push({
                id:    entry.path,
                label: entry.name,
                type:  'file',
                badge: sizeLabel,
                meta:  entry.path,
            });
        }
    }
    return children;
}

async function refreshTree() {
    _itemCount = 0;
    try {
        const children = await walkFolder('/');
        if (children.length === 0) {
            tree.style.display = 'none';
            treeEmpty.style.display = '';
            treeCount.textContent = '0 items';
            return;
        }
        const root = { id: '/', label: '/', type: 'folder', children };
        const prevState = tree.getLayoutState?.();
        tree.setData(root);
        if (prevState) tree.setLayoutState?.(prevState);
        tree.style.display = 'block';
        treeEmpty.style.display = 'none';
        treeCount.textContent = `${_itemCount} items`;
    } catch {
        // VFS not ready yet — ignore
    }
}

// Refresh after any structural change
const REFRESH_ON = [
    SGL_VFS.WRITE_RESPONSE,
    SGL_VFS.DELETE_RESPONSE,
    SGL_VFS.CREATE_FOLDER_RESPONSE,
    SGL_VFS.RENAME_RESPONSE,
    SGL_VFS.COPY_RESPONSE,
    SGL_VFS.PROVIDER_READY,
];
REFRESH_ON.forEach(evt => bus.addEventListener(evt, () => refreshTree()));

// ── Tree events ───────────────────────────────────────────────────────────────

tree.addEventListener(SGT_EVENTS.NODE_ACTIVATED, async (e) => {
    const { node } = e.detail;
    if (node.type !== 'file') return;
    await loadPreview(node.id);
});

tree.addEventListener(SGT_EVENTS.NODE_SELECTED, async (e) => {
    const { node } = e.detail;
    if (node.type !== 'file') return;
    await loadPreview(node.id);
});

async function loadPreview(path) {
    currentPreviewPath = path;
    document.getElementById('preview-path').textContent = path;
    document.getElementById('preview-content').textContent = 'Loading…';
    previewPanel.classList.remove('hidden');
    setEditMode(false);

    try {
        const [readRes, statRes] = await Promise.all([
            vfsOp(SGL_VFS.READ_REQUEST, SGL_VFS.READ_RESPONSE, { path }),
            vfsOp(SGL_VFS.STAT_REQUEST, SGL_VFS.STAT_RESPONSE, { path }),
        ]);
        document.getElementById('preview-content').textContent = readRes.result ?? '';
        const stat = statRes.result;
        const sizeLabel = stat.size >= 1024 ? `${(stat.size/1024).toFixed(1)}KB` : `${stat.size}B`;
        document.getElementById('preview-size').textContent = sizeLabel;
        // Pre-fill delete path input
        document.getElementById('delete-path').value = path;
    } catch (err) {
        document.getElementById('preview-content').textContent = `Error: ${err.message}`;
    }
}

function setEditMode(on) {
    editMode = on;
    document.getElementById('preview-content').style.display = on ? 'none' : '';
    const editEl = document.getElementById('preview-edit');
    editEl.style.display = on ? 'flex' : 'none';
    document.getElementById('btn-edit-toggle').textContent = on ? 'View' : 'Edit';
    if (on) {
        document.getElementById('edit-textarea').value =
            document.getElementById('preview-content').textContent;
        document.getElementById('edit-textarea').focus();
    }
}

document.getElementById('btn-edit-toggle').addEventListener('click', () => {
    setEditMode(!editMode);
});

document.getElementById('btn-cancel-edit').addEventListener('click', () => setEditMode(false));

document.getElementById('btn-save').addEventListener('click', async () => {
    if (!currentPreviewPath) return;
    const content = document.getElementById('edit-textarea').value;
    try {
        await vfsOp(SGL_VFS.WRITE_REQUEST, SGL_VFS.WRITE_RESPONSE, { path: currentPreviewPath, content });
        document.getElementById('preview-content').textContent = content;
        setEditMode(false);
    } catch (err) {
        alert(`Save failed: ${err.message}`);
    }
});

document.getElementById('btn-preview-delete').addEventListener('click', async () => {
    if (!currentPreviewPath) return;
    if (!confirm(`Delete ${currentPreviewPath}?`)) return;
    try {
        await vfsOp(SGL_VFS.DELETE_REQUEST, SGL_VFS.DELETE_RESPONSE, { path: currentPreviewPath });
        previewPanel.classList.add('hidden');
        currentPreviewPath = null;
    } catch (err) {
        alert(`Delete failed: ${err.message}`);
    }
});

document.getElementById('btn-preview-close').addEventListener('click', () => {
    previewPanel.classList.add('hidden');
    currentPreviewPath = null;
});

// ── Operation buttons ─────────────────────────────────────────────────────────

document.getElementById('btn-write').addEventListener('click', async () => {
    const path    = document.getElementById('write-path').value.trim();
    const content = document.getElementById('write-content').value;
    try {
        await vfsOp(SGL_VFS.WRITE_REQUEST, SGL_VFS.WRITE_RESPONSE, { path, content });
        showResult('write-result', `✓ Written: ${path}`);
    } catch (err) { showResult('write-result', err.message, true); }
});

document.getElementById('btn-mkdir').addEventListener('click', async () => {
    const path = document.getElementById('mkdir-path').value.trim();
    try {
        await vfsOp(SGL_VFS.CREATE_FOLDER_REQUEST, SGL_VFS.CREATE_FOLDER_RESPONSE, { path });
        showResult('mkdir-result', `✓ Created: ${path}`);
    } catch (err) { showResult('mkdir-result', err.message, true); }
});

document.getElementById('btn-delete').addEventListener('click', async () => {
    const path = document.getElementById('delete-path').value.trim();
    try {
        await vfsOp(SGL_VFS.DELETE_REQUEST, SGL_VFS.DELETE_RESPONSE, { path });
        showResult('delete-result', `✓ Deleted: ${path}`);
        if (currentPreviewPath === path) {
            previewPanel.classList.add('hidden');
            currentPreviewPath = null;
        }
    } catch (err) { showResult('delete-result', err.message, true); }
});

document.getElementById('btn-rename').addEventListener('click', async () => {
    const src = document.getElementById('rename-src').value.trim();
    const dst = document.getElementById('rename-dst').value.trim();
    try {
        await vfsOp(SGL_VFS.RENAME_REQUEST, SGL_VFS.RENAME_RESPONSE, { path: src, src, dst });
        showResult('rename-result', `✓ ${src} → ${dst}`);
    } catch (err) { showResult('rename-result', err.message, true); }
});

document.getElementById('btn-refresh').addEventListener('click', refreshTree);

// ── Tree controls ─────────────────────────────────────────────────────────────

document.getElementById('btn-expand-all').addEventListener('click',   () => tree.expandAll?.());
document.getElementById('btn-collapse-all').addEventListener('click', () => tree.collapseAll?.());

const filterInput = document.getElementById('filter-input');
filterInput.addEventListener('input', () => {
    const q = filterInput.value.trim().toLowerCase();
    tree.filter?.(q ? (node => node.label.toLowerCase().includes(q)) : null);
});
document.getElementById('btn-filter-clear').addEventListener('click', () => {
    filterInput.value = '';
    tree.filter?.(null);
});

// ── Provider switching ────────────────────────────────────────────────────────

let busEl = document.getElementById('vfs-bus-el');
document.querySelectorAll('.prov-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.prov-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const prov = btn.dataset.prov;
        document.getElementById('prov-badge').textContent = prov;

        const newBus = document.createElement('sg-vfs-bus');
        newBus.id = 'vfs-bus-el';
        newBus.setAttribute('provider', prov);
        busEl.replaceWith(newBus);
        busEl = newBus;
    });
});

// ── Batch presets ─────────────────────────────────────────────────────────────

document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => runPreset(btn.dataset.preset));
});

async function writeOne(path, content) {
    await vfsOp(SGL_VFS.WRITE_REQUEST, SGL_VFS.WRITE_RESPONSE, { path, content }).catch(() => {});
}

async function runPreset(preset) {
    const fill = document.getElementById('batch-progress');
    const resultEl = document.getElementById('batch-result');
    const batchId = newRequestId();
    let files = [];

    if (preset === 'project') {
        files = [
            ['/project/src/main.js',           '// Entry point\nconsole.log("hello world");'],
            ['/project/src/utils.js',           '// Utilities\nexport function clamp(n,a,b){return Math.min(Math.max(n,a),b);}'],
            ['/project/src/components/button.js','// Button component\nexport class Button extends HTMLElement{}'],
            ['/project/src/components/modal.js', '// Modal component\nexport class Modal extends HTMLElement{}'],
            ['/project/docs/readme.md',          '# My Project\nA demo project in the VFS.'],
            ['/project/docs/api.md',             '# API Reference\n## Functions\n### clamp(n, a, b)'],
            ['/project/tests/main.test.js',      '// Tests\nimport { clamp } from "../src/utils.js";'],
            ['/project/config/dev.json',         '{"env":"development","debug":true}'],
            ['/project/config/prod.json',        '{"env":"production","debug":false}'],
            ['/project/.gitignore',              'node_modules/\ndist/\n.env'],
        ];
    } else if (preset === 'docs') {
        files = [
            ['/docs/getting-started.md', '# Getting Started\nWelcome to the docs.'],
            ['/docs/installation.md',    '# Installation\n```\nnpm install\n```'],
            ['/docs/configuration.md',   '# Configuration\nEdit config.json to customise.'],
            ['/docs/api/overview.md',    '# API Overview\nThe API is REST-based.'],
            ['/docs/api/endpoints.md',   '# Endpoints\n- GET /health\n- POST /data'],
            ['/docs/examples/basic.md',  '# Basic Example\nHello world use case.'],
        ];
    } else if (preset === 'deep') {
        files = [];
        for (let d1 = 0; d1 < 3; d1++) {
            for (let d2 = 0; d2 < 3; d2++) {
                for (let d3 = 0; d3 < 3; d3++) {
                    files.push([
                        `/tree/level-${d1}/sub-${d2}/file-${d3}.txt`,
                        `Depth ${d1}/${d2}/${d3}\nContent: ${Math.random().toFixed(6)}`,
                    ]);
                }
            }
        }
    } else if (preset === 'clear') {
        // List root and delete all files one by one
        try {
            const listRes = await vfsOp(SGL_VFS.LIST_REQUEST, SGL_VFS.LIST_RESPONSE, { path: '/' });
            const items = listRes.result || [];
            for (const item of items) {
                if (item.type === 'file') {
                    await vfsOp(SGL_VFS.DELETE_REQUEST, SGL_VFS.DELETE_RESPONSE, { path: item.path }).catch(() => {});
                }
            }
            // Refresh manually to clear tree
            await refreshTree();
            showResult('batch-result', `Cleared root-level files.`);
        } catch (err) { showResult('batch-result', err.message, true); }
        return;
    }

    const total = files.length;
    bus.dispatchEvent(new CustomEvent(SGL_VFS.BATCH_STARTED, { detail: { batchId, total, preset }, bubbles: true, composed: true }));
    for (let i = 0; i < files.length; i++) {
        await writeOne(files[i][0], files[i][1]);
        fill.style.width = `${Math.round(((i + 1) / total) * 100)}%`;
        bus.dispatchEvent(new CustomEvent(SGL_VFS.BATCH_PROGRESS, { detail: { batchId, done: i+1, total, lastOp: files[i][0] }, bubbles: true, composed: true }));
    }
    bus.dispatchEvent(new CustomEvent(SGL_VFS.BATCH_COMPLETE, { detail: { batchId, total, errors: 0 }, bubbles: true, composed: true }));
    showResult('batch-result', `✓ "${preset}": ${total} files written`);
    fill.style.width = '100%';
}
</script>
