<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Dev Environment — tools.sgraph.ai</title>
    <meta name="description" content="Full one-shot LLM development environment. Build realities, attach files, inspect requests, track costs, and time-travel through bundle history.">
    <link rel="icon" type="image/svg+xml" href="../../_common/favicon.svg">
    <link rel="stylesheet" href="../../_common/css/tools.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        sg-site-header {
            flex-shrink: 0;
        }

        /* ── Event bus + layout container ─────────────────────────────── */
        #bus {
            flex: 1;
            display: grid;
            grid-template-columns: 32% 1fr 22%;
            grid-template-rows: auto 1fr auto auto;
            grid-template-areas:
                "connection  output   bundles"
                "reality     output   bundles"
                "attachments stats    bundles"
                "attachments debug    bundles";
            gap: 1px;
            background: #1a1a2e;
            min-height: 0;
            overflow: hidden;
        }

        /* ── Panel base ────────────────────────────────────────────────── */
        #bus > * {
            background: #0d0d1a;
            overflow: hidden;
            min-height: 0;
        }

        /* ── Grid area assignments ─────────────────────────────────────── */
        sg-llm-request,
        sg-llm-bundle     { display: none !important; }

        sg-llm-connection  { grid-area: connection; overflow: auto; max-height: 160px; }
        sg-llm-reality     { grid-area: reality; overflow: hidden; }
        sg-llm-attachments { grid-area: attachments; overflow: hidden; max-height: 140px; }
        sg-llm-output      { grid-area: output; overflow: hidden; }
        sg-llm-stats       { grid-area: stats; overflow: auto; max-height: 130px; }
        sg-llm-debug       { grid-area: debug; overflow: hidden; max-height: 220px; }
        sg-llm-bundle-list { grid-area: bundles; overflow: hidden; }
    </style>
</head>
<body>

<script type="module" src="https://dev.sgraph.ai/_common/js/components/sg-site-header/v1/v1.0/v1.0.5/sg-site-header.js"></script>
<sg-site-header site="Tools" home-url="../../" active-nav="Tools"></sg-site-header>

<!-- ── Event bus: all sg-llm-* are direct children so they share this as parentElement ── -->
<div id="bus">

    <!-- Headless orchestrators -->
    <sg-llm-request></sg-llm-request>
    <sg-llm-bundle auto-save></sg-llm-bundle>

    <!-- Left column: provider settings -->
    <sg-llm-connection></sg-llm-connection>

    <!-- Left column: reality constructor -->
    <sg-llm-reality></sg-llm-reality>

    <!-- Left column: file attachments -->
    <sg-llm-attachments></sg-llm-attachments>

    <!-- Centre: streaming response output -->
    <sg-llm-output></sg-llm-output>

    <!-- Centre bottom: token/cost metrics + streaming toggle -->
    <sg-llm-stats></sg-llm-stats>

    <!-- Centre bottom: full request inspector -->
    <sg-llm-debug></sg-llm-debug>

    <!-- Right: bundle history (full-height, time-travel) -->
    <sg-llm-bundle-list show-save-button></sg-llm-bundle-list>

</div>

<script type="module">
// Import all sg-llm components — custom elements self-register on import
import '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import '/components/llm/sg-llm-request/v0/v0.1/v0.1.0/sg-llm-request.js';
import '/components/llm/sg-llm-bundle/v0/v0.1/v0.1.0/sg-llm-bundle.js';
import '/components/llm/sg-llm-connection/v0/v0.1/v0.1.0/sg-llm-connection.js';
import '/components/llm/sg-llm-reality/v0/v0.1/v0.1.0/sg-llm-reality.js';
import '/components/llm/sg-llm-attachments/v0/v0.1/v0.1.0/sg-llm-attachments.js';
import '/components/llm/sg-llm-output/v0/v0.1/v0.1.0/sg-llm-output.js';
import '/components/llm/sg-llm-stats/v0/v0.1/v0.1.0/sg-llm-stats.js';
import '/components/llm/sg-llm-debug/v0/v0.1/v0.1.0/sg-llm-debug.js';
import '/components/llm/sg-llm-bundle-list/v0/v0.1/v0.1.0/sg-llm-bundle-list.js';
</script>

</body>
</html>
