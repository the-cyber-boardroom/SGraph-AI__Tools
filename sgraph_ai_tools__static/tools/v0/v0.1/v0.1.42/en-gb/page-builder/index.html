<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG/Send Theme Explorer — tools.sgraph.ai</title>
    <meta name="description" content="Build and preview _page.json layouts with live theme switching. Drop your JSON, pick a theme, preview at any viewport, then copy back into a vault.">
    <link rel="icon" type="image/svg+xml" href="../../../_common/favicon.svg">

    <!-- Base tool styles -->
    <link rel="stylesheet" href="../../../_common/css/tools.css">
    <link rel="stylesheet" href="/core/sg-layout/v0.1.0/sg-layout.css">

    <!-- Tool chrome styles -->
    <link rel="stylesheet" href="./page-builder.css">

    <!-- Page layout renderer CSS from SG/Send CDN -->
    <link rel="stylesheet" href="https://dev.send.sgraph.ai/_common/js/components/send-download/send-browse-v031--page-layout.css" crossorigin>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #070b14;
            color: #c8d0e0;
        }
        sg-site-header { flex-shrink: 0; }
        #layout-wrap   { flex: 1; min-height: 0; }
    </style>
</head>
<body>

<script type="module" src="/components/site-header/v1/v1.0/v1.0.3/sg-site-header.js"></script>
<sg-site-header site="Tools" home-url="../../../"></sg-site-header>

<div id="layout-wrap"></div>

<!-- PageLayoutRenderer loaded as a regular (non-module) script so it is
     available as a global by the time the deferred module below runs. -->
<script src="https://dev.send.sgraph.ai/_common/js/page-layout-renderer.js" crossorigin></script>

<script type="module" src="./page-builder.js"></script>

</body>
</html>
