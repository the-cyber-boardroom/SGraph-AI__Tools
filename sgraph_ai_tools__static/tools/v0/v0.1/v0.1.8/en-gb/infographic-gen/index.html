<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic Generator — tools.sgraph.ai</title>
    <meta name="description" content="Turn text into SVG infographics with nano LLM models via OpenRouter. Build your prompt, choose a style, export the result.">
    <link rel="icon" type="image/svg+xml" href="../../_common/favicon.svg">
    <link rel="stylesheet" href="../../_common/css/tools.css">
    <link rel="stylesheet" href="/core/sg-layout/v0.1.0/sg-layout.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        sg-site-header { flex-shrink: 0; }

        /* ── Connection bar ────────────────────────────────────────────────── */
        #conn-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 14px;
            background: #0d0d1a;
            border-bottom: 1px solid #1a1a3a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            flex-wrap: wrap;
        }
        #conn-bar label {
            font-size: 11px; font-weight: 600; color: #a0aec0;
            text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
        }
        #conn-bar input[type="password"] {
            flex: 1; min-width: 140px; max-width: 280px;
            background: #111122; border: 1px solid #333d5a; border-radius: 4px;
            color: #e2e8f0; padding: 5px 10px; font-size: 13px; outline: none;
        }
        #conn-bar input:focus { border-color: #4ECDC4; }
        #conn-bar sg-llm-model-picker { flex: 1; min-width: 180px; max-width: 360px; }
        #connect-btn {
            background: #4ECDC4; color: #0d0d1a; border: none; border-radius: 4px;
            padding: 5px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
            white-space: nowrap;
        }
        #connect-btn:hover { opacity: 0.85; }
        #connect-btn:disabled { opacity: 0.5; cursor: default; }
        #conn-status { font-size: 12px; white-space: nowrap; }
        #conn-status.ok    { color: #4ECDC4; }
        #conn-status.error { color: #ff6b6b; }

        /* ── sg-layout wrapper ─────────────────────────────────────────────── */
        #layout-wrap {
            flex: 1;
            min-height: 0;
        }
        #layout-wrap sg-layout { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

<script type="module" src="/components/site-header/v1/v1.0/v1.0.2/sg-site-header.js"></script>
<sg-site-header site="Tools" home-url="../../"></sg-site-header>

<!-- ── Connection bar ── -->
<div id="conn-bar">
    <label>OpenRouter Key</label>
    <input type="password" id="api-key" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false">
    <label>Model</label>
    <sg-llm-model-picker id="model-picker" provider="openrouter"></sg-llm-model-picker>
    <button id="connect-btn">Connect</button>
    <span id="conn-status"></span>
</div>

<!-- ── sg-layout content area ── -->
<div id="layout-wrap"></div>

<script type="module">
import { SgLayout }   from '/core/sg-layout/v0.1.0/sg-layout.js';
import { SGL_EVENTS } from '/core/sg-layout/v0.1.0/sg-layout-events.js';

import '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';
import '/components/llm/sg-llm-request/v0/v0.1/v0.1.0/sg-llm-request.js';
import '/components/llm/sg-llm-bundle/v0/v0.1/v0.1.0/sg-llm-bundle.js';
import '/components/llm/sg-llm-reality/v0/v0.1/v0.1.0/sg-llm-reality.js';
import '/components/llm/sg-llm-stats/v0/v0.1/v0.1.0/sg-llm-stats.js';
import '/components/llm/sg-llm-infographic/v0/v0.1/v0.1.0/sg-llm-infographic.js';
import '/components/llm/sg-llm-model-picker/v0/v0.1/v0.1.0/sg-llm-model-picker.js';

import { SGL_LLM } from '/components/llm/sg-llm-events/v0/v0.1/v0.1.0/sg-llm-events.js';

// ── Constants ────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'sg-infographic-gen-v1';

// Curated models known to follow "output ONLY raw SVG" instructions reliably.
// Updated to use correct OpenRouter model slugs (avoids 404 "No endpoints found").
const NANO_MODELS = [
    'google/gemini-2.0-flash-001',
    'google/gemini-2.5-flash-preview',
    'qwen/qwen-2.5-72b-instruct',
    'qwen/qwen-2.5-7b-instruct',
    'meta-llama/llama-3.3-70b-instruct',
    'meta-llama/llama-3.1-8b-instruct:free',
    'mistralai/mistral-small-3.1-24b-instruct',
    'deepseek/deepseek-chat-v3-0324',
    'anthropic/claude-haiku-4-5-20251001',
];

// Default reality blocks — serverless architecture infographic example
function makeDefaultBlocks() {
    return makeExampleBlocks('serverless');
}

// ── Example presets ───────────────────────────────────────────────────────────

const EXAMPLES = [
    {
        id: 'shapes',
        label: 'Simple shapes',
        complexity: 1,
        context: null,
        question: 'Create a colourful geometric composition: large teal circle on the left, overlapping orange rectangle in the centre, small purple triangle on the right. Add a bold title "Geometry" at the top. White background, clean minimal style.',
    },
    {
        id: 'barchart',
        label: 'Bar chart',
        complexity: 2,
        context: `Monthly ARR for a SaaS startup (USD):
Jan: $12,000 | Feb: $18,500 | Mar: $25,200 | Apr: $31,000
May: $28,400 | Jun: $42,800 | Jul: $51,300 | Aug: $63,000`,
        question: 'Create a bar chart visualising this monthly ARR data. Use teal bars on a dark background. Label each bar with its value. Add a title "Monthly ARR Growth" and a subtle upward-trend annotation.',
    },
    {
        id: 'piechart',
        label: 'Pie chart',
        complexity: 2,
        context: `Cloud provider market share 2024:
AWS: 32% | Azure: 23% | Google Cloud: 12% | Alibaba: 4% | Others: 29%`,
        question: 'Create a pie chart of cloud provider market share. Use distinct colours for each slice. Add percentage labels and a legend. Title: "Cloud Market Share 2024".',
    },
    {
        id: 'flowchart',
        label: 'Flow / pipeline',
        complexity: 3,
        context: null,
        question: 'Create a CI/CD pipeline flowchart with these stages: Code Commit → Lint & Format → Unit Tests → Build & Package → Integration Tests → Deploy to Staging → Smoke Tests → Deploy to Production → Monitor. Use green for passing stages, amber for warnings, connect with arrows. Dark background.',
    },
    {
        id: 'timeline',
        label: 'Timeline',
        complexity: 3,
        context: `AI milestones:
2017: Transformer paper ("Attention is All You Need")
2018: BERT, GPT-1
2019: GPT-2
2020: GPT-3 (175B params)
2022: ChatGPT launch, Stable Diffusion
2023: GPT-4, Claude, Llama
2024: Gemini, Claude 3, Llama 3
2025: Reasoning models (o3, R1), multimodal agents`,
        question: 'Create a horizontal timeline of these AI milestones. Use a dark background with a glowing teal timeline line. Each milestone as a labelled node above/below the line alternating. Title: "The AI Revolution 2017–2025".',
    },
    {
        id: 'comparison',
        label: 'Comparison table',
        complexity: 3,
        context: `API protocol comparison:
REST: Simple, stateless, wide support, cacheable, verbose JSON
GraphQL: Flexible queries, single endpoint, over/under-fetch solved, complex setup
gRPC: Binary protocol, very fast, streaming, strong types, harder to debug
WebSocket: Real-time, bidirectional, persistent connection, stateful`,
        question: 'Create a visual comparison table of REST vs GraphQL vs gRPC vs WebSocket across: Performance, Flexibility, Type Safety, Real-time Support, Ease of Use, Best For. Use colour-coded ratings (green/amber/red dots or bars). Dark background, clear column headers.',
    },
    {
        id: 'serverless',
        label: 'Architecture',
        complexity: 4,
        context:
`AWS Serverless Application — component list and data flow:

Ingress:
  • CloudFront — CDN, caches static assets and API responses at the edge
  • API Gateway — REST + WebSocket endpoints, request throttling, auth integration

Compute:
  • Lambda (Node.js / Python) — stateless functions triggered by API Gateway, EventBridge, SQS

Data:
  • DynamoDB — primary NoSQL store, on-demand capacity, single-digit ms latency
  • S3 — object storage for uploads, bundles, static site assets
  • ElastiCache (optional) — Redis cache layer for hot data

Auth:
  • Cognito — user pools + identity pools, JWT tokens validated at API Gateway

Async / Events:
  • EventBridge — event bus routing between services and third-party webhooks
  • SQS — FIFO and standard queues for decoupled async processing
  • SNS — fan-out notifications to multiple subscribers

Observability:
  • CloudWatch — logs, metrics, alarms, dashboards
  • X-Ray — distributed tracing across Lambda + API Gateway

Key data flows:
  1. Browser → CloudFront → API Gateway → Lambda → DynamoDB / S3
  2. Lambda → EventBridge → SQS → Lambda  (async event-driven processing)
  3. Cognito JWT → API Gateway authoriser → Lambda
  4. Lambda → SNS → email / SMS / other Lambdas

Serverless benefits: zero infrastructure management, auto-scaling to millions of requests,
pay-per-execution pricing, built-in HA across 3 AZs.`,
        question: 'Create an infographic that visualises this AWS serverless architecture. Show all components, their connections, and the main data flows. Use clear labels and visual groupings for each layer (Ingress, Compute, Data, Auth, Async, Observability). Highlight the key serverless benefits.',
    },
    {
        id: 'agentic',
        label: 'Rich infographic',
        complexity: 5,
        context:
`The Agentic AI Revolution — key themes for a business infographic:

Market shift:
  • Agentic GenAI will create more custom applications than ever before
  • Niche expertise can now scale from boutique to thousands of organisations
  • Security tools become high-value targets, making secure-by-design critical

The three maturity stages (Wardley Map):
  • Explorer (Large Models): Discovery, prototyping, rapid innovation
  • Villager (Constrained Models): Maturing practices, increasing reliability
  • Town Planner (Minimal/No Model): Well-engineered, tested, refined to essentials

Case study — SG/Send:
  • Built with 20+ agents
  • Delivers REST APIs, CLIs, and 17 locales
  • Demonstrates the agentic blueprint in production

Opportunity:
  • Every OWASP Top 10 domain is now a viable foundation for a standalone startup
  • 10+ new startup niches opening up`,
        question: `Create a rich, professional business infographic titled "The Agentic AI Revolution".

Layout: two-column. Left column: "The Market Shift" section with 3 key points each having an icon placeholder (use SVG shapes/symbols — no raster images). Right column: "The Agentic Blueprint" showing the 3 Wardley maturity stages as a progression diagram. Bottom strip: case study box + opportunity stats.

Style: white background, bold dark headings, accent colour #4ECDC4 (teal), colourful icon backgrounds using circles with SVG symbols (gears, shield, rocket, brain, building). Use rounded rectangles for callout boxes. Make it visually rich with subtle gradient fills on section backgrounds.`,
    },
];

function makeExampleBlocks(exampleId) {
    const ex = EXAMPLES.find(e => e.id === exampleId) || EXAMPLES.find(e => e.id === 'serverless');
    const ts = Date.now();
    const blocks = [
        { id: `block-${ts}-sys`, type: 'system', enabled: true, content: '' },
    ];
    if (ex.context) {
        blocks.push({ id: `block-${ts}-ctx`, type: 'context', enabled: true,
                      label: ex.label, content: ex.context });
    }
    blocks.push({ id: `block-${ts}-q`, type: 'question', enabled: true,
                  content: ex.question, _imageCount: 0 });
    return blocks;
}

// ── DOM refs ─────────────────────────────────────────────────────────────────

const apiKeyEl    = document.getElementById('api-key');
const modelPicker = document.getElementById('model-picker');
const connectBtn  = document.getElementById('connect-btn');
const statusEl    = document.getElementById('conn-status');
const layoutWrap  = document.getElementById('layout-wrap');

// ── localStorage helpers ──────────────────────────────────────────────────────

function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
}
function savePrefs(patch) {
    const cur = loadPrefs();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...cur, ...patch }));
}

// ── Restore persisted values ──────────────────────────────────────────────────

const prefs = loadPrefs();
if (prefs.apiKey) apiKeyEl.value = prefs.apiKey;

// ── Model picker — seed with nano shortlist ───────────────────────────────────

await customElements.whenDefined('sg-llm-model-picker');

(function seedPicker() {
    const shadow = modelPicker.shadowRoot;
    if (!shadow) return;
    const sel = shadow.querySelector('select');
    if (!sel) return;
    sel.innerHTML = NANO_MODELS.map(m => `<option value="${m}">${m}</option>`).join('');
    const refreshBtn = shadow.querySelector('#refresh-btn');
    if (refreshBtn) refreshBtn.style.display = 'none';
})();

// Restore saved model selection
if (prefs.model && NANO_MODELS.includes(prefs.model)) {
    modelPicker.setModel(prefs.model);
}

// ── Build sg-layout ──────────────────────────────────────────────────────────

const layout = document.createElement('sg-layout');
layoutWrap.appendChild(layout);

// Register LAYOUT_READY listener BEFORE setLayout() to avoid race condition
const layoutReady = new Promise(resolve => layout.events.on(SGL_EVENTS.LAYOUT_READY, resolve));

layout.setLayout({
    type: 'row', id: 'root', sizes: [0.36, 0.64],
    children: [
        {
            type: 'stack', id: 's-left', activeTab: 0,
            tabs: [{ type: 'tab', id: 't-builder', title: 'Prompt Builder',
                     tag: 'div', state: {}, locked: true, closable: false }],
        },
        {
            type: 'stack', id: 's-right', activeTab: 0,
            tabs: [{ type: 'tab', id: 't-infographic', title: 'Infographic',
                     tag: 'div', state: {}, locked: true, closable: false }],
        },
    ],
});

await layoutReady;

const leftPanel  = layout.getPanelElement('t-builder');
const rightPanel = layout.getPanelElement('t-infographic');

// ── Mount sg-llm components ───────────────────────────────────────────────────
// Inline styles required — CSS rules in <style> don't cross sg-layout's Shadow DOM.

// Left panel: shared event bus (all non-infographic sg-llm components)
const bus = document.createElement('div');
bus.style.cssText = 'display:flex; flex-direction:column; height:100%; overflow:hidden; background:#0d0d1a;';
leftPanel.style.cssText = 'overflow:hidden; height:100%; display:block;';
leftPanel.appendChild(bus);

// ── Examples bar ─────────────────────────────────────────────────────────────
// Must use inline styles — inside sg-layout shadow boundary.

const exBar = document.createElement('div');
exBar.style.cssText = [
    'display:flex', 'align-items:center', 'gap:6px', 'flex-shrink:0',
    'padding:6px 10px', 'background:#0a0a18', 'border-bottom:1px solid #1a1a3a',
    'overflow-x:auto', 'scrollbar-width:thin',
].join(';');

const exLabel = document.createElement('span');
exLabel.textContent = 'Examples:';
exLabel.style.cssText = 'font-size:11px;font-weight:600;color:#a0aec0;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;font-family:system-ui,sans-serif;';
exBar.appendChild(exLabel);

// Complexity dot colours
const COMPLEXITY_COLOUR = ['', '#4ECDC4', '#4ECDC4', '#f6c90e', '#f6c90e', '#ff6b6b'];

EXAMPLES.forEach(ex => {
    const btn = document.createElement('button');
    const dot = COMPLEXITY_COLOUR[ex.complexity] || '#a0aec0';
    btn.style.cssText = [
        'background:#1a1a3a', 'border:1px solid #333d5a', 'border-radius:4px',
        'color:#e2e8f0', 'padding:3px 9px', 'font-size:12px', 'cursor:pointer',
        'white-space:nowrap', 'font-family:system-ui,sans-serif',
        'display:flex', 'align-items:center', 'gap:5px',
    ].join(';');
    btn.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${dot};display:inline-block;flex-shrink:0"></span>${ex.label}`;
    btn.title = `Complexity ${ex.complexity}/5`;
    btn.addEventListener('click', () => {
        reality.setState?.({ blocks: makeExampleBlocks(ex.id) });
        injectSystemPrompt();
    });
    exBar.appendChild(btn);
});

bus.appendChild(exBar);

const request = document.createElement('sg-llm-request');
request.style.display = 'none';
const bundle = document.createElement('sg-llm-bundle');
bundle.setAttribute('auto-save', '');
bundle.style.display = 'none';
const reality = document.createElement('sg-llm-reality');
reality.style.cssText = 'flex:1; min-height:0; overflow:hidden; display:block;';
const stats = document.createElement('sg-llm-stats');
stats.style.cssText = 'flex-shrink:0; overflow:auto; max-height:140px; display:block;';
[request, bundle, reality, stats].forEach(el => bus.appendChild(el));

// Right panel: infographic (separate parentElement — bridged below)
const infographicWrap = document.createElement('div');
infographicWrap.style.cssText = 'height:100%; overflow:hidden; background:#0d0d1a; display:block;';
rightPanel.style.cssText = 'overflow:hidden; height:100%; display:block;';
rightPanel.appendChild(infographicWrap);

const infographic = document.createElement('sg-llm-infographic');
infographic.setAttribute('style-preset', 'executive');
infographic.setAttribute('orientation', 'landscape');
infographic.style.cssText = 'height:100%; display:block;';
infographicWrap.appendChild(infographic);

// ── Event bridge: bus → infographic ──────────────────────────────────────────
// sg-llm-infographic listens on its parentElement (infographicWrap).
// sg-llm-request fires events on its parentElement (#bus).
// Bridge forwards the request lifecycle events across the two scopes.

const BRIDGE_EVENTS = [
    SGL_LLM.REQUEST_START, SGL_LLM.REQUEST_CHUNK,
    SGL_LLM.REQUEST_COMPLETE, SGL_LLM.REQUEST_ERROR, SGL_LLM.REQUEST_CANCEL,
];
for (const evtName of BRIDGE_EVENTS) {
    bus.addEventListener(evtName, e => {
        infographicWrap.dispatchEvent(
            new CustomEvent(evtName, { detail: e.detail, bubbles: false })
        );
    });
}

// ── Connect handler ───────────────────────────────────────────────────────────

connectBtn.addEventListener('click', async () => {
    const apiKey = apiKeyEl.value.trim();
    const model  = modelPicker.getModel();
    if (!apiKey) { setStatus('OpenRouter key required', 'error'); return; }

    setStatus('Connecting…', '');
    connectBtn.disabled = true;

    try {
        const res = await fetch('https://openrouter.ai/api/v1/models', {
            headers: { Authorization: `Bearer ${apiKey}` },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        // Persist credentials
        savePrefs({ apiKey, model });

        setStatus(`Connected ✓  (${model})`, 'ok');

        // Notify the bus (sg-llm-request + sg-llm-stats + sg-llm-reality receive this)
        bus.dispatchEvent(new CustomEvent(SGL_LLM.CONNECTED, {
            detail: { provider: 'openrouter', model, apiKey, baseUrl: '' },
            bubbles: true,
        }));
    } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
    }
    connectBtn.disabled = false;
});

// Save model choice whenever the picker changes
modelPicker.shadowRoot?.querySelector('select')?.addEventListener('change', () => {
    savePrefs({ model: modelPicker.getModel() });
});

function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = type;
}

// ── Inject infographic system prompt into reality ─────────────────────────────

await customElements.whenDefined('sg-llm-infographic');
await customElements.whenDefined('sg-llm-reality');

function injectSystemPrompt() {
    const prompt = infographic.getSystemPrompt?.();
    if (!prompt) return;
    const state = reality.getState?.();
    if (!state) return;
    const sysBlock = state.blocks?.find(b => b.type === 'system');
    if (sysBlock) {
        sysBlock.content = prompt;
        reality.setState?.({ blocks: state.blocks });
    }
}

// ── Pre-populate reality with default blocks ──────────────────────────────────

// Allow the reality component one tick to render, then set state
await new Promise(r => setTimeout(r, 0));

reality.setState?.({ blocks: makeDefaultBlocks() });

// Inject style-specific system prompt into the system block
injectSystemPrompt();

// Re-inject when infographic style changes
const styleSelect = infographic.shadowRoot?.querySelector('.inf-style-select');
if (styleSelect) styleSelect.addEventListener('change', injectSystemPrompt);
</script>

</body>
</html>
