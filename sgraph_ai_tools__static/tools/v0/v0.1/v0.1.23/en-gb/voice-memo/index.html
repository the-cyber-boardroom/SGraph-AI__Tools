// ── VFS helpers ───────────────────────────────────────────────────────────────
function waitForResponse(requestId, responseEvent, timeout = 8000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Timeout')), timeout);
        const ok  = (e) => { if (e.detail?.requestId !== requestId) return; done(); resolve(e.detail); };
        const err = (e) => { if (e.detail?.requestId !== requestId) return; done(); reject(new Error(e.detail?.error || 'VFS error')); };
        function done() { clearTimeout(timer); appRoot.removeEventListener(responseEvent, ok); appRoot.removeEventListener(SGL_VFS.ERROR, err); }
        appRoot.addEventListener(responseEvent, ok);
        appRoot.addEventListener(SGL_VFS.ERROR, err);
    });
}
async function vfsWrite(path, content) {
    const requestId = newRequestId();
    appRoot.dispatchEvent(new CustomEvent(SGL_VFS.WRITE, { detail: { path, content, requestId }, bubbles: true }));
    return waitForResponse(requestId, SGL_VFS.WRITE_OK);
}
async function vfsRead(path) {
    const requestId = newRequestId();
    appRoot.dispatchEvent(new CustomEvent(SGL_VFS.READ, { detail: { path, requestId }, bubbles: true }));
    return waitForResponse(requestId, SGL_VFS.READ_OK);
}

// ── Session management ────────────────────────────────────────────────────────
function newSessionId() {
    const d = new Date();
    const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const rand = Math.random().toString(36).slice(2, 10);
    return `${date}-${rand}`;
}

function getSessionFolder(sid) {
    return `/voice-memos/${sid}`;
}

const STATUS_ICONS = { pass: '✓', fail: '✗', skip: '—', pending: '·' };

function buildSetupPanel(el) {
    el.innerHTML = `
<div class="panel-wrap">
  <div class="panel-scroll">

          <span id="tiny-badge"></span>
        </div>
        <div id="base-status" style="display:flex;justify-content:space-between">
          <span style="color:var(--sg-text-muted,#8892b0)">whisper-base.en</span>
          <span id="base-badge"></span>
        </div>
      </div>
    </div>
  </div>

    document.getElementById('btn-setup').addEventListener('click', () => runSetup());
}

async function runSetup() {
    const btn     = document.getElementById('btn-setup');
    const progress= document.getElementById('setup-progress');
    const fill    = document.getElementById('setup-fill');
    const checks  = document.getElementById('setup-checks');
    const result  = document.getElementById('setup-result');
    const modelSt = document.getElementById('model-status');

    btn.disabled = true;
    btn.textContent = 'Running checks…';
    progress.style.display = 'block';
    checks.style.display   = 'block';
    checks.innerHTML = '';
    result.style.display = 'none';

    const TOTAL = 10;
    const rows  = [];

    // Pre-render pending rows
    const LABELS = [
        'WebAssembly support','Web Worker support','AudioContext support',
        'MediaRecorder support','Microphone permission',
        'Load model: whisper-tiny.en (~39 MB)',
        'Transcription test (tiny.en)',
        'Load model: whisper-base.en (~74 MB)',
        'Transcription test (base.en)',
        'WebGPU acceleration',
    ];
    LABELS.forEach(label => {
        const div = document.createElement('div');
        div.className = 'setup-check';
        div.innerHTML = `<span class="chk-icon pending">${STATUS_ICONS.pending}</span>`
            + `<span class="chk-label">${label}</span>`
            + `<span class="chk-detail"></span>`;
        checks.appendChild(div);
        rows.push(div);
    });

    const { passed, tinyModel: tm, baseModel: bm, results } = await whisperHealthCheck(({ step, total, label, status }) => {
        fill.style.width = Math.round(((step + 1) / total) * 100) + '%';
        const row = rows[step];
        if (!row) return;
        const icon = row.querySelector('.chk-icon');
        icon.textContent = STATUS_ICONS[status] ?? STATUS_ICONS.pending;
        icon.className   = 'chk-icon ' + (status === 'pending' ? 'pending' : status);
        row.querySelector('.chk-label').textContent = label.replace(/ — \d+%$/, '');
    });

    // Fill in details
    results.forEach((r, i) => {
        const row = rows[i];
        if (!row) return;
        const icon = row.querySelector('.chk-icon');
        icon.textContent = STATUS_ICONS[r.status];
        icon.className   = 'chk-icon ' + r.status;
        row.querySelector('.chk-detail').textContent = r.detail + (r.latencyMs > 0 ? ` (${r.latencyMs}ms)` : '');
    });

    fill.style.width = '100%';
    result.style.display = 'block';
    if (passed) {
        result.className = 'setup-result pass';
        result.textContent = '✓ Environment ready';
        btn.textContent = '✓ Ready';
    } else {
        result.className = 'setup-result fail';
        result.textContent = '✗ Some checks failed — transcription may be limited';
        btn.disabled = false;
        btn.textContent = 'Retry';
    }

    if (tm) { tinyModel = tm; }
    if (bm) { baseModel = bm; }

    modelSt.style.display = 'block';
    document.getElementById('tiny-badge').innerHTML =
        tm ? '<span class="pill pill-green">ready</span>' : '<span class="pill pill-amber">not loaded</span>';
    document.getElementById('base-badge').innerHTML =
        bm ? '<span class="pill pill-green">ready</span>' : '<span class="pill pill-amber">not loaded</span>';

    // Enable record button
    const btnRec = document.getElementById('btn-start-recording');
    if (btnRec) btnRec.disabled = false;
}

// ── Segment handler ────────────────────────────────────────────────────────────
async function onSegmentReceived(seg) {
    // 1. Write blob to VFS
    if (vfs && sessionFolder) {
        const name = `segment-${String(seg.index).padStart(3,'0')}.webm`;
        const reader = new FileReader();
        reader.readAsArrayBuffer(seg.blob);
        await new Promise(r => { reader.onloadend = r; });
        await vfsWrite(`${sessionFolder}/${name}`, reader.result);
    }

    // Update segment count display
    const label = document.getElementById('session-seg-label');
    if (label) label.textContent = seg.index;

    // 2. Queue for tiny.en transcription
    segQueue.push(seg);
    if (!transcribing) processTranscriptionQueue();
}

async function processTranscriptionQueue() {
    transcribing = true;
    while (segQueue.length > 0) {
        const seg = segQueue.shift();
        if (!tinyModel) continue;
        try {
            const result = await transcribeBuffer(tinyModel, seg.blob);
            appendCaption(seg.index, result.text, result.latencyMs, MODEL_TINY);
            await appendToTranscript(result.text);
        } catch (err) {
            appendCaption(seg.index, '', 0, MODEL_TINY);
        }
    }
    transcribing = false;
}

async function onRecordingStopped() {
    if (!baseModel || !sessionFolder) return;
    // TODO Phase 5: run base.en cleanup pass on full transcript
}

async function appendToTranscript(text) {
    const area = document.getElementById('transcript-area');
    if (!area || !text) return;
    area.value = area.value ? area.value + '\n' + text : text;
    // Auto-save
    if (sessionFolder && vfs) {
        await vfsWrite(`${sessionFolder}/transcript-live.md`, area.value);
    }
}
