<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — tools.sgraph.ai</title>
    <meta name="description" content="Browse, edit and save files in an SGraph zero-knowledge encrypted vault. Sub-tree model with encrypted metadata — CLI-compatible.">
    <link rel="icon" type="image/svg+xml" href="../../_common/favicon.svg">
    <link rel="stylesheet" href="../../_common/css/tools.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        sg-site-header { flex-shrink: 0; }
        #vault-bus {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        sg-layout { flex: 1; min-height: 0; }
        #manifest-bar { flex-shrink: 0; padding: 0 0.75rem 0.5rem; }
    </style>
</head>
<body>

<script type="module" src="/components/site-header/v1/v1.0/v1.0.2/sg-site-header.js"></script>
<sg-site-header site="Tools" home-url="../../"></sg-site-header>

<div id="vault-bus" data-vault-bus>
    <sg-layout id="layout"></sg-layout>
</div>

<div id="manifest-bar">
    <script type="module" src="../../_common/js/sg-tool-manifest.js"></script>
    <sg-tool-manifest src="manifest.json"></sg-tool-manifest>
</div>

<script type="module">
import '/core/sg-layout/v0.1.0/sg-layout.js';
import '/components/vault/sg-vault-connect/v0/v0.1/v0.1.2/sg-vault-connect.js';
import '/components/vault/sg-vault-tree/v0/v0.1/v0.1.2/sg-vault-tree.js';
import '/components/vault/sg-vault-viewer/v0/v0.1/v0.1.2/sg-vault-viewer.js';

// ── Layout definition ──────────────────────────────────────────────────────
//
//  ┌──────────────────────┬─────────────────────────────────────────────────┐
//  │   Vault Connection   │             File Viewer / Editor                │
//  │   (fixed 260px)      │                                                 │
//  │   File Tree (flex)   │                                                 │
//  └──────────────────────┴─────────────────────────────────────────────────┘

const LAYOUT = {
    type: 'row',
    sizes: [0.28, 0.72],
    children: [
        {
            type: 'column',
            sizes: [0.5, 0.5],
            children: [
                {
                    type: 'stack',
                    fixedSize: '260px',
                    tabs: [{ tag: 'sg-vault-connect', title: 'Connection', locked: true }],
                },
                {
                    type: 'stack',
                    tabs: [{ tag: 'sg-vault-tree', title: 'Files', locked: true }],
                },
            ],
        },
        {
            type: 'stack',
            tabs: [{ tag: 'sg-vault-viewer', title: 'File Viewer', locked: true }],
        },
    ],
};

customElements.whenDefined('sg-layout').then(() => {
    document.getElementById('layout').setLayout(LAYOUT);
});
</script>

</body>
</html>
