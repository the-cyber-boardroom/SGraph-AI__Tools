name: Deploy Tools UI to S3 (main)

# Deploys sgraph_ai_tools__static to S3 for CloudFront distribution.
#
# S3 path: websites/sgraph-tools/main/
#
# Same as dev workflow but triggered on main branch.

on:
  push:
    branches:
      - main
    paths:
      - 'sgraph_ai_tools__static/**'
      - 'scripts/**'
      - '.github/workflows/deploy-tools__main.yml'
      - 'sgraph_ai_tools/version'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - production

concurrency:
  group: "tools-deploy-${{ inputs.environment || 'main' }}"
  cancel-in-progress: false

env:
  AWS_REGION  : eu-west-2
  UI_VERSION  : v0.1.22
  SOURCE_DIR  : sgraph_ai_tools__static

jobs:
  deploy:
    name: "Deploy Tools to S3 (${{ inputs.environment || 'main' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read repo version
        id: version
        run: |
          VERSION=$(cat sgraph_ai_tools/version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Repo version: $VERSION"
          echo "IFD version:  ${{ env.UI_VERSION }}"

      - name: Resolve deployment environment
        id: env
        run: |
          DEPLOY_ENV="${{ inputs.environment || 'main' }}"
          if [ "$DEPLOY_ENV" == "production" ]; then
            echo "deploy_env=prod" >> $GITHUB_OUTPUT
            echo "dist_id=${{ secrets.SGRAPH_TOOLS__PROD__CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_env=main" >> $GITHUB_OUTPUT
            echo "dist_id=${{ secrets.SGRAPH_TOOLS__CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Inject build version
        run: python scripts/inject_build_version.py --version ${{ env.UI_VERSION }}

      - name: Generate i18n locale pages
        run: python scripts/generate_tools_i18n_pages.py --version ${{ env.UI_VERSION }}

      - name: Build layered IFD content
        run: |
          echo "Building layered IFD content (all versions merged into latest)"
          python scripts/build_ifd_latest.py \
            --source-dir ${{ env.SOURCE_DIR }} \
            --ifd-base tools/v0/v0.1 \
            --up-to ${{ env.UI_VERSION }}

      - name: Check AWS credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "WARNING: AWS credentials not configured — skipping deployment"
          else
            echo "has-credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.has-credentials == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id     : ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region            : ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: steps.check-creds.outputs.has-credentials == 'true'
        run: |
          python scripts/deploy_static_site.py \
            --site sgraph-tools \
            --version ${{ env.UI_VERSION }} \
            --source-dir ${{ env.SOURCE_DIR }} \
            --bucket ${{ secrets.SGRAPH_TOOLS__S3_BUCKET }} \
            --region ${{ env.AWS_REGION }} \
            --deploy-env ${{ steps.env.outputs.deploy_env }} \
            --cloudfront-distribution-id ${{ steps.env.outputs.dist_id }} \
            --skip-validation \
            --clean-urls \
            --clean-urls-source-version tools/v0/v0.1/_latest
